<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 4.17 — Mapas conceptuales virtuales y representación visual de conceptos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si un mapa conceptual muestra las relaciones entre ideas, ¿no es el mapa conceptual la herramienta visual más honesta del aprendizaje: la que revela exactamente qué entendemos y qué no? ¿Y por qué seguimos evaluando el aprendizaje con textos lineales cuando el conocimiento no es lineal?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El mapa conceptual es una representación gráfica que organiza conceptos mediante nodos (los conceptos) y líneas de enlace con palabras de conexión (las relaciones entre ellos), estructurados jerárquicamente desde los conceptos más generales a los más específicos. Su valor cognitivo reside en que obliga a explicitar las relaciones entre ideas: no se puede construir un mapa conceptual sin comprender la estructura del conocimiento que se representa. Los mapas conceptuales virtuales son los construidos con herramientas digitales (como CmapTools, prescripto en el DC, 2010, p. 29), que permiten edición colaborativa, vinculación con recursos multimedia y publicación en línea.</p>
<p>El Diseño Curricular incluye los mapas conceptuales virtuales como contenido del Módulo 4 (DC, 2010, p. 21) y prescribe su construcción como actividad didáctica transversal (DC, 2010, p. 24), lo que indica que se conciben tanto como objeto de aprendizaje visual como herramienta de aprendizaje para toda la materia. La representación visual de conceptos incluye además otras formas: diagramas, infografías, líneas de tiempo, cuadros sinópticos y redes semánticas, cada una adecuada a distintos tipos de conocimiento. El estudiante debe dominar varias formas de representación y elegir la adecuada según el tipo de relación que quiera mostrar.</p>
<p>Didácticamente, el contenido se trabaja con la construcción progresiva: los estudiantes construyen un mapa conceptual de un tema de otra materia (articulación transversal, DC, 2010, p. 24), primero en papel y luego en CmapTools, agregando jerarquías, conexiones y recursos multimedia. El mapa se evalúa tanto por su corrección conceptual (¿las relaciones son correctas?) como por su eficacia visual (¿se entiende?, ¿está bien organizado?). El cierre es la comparación: distintos equipos presentan sus mapas del mismo tema y se analiza cómo distintas representaciones producen distintas comprensiones.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Los mapas conceptuales y las herramientas de representación visual del conocimiento se usan en todos los niveles del sistema educativo argentino y en la investigación científica. La producción de infografías, diagramas y visualizaciones de datos es una competencia demandada en el periodismo, la ciencia y la gestión pública. Enseñar representación visual de conceptos es formar tanto estudiantes más eficaces como futuros profesionales capaces de comunicar conocimiento complejo en forma accesible.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes bahienses pueden aplicar los mapas conceptuales a problemas concretos de su ciudad: mapear el sistema productivo local (puerto, polo industrial, universidad, comercio), representar la estructura del gobierno municipal o diagramar las relaciones entre las instituciones educativas de la ciudad. Publicar esos mapas en el blog del curso o en un repositorio compartido los convierte en recursos de estudio colectivos y en una representación visual del conocimiento local producida por los propios estudiantes.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 4.18 — Presentaciones como constructoras de información en modo visual</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si una presentación debe comunicar ideas con imágenes y no con texto, ¿por qué la mayoría de las presentaciones escolares son textos leídos en voz alta? ¿Qué pasa con una audiencia cuando la presentación repite en la pantalla exactamente lo que el orador está diciendo?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La presentación digital es un género visual donde la información se organiza en secuencias de diapositivas que combinan texto mínimo, imagen, color y animación para acompañar una exposición oral. Su eficacia depende de un principio fundamental: la presentación no reemplaza al orador, lo complementa. Una buena presentación construye la información en modo visual: usa imágenes que ilustran y refuerzan, texto mínimo que ancla, gráficos que sintetizan datos y una estructura narrativa que guía a la audiencia. Una mala presentación duplica el texto oral, satura la pantalla y compite con el orador.</p>
<p>El Diseño Curricular incluye las presentaciones como contenido del Módulo 4 (DC, 2010, p. 21) y dedica una sección completa de sus tablas de intervención al software de presentaciones con tres niveles: principiante (crear diapositivas, insertar imágenes, administrar vistas), intermedio (WordArt, gráficos, botones de acción, guión para multimedia) y avanzado (diagramas, sonidos, videos, animaciones y transiciones) (DC, 2010, p. 27). La progresión indica que se espera un dominio técnico creciente, pero el contenido del Módulo 4 enfatiza la dimensión comunicativa: la presentación como construcción visual de información, no como ejercicio de software.</p>
<p>Didácticamente, el contenido se trabaja con la regla de la economía visual: cada diapositiva debe poder entenderse en tres segundos, el texto debe ser mínimo y la imagen debe hacer el trabajo comunicativo principal. Los estudiantes rediseñan una presentación sobrecargada de texto transformándola en una presentación visual eficaz, y luego producen sus propias presentaciones para los proyectos de la materia. La evaluación incluye tanto la calidad visual de las diapositivas como la coherencia entre lo visual y lo oral en la exposición.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Las presentaciones digitales son el formato estándar de comunicación en el ámbito académico, profesional y estatal argentino: defensas de tesis, informes de gestión, propuestas comerciales y comunicaciones oficiales se realizan mediante presentaciones. Dominar este género con criterios de eficacia visual y comunicativa es una competencia laboral y académica concreta. Enseñar presentaciones bien diseñadas es formar comunicadores eficaces en todos los ámbitos donde el conocimiento debe exponerse públicamente.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes bahienses producen presentaciones para múltiples destinatarios reales: exponer el diagnóstico de infraestructura tecnológica de la escuela ante el equipo directivo, presentar un proyecto comunitario ante la cooperadora, o defender el proyecto integrador anual ante un jurado. Cada una de esas instancias exige una presentación eficaz. Proponer que todas las presentaciones del curso se evalúen con una rúbrica visual explícita (economía de texto, calidad de imagen, coherencia narrativa) convierte el contenido en una competencia transversal de toda la materia.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 4.19 — Editores de video como transmisores de ideas a través de imágenes y videos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el video es el formato dominante de la cultura digital contemporánea, ¿no es editar video la forma más poderosa de escritura visual de nuestra época? ¿Y qué responsabilidades asume quien edita, sabiendo que el montaje puede hacer decir a las imágenes exactamente lo que el editor quiere?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El editor de video es la herramienta que permite montar, secuenciar, cortar, agregar transiciones, sonido, texto y efectos a material audiovisual, transformando tomas brutas en un relato con sentido. El montaje es la operación constitutiva del lenguaje audiovisual: la yuxtaposición de dos planos produce un significado que no está en ninguno de ellos por separado (el efecto Kuleshov), y las decisiones de edición (qué mostrar, qué omitir, en qué orden, con qué ritmo) son decisiones narrativas y éticas. El video es hoy el formato de mayor circulación en la cultura digital, y editarlo con conciencia técnica y ética es una competencia central de la alfabetización visual.</p>
<p>El Diseño Curricular incluye los editores de video como contenido del Módulo 4 (DC, 2010, p. 21) y prescribe el "diseño y armado de videos como conclusión del trabajo realizado" y su alojamiento en Internet como actividad didáctica (DC, 2010, p. 25), lo que indica que se espera producción y publicación. Los estudiantes deben comprender las operaciones básicas del montaje (importar, cortar, secuenciar, transicionar, sonorizar, exportar) y las decisiones narrativas que esas operaciones implican. El video no es solo un producto técnico: es un mensaje visual con autoría y responsabilidad.</p>
<p>Didácticamente, el contenido se trabaja con la producción de un corto documental o informativo: los estudiantes planifican, capturan material propio (con celulares o cámaras disponibles), editan un video breve sobre un tema local (un barrio, una institución, una problemática) y lo publican en el blog del curso o en una plataforma de video. La evaluación cubre el proceso completo: planificación (guión/story board, contenido que se verá en el Módulo 6), captura, edición y publicación. El cierre es la reflexión ética: ¿qué decisiones de montaje tomaron?, ¿qué mostraron y qué omitieron?, ¿qué responsabilidad tienen sobre lo que su video comunica?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una industria audiovisual reconocida internacionalmente y una producción de video comunitario, educativo y periodístico que se ha multiplicado con las herramientas digitales accesibles. El INCAA regula y fomenta la producción audiovisual nacional, y la Ley de Servicios de Comunicación Audiovisual promueve la producción local. Enseñar edición de video en la escuela pública es formar tanto espectadores críticos del lenguaje audiovisual como potenciales productores de contenidos con voz propia en el ecosistema mediático nacional.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene producción audiovisual local: realizadores independientes, productoras, canales locales y proyectos de video comunitario. Proponer a los estudiantes producir un corto documental sobre un tema bahiense (un barrio, un oficio en desaparición, una institución histórica, una problemática ambiental local) y publicarlo, convierte el contenido en una práctica de producción mediática local. El video resultante puede presentarse en espacios culturales de la ciudad o compartirse con los medios locales, cerrando el círculo entre escuela y comunidad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 4.20 — Programas para la edición de fotos, imágenes y videos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si editar una imagen es transformarla, ¿dónde termina el mejoramiento legítimo (ajustar luz, recortar, corregir color) y empieza la falsificación (borrar personas, alterar contextos, fabricar escenas)? ¿Y qué responsabilidad tiene quien edita cuando la imagen editada se viraliza como si fuera un documento de la realidad?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los programas de edición de imágenes y videos son las herramientas digitales que permiten modificar, componer y procesar material visual: editores de imagen fija (con operaciones de recorte, ajuste de color, retoque, composición por capas), editores de video (montaje, transiciones, sonorización) y herramientas de composición y efectos. El dominio técnico de estas herramientas incluye operaciones básicas (recortar, ajustar brillo/contraste/saturación, aplicar filtros, componer capas, exportar en el formato adecuado) y operaciones avanzadas (selección, retoque, composición, corrección de color). La elección de la herramienta depende de la tarea: no es lo mismo retocar una foto que componer un cartel o editar un documental.</p>
<p>El Diseño Curricular incluye los programas de edición como contenido del Módulo 4 (DC, 2010, p. 21) y en sus orientaciones didácticas prescribe la creación de presentaciones multimedia con "videos y fotos capturados por parte de los estudiantes a través de dispositivos destinados para tal fin" (DC, 2010, p. 25), lo que indica producción con material propio. El dominio de estas herramientas debe enseñarse junto con la reflexión ética sobre la edición: toda modificación de una imagen es una decisión con consecuencias comunicativas, y la frontera entre mejora y falsificación debe discutirse explícitamente.</p>
<p>Didácticamente, el contenido se trabaja con talleres de edición progresiva: los estudiantes capturan sus propias fotos (con celulares o cámaras) y las editan aplicando operaciones sucesivas (recorte, ajuste de color, composición), documentando cada decisión. Luego comparan la imagen original con la editada y discuten qué cambió y qué efecto produce. El cierre es la reflexión ética: presentar ejemplos de fotografía periodística editada excesivamente y debatir los límites de la edición legítima. La edición es una herramienta de comunicación, y como toda herramienta, su valor depende del uso.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina cuenta con software de edición libre y gratuito disponible (GIMP, Kdenlive, DaVinci Resolve en su versión gratuita) que democratiza el acceso a herramientas profesionales, y con una industria del software que produce herramientas creativas. La Ley de Propiedad Intelectual protege las obras fotográficas y audiovisuales, y la discusión sobre la edición de imágenes periodísticas y la deepfake es parte de la agenda pública. Enseñar edición con herramientas accesibles y con conciencia ética es formar productores visuales responsables en un contexto donde la manipulación de imágenes es técnicamente trivial y comunicativamente peligrosa.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes bahienses pueden aplicar la edición de imágenes a proyectos concretos de su ciudad: restaurar digitalmente fotografías históricas de Bahía Blanca (en articulación con archivos locales), producir material visual para una campaña comunitaria o editar imágenes para el blog del curso. Proponer un proyecto de memoria visual editada: seleccionar fotos antiguas de la ciudad, restaurarlas digitalmente y publicarlas con sus historias, convierte la edición de imágenes en un acto de preservación y divulgación del patrimonio visual bahiense.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 4.21 — Formato de archivo de imágenes: tipo y características</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si un JPEG pierde calidad cada vez que se guarda y un PNG no, ¿por qué la mayoría de las imágenes que circulan son JPEG? ¿Qué se gana y qué se pierde en cada formato, y quién decide qué formato es el adecuado para cada uso? ¿El formato de un archivo es una decisión técnica o una decisión económica y comunicativa?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los formatos de archivo de imagen definen cómo se codifica, almacena y reproduce la información visual digital, y cada formato implica compromisos específicos entre calidad, peso, compatibilidad y funcionalidad. Los principales son: JPEG (compresión con pérdida, ideal para fotografías, no soporta transparencia), PNG (compresión sin pérdida, soporta transparencia, ideal para gráficos y logos), GIF (limitado a 256 colores, soporta animación simple), SVG (gráfico vectorial escalable, ideal para iconos y logos que deben funcionar en cualquier tamaño), BMP (sin compresión, archivos pesados) y RAW (datos crudos del sensor fotográfico, máxima calidad para edición profesional). Elegir el formato correcto es una decisión técnica con consecuencias comunicativas y económicas.</p>
<p>El Diseño Curricular incluye "Formato de archivo de imágenes: tipo y características" como contenido del Módulo 4 (DC, 2010, p. 21) y en sus tablas de intervención multimedia ubica "Trabajar con los principales formatos de imagen, sonido y video" en el nivel principiante (DC, 2010, p. 29), lo que indica que el dominio de formatos es una competencia básica. Los estudiantes deben comprender tanto la dimensión técnica de cada formato (tipo de compresión, soporte de transparencia, escalabilidad) como la dimensión práctica (qué formato usar para una foto web, para un logo, para una impresión, para una animación). La elección de formato es una de las decisiones más frecuentes y menos conscientes de la producción visual digital.</p>
<p>Didácticamente, el contenido se trabaja con la comparación empírica: los estudiantes guardan la misma imagen en distintos formatos y comparan peso y calidad; amplían un JPEG y un SVG para ver la diferencia entre mapa de bits y vectorial; y analizan qué formato usa cada sitio web que visitan y por qué. El cierre es la aplicación: los estudiantes deben justificar la elección de formato para cada pieza visual que producen en la materia, demostrando que el formato no es un detalle técnico sino una decisión comunicativa fundamentada.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La elección de formatos tiene implicancias de acceso y soberanía tecnológica: los formatos abiertos (PNG, SVG, WebP) garantizan la interoperabilidad y la preservación a largo plazo, mientras que los formatos propietarios pueden generar dependencia de software específico. El Estado argentino promueve el uso de estándares abiertos en sus portales y documentos, y la Ley de Accesibilidad Web (26.653) exige que los contenidos públicos sean accesibles, lo que incluye decisiones de formato. Enseñar formatos con conciencia de apertura y accesibilidad es formar productores visuales responsables con la preservación y el acceso universal.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los sitios web y materiales visuales de las instituciones bahienses (municipio, medios, clubes, escuelas) usan formatos que pueden analizarse: ¿qué formato usan para sus logos?, ¿sus imágenes son accesibles y cargan rápido?, ¿usan formatos abiertos? Proponer a los estudiantes auditar los formatos de imagen de los sitios locales y producir una guía de buenas prácticas de formato visual para las instituciones de la ciudad, convierte el contenido técnico en una herramienta de mejora concreta para la comunicación digital local.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.1 — Concepto de comunicación digital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Comunicarse digitalmente es simplemente transmitir datos a través de una pantalla, o es habitar un nuevo ecosistema de signos donde el silencio, el "visto" y el tiempo de respuesta son mensajes tan potentes como las palabras?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La comunicación digital no es la mera digitalización de la comunicación humana tradicional, sino un nuevo paradigma donde el mensaje se codifica en lenguaje binario, se desmaterializa de su soporte físico original y viaja a través de redes telemáticas. Esto altera las condiciones clásicas de la comunicación: la co-presencia física ya no es requisito, el tiempo puede ser sincrónico o asincrónico, y los canales se multiplican (texto, audio, video, metadatos). A diferencia de la comunicación analógica, la digital deja siempre una "huella de datos" (logs, metadatos) que puede ser almacenada, indexada y analizada por terceros (plataformas, Estados, corporaciones).</p>
<p>Didácticamente, este contenido exige desnaturalizar las prácticas cotidianas de los estudiantes. El Diseño Curricular espera que "comprendan el concepto de comunicación" (DC, 2010, p. 22) no como una definición de diccionario, sino como una práctica situada. Se propone la actividad de la "autopsia de un chat": los estudiantes exportan y analizan una conversación grupal de WhatsApp, identificando no solo lo que se dijo (el contenido manifiesto), sino las reglas implícitas del grupo, los tiempos de latencia, el uso de stickers como reguladores emocionales y la jerarquía de los participantes. La comunicación digital se revela así como un tejido de protocolos técnicos y sociales.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> En Argentina, la comunicación digital ha reconfigurado el tejido social y político. La penetración de WhatsApp es casi universal, convirtiéndose en la infraestructura de comunicación por defecto para la familia, el trabajo, la escuela y la organización política. Sin embargo, esta dependencia de una plataforma privada extranjera plantea desafíos de soberanía comunicacional y privacidad. El debate sobre el uso de datos por parte de las Big Tech y la regulación de la intermediación digital son temas centrales en la agenda de la ENACOM y de las organizaciones de la sociedad civil argentinas.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca, la comunicación digital es el nervio de la organización comunitaria y comercial: desde los grupos de Facebook de "Compra-Venta" y "Alerta Bahía Blanca" hasta las redes institucionales del municipio y la UNS. Proponer a los estudiantes que mapeen los "ecosistemas comunicativos" de distintos barrios de la ciudad (cómo se comunican los vecinos para reclamar por un bache vs. cómo se comunican los estudiantes para organizar un centro de estudiantes) permite visualizar cómo la tecnología se adapta a las necesidades territoriales específicas.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.2 — Modelos y componentes del proceso comunicativo digital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el clásico modelo lineal de Emisor-Mensaje-Receptor fue diseñado para líneas telefónicas unidireccionales, ¿cómo explicamos la comunicación en red, donde todos emiten, reciben, modifican el mensaje y son filtrados por algoritmos que deciden quién escucha a quién?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los modelos del proceso comunicativo digital exigen superar la linealidad de Shannon y Weaver o Jakobson para abrazar modelos reticulares, ecosistémicos y algorítmicos. En la comunicación digital, los componentes clásicos mutan: el "emisor" y el "receptor" se fusionan en el prosumidor; el "canal" ya no es un tubo pasivo sino una plataforma con arquitectura propia que modula el mensaje; el "código" incluye lenguajes de programación y diseño de interfaces (UI/UX); y aparece un nuevo componente invisible pero omnipresente: el algoritmo de recomendación y moderación, que actúa como un mediador que filtra, prioriza o censura el mensaje antes de que llegue al destinatario.</p>
<p>El Diseño Curricular exige "identificar modelos y componentes involucrados en el proceso de comunicación" (DC, 2010, p. 22). Didácticamente, se trabaja contrastando un modelo clásico con uno digital: los estudiantes dibujan el esquema de una carta postal y luego el esquema de un posteo en Instagram. Deben incluir en el segundo esquema los servidores, los metadatos de geolocalización, los algoritmos de feed y los "me gusta" como feedback instantáneo. Este ejercicio visualiza el poder de las plataformas: no son canales neutrales, son arquitecturas que modelan la interacción.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La investigación en comunicación en Argentina (desde las cátedras de la UBA, la UNLP y la UNS) ha documentado cómo los modelos de comunicación de masas tradicionales están siendo reemplazados por la "comunicación algorítmica". La polarización política y la formación de burbujas de filtro en el electorado argentino son consecuencias directas de estos nuevos modelos, donde el feedback loop (bucle de retroalimentación) radicaliza las posturas al mostrar a cada usuario solo lo que confirma sus sesgos previos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Para anclar este concepto, los estudiantes pueden analizar cómo una misma noticia local (por ejemplo, una medida de fuerza gremial en el puerto o un evento cultural en el Teatro Municipal) es "modelada" de forma distinta según el canal: el diario impreso (modelo lineal/masivo), el portal web con comentarios (modelo interactivo) y el hilo de Twitter/X o TikTok (modelo reticular/algorítmico). Comparar estos modelos revela cómo la ciudad se construye discursivamente de maneras distintas según la arquitectura de la plataforma.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.3 — Medios técnicos y competencia comunicativa</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Tener el último smartphone y saber editar un Reel nos hace "competentes" comunicativamente, o solo nos convierte en usuarios veloces de interfaces diseñadas por corporaciones para extraer nuestra atención?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La competencia comunicativa en la era digital trasciende el dominio instrumental de los medios técnicos (saber usar la app, configurar la cámara, editar el audio). Implica la capacidad pragmática y ética de saber qué decir, a quién, por qué canal, con qué código y bajo qué normas de etiqueta (netiquette), adaptando el mensaje al contexto y anticipando sus efectos. Un estudiante puede ser un genio editando videos (dominio técnico) pero un desastre comunicando una idea compleja en un foro académico o ofendiendo a un par en un grupo de trabajo (falta de competencia comunicativa).</p>
<p>El Diseño Curricular pone el foco en que los estudiantes "desarrollen habilidades de comunicación digital colaborativa" (DC, 2010, p. 22). Didácticamente, esto se aborda mediante juegos de rol de registro y contexto: se asigna a los estudiantes una misma información (ej. "mañana no hay clases por un corte de luz") y deben comunicarla usando distintos medios técnicos y a distintos destinatarios (un WhatsApp a un amigo, un correo formal al director, un posteo público en la página de la cooperadora, un hilo en Twitter). La evaluación no recae en la "belleza" del mensaje, sino en la adecuación pragmática al medio técnico elegido y a la audiencia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> En el ámbito laboral y académico argentino, la falta de competencia comunicativa digital es una barrera frecuente: jóvenes con altas habilidades técnicas que fracasan en entrevistas laborales por su huella digital, o estudiantes universitarios que no dominan la formalidad del correo electrónico institucional. El sistema educativo bonaerense, a través de materias como NTICx y Prácticas del Lenguaje, busca cerrar esta "brecha de segundo nivel" (la brecha de los usos significativos frente a los usos meramente lúdicos o sociales).</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las escuelas bahienses, la competencia comunicativa se pone a prueba diariamente en la relación familia-escuela. Proponer a los estudiantes que redacten un "Manual de Competencia Comunicativa Digital para la Comunidad Educativa" (cómo y cuándo escribirle a un docente por WhatsApp, cómo usar los canales oficiales de la escuela, cómo evitar la saturación de los grupos de padres) convierte el contenido en un servicio de convivencia institucional real, mejorando el clima escolar mediante la alfabetización pragmática.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.4 — Ubicuidad: una nueva forma de comunicación</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si podemos estar "presentes" en todos lados sin movernos, ¿dónde termina el espacio físico y dónde empieza el espacio digital? ¿Qué pasa con nuestra atención y nuestra empatía cuando el "aquí" y el "allá" se superponen constantemente en la palma de nuestra mano?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La ubicuidad es la característica de las redes móviles y los dispositivos portátiles que permite la comunicación y el acceso a la información en cualquier momento y lugar (anytime, anywhere). Esto disuelve las fronteras tradicionales entre el tiempo de trabajo/estudio y el tiempo de ocio, y entre el espacio público y el privado. Autores como Cobo Romaní hablan del "aprendizaje ubicuo" y la "comunicación ubicua", donde el conocimiento y la interacción social fluyen de manera capilar, desanclándose de las instituciones físicas (el aula, la oficina).</p>
<p>El Diseño Curricular incluye la ubicuidad como "una nueva forma de comunicación" (DC, 2010, p. 21). Didácticamente, se aborda mediante el mapeo de la atención: los estudiantes registran durante 24 horas en qué momentos y lugares físicos se "teletransportan" digitalmente (ej. "estaba en la mesa familiar pero mirando un video; estaba en el colectivo pero chateando"). El debate posterior es profundo: la ubicuidad nos da libertad y conexión, pero también genera la "ansiedad de la desconexión" (FOMO) y la dificultad para habitar el presente físico. La alfabetización aquí es aprender a gestionar la propia disponibilidad.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La ubiquidad en Argentina está sostenida por la altísima penetración de la telefonía móvil y las redes Wi-Fi públicas y privadas. Sin embargo, esta ubiquidad es desigual: mientras en los centros urbanos la conexión es permanente, en las zonas rurales o en los viajes por las rutas nacionales la desconexión forzada recuerda que la ubicuidad es un privilegio de infraestructura. Además, la Ley de Teletrabajo argentina tuvo que establecer el "derecho a la desconexión digital" precisamente para frenar los abusos de la ubicuidad laboral.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca, con su trazado urbano y sus espacios públicos, es un escenario ideal para estudiar la ubicuidad. Los estudiantes pueden realizar un trabajo de campo observacional en la Plaza Rivadavia, en la terminal de ómnibus o en el campus de la UNS (Palihue): ¿cuántas personas están físicamente presentes pero digitalmente ausentes? ¿Cómo el Wi-Fi gratuito municipal transforma el uso de los bancos de la plaza? Este registro etnográfico local ancla el concepto filosófico de la ubicuidad en la vida cotidiana de la ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.5 — Tercer entorno: nueva configuración social</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el filósofo Javier Echeverría define el ciberespacio como un "Tercer Entorno" (E3) distinto de la naturaleza (E1) y la ciudad (E2), ¿estamos construyendo en este nuevo territorio una sociedad con derechos y democracia, o una colonia digital donde las leyes las escriben los términos y condiciones de empresas extranjeras?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El concepto de Tercer Entorno (E3), acuñado por Javier Echeverría (y referenciado en la bibliografía y enfoque del Diseño Curricular), postula que las redes telemáticas han generado un nuevo espacio de interacción social, económica y política, con sus propias reglas, arquitecturas y formas de poder. A diferencia del primer entorno (natural) y el segundo (urbano/industrial), el Tercer Entorno es artificial, desterritorializado y requiere prótesis tecnológicas para ser habitado. En el E3, la identidad es múltiple, la memoria es externa (en los servidores) y la economía se basa en los datos y la atención.</p>
<p>Enseñar el Tercer Entorno es enseñar ciudadanía digital en su nivel más estructural (conectando con el Módulo 7). Didácticamente, se propone el debate de la "Constitución del Tercer Entorno": si los estudiantes tuvieran que fundar una nueva sociedad digital desde cero, ¿qué derechos garantizarían? ¿Cómo resolverían los delitos, la propiedad y la privacidad? Al contrastar esta "utopía" con la realidad actual del E3 (monopolios de plataformas, vigilancia masiva, algoritmos opacos), los estudiantes comprenden que el ciberespacio no es un lugar mágico, sino un territorio en disputa política.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina habita el Tercer Entorno con sus propias contradicciones: es un país con una sociedad civil digital muy activa (ONGs como la Asociación por los Derechos Civiles o Vía Libre luchan por la neutralidad de la red y la privacidad), pero con una fuerte dependencia de las infraestructuras del E3 controladas desde Silicon Valley. La economía del conocimiento argentina (software, servicios globales) es una de las principales exportadoras de valor en este Tercer Entorno, lo que obliga al Estado a generar marcos regulatorios que protejan a los trabajadores y a los datos nacionales.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Para los jóvenes bahienses, el Tercer Entorno es donde ocurre gran parte de su socialización y economía: los grupos de Discord, los servidores de Minecraft, la compra-venta en Marketplace, el streaming de Twitch de creadores locales. Proponer que analicen las "leyes" de las comunidades virtuales que habitan (¿quién modera un servidor de Discord?, ¿qué pasa si te banean?, ¿a quién reclamas?) les permite experimentar en carne propia que el Tercer Entorno tiene sus propias jurisdicciones y que, muchas veces, carecen de las garantías del Estado de derecho.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 5 · TRAMO B (5.6–5.9) ===== */
TEORIA_ADI[4].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.6 — Análisis de medios digitales: fuentes, técnicas, códigos, naturaleza de la realidad, valores, intencionalidad, lenguaje</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando un medio digital nos muestra "la realidad" a través de una pantalla, ¿estamos viendo el mundo o estamos viendo la interfaz ideológica, económica y algorítmica de quien programó la plataforma? ¿Cómo se construye la "verdad" en un ecosistema diseñado para la viralidad y no para la veracidad?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El análisis de medios digitales es el núcleo de la Alfabetización en Medios (AM), una de las metodologías prescriptas por el DC (DC, 2010, p. 12). Implica desarmar la aparente transparencia de la pantalla para revelar las técnicas y códigos de producción (encuadre, edición, algoritmos de tendencia), la naturaleza de la realidad construida (los medios no reflejan la realidad, la "enmarcan" o framing), los valores e intencionalidad (quién financia el medio, qué audiencia busca, qué ideología naturaliza) y el lenguaje específico de lo digital (hipertextualidad, multimedia, interactividad).</p>
<p>Didácticamente, se utiliza la técnica del "doble clic analítico": tomar una noticia viral en redes sociales y hacer un primer clic para ver la noticia, y un "segundo clic" (metafórico) para ver quién la publicó, qué fuentes cita, qué omitió, qué emociones busca despertar (indignación, miedo) y cómo el algoritmo de la red social la posicionó en el feed. El Diseño Curricular espera que los estudiantes "analicen el lenguaje implícito y explícito de los medios" (DC, 2010, p. 22). Esta práctica inmuniza contra la desinformación y el clickbait.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina atraviesa una crisis de confianza en los medios tradicionales y una explosión de desinformación en redes. El trabajo de verificadores de datos (chequeadores) y los observatorios de medios de las universidades nacionales son fundamentales para contrarrestar la posverdad. Enseñar a los estudiantes a ser sus propios "fact-checkers" es una herramienta de defensa democrática esencial en un país donde las batallas políticas y económicas se libran ferozmente en el terreno de los significados digitales.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes pueden aplicar este análisis a los medios locales: comparar cómo un mismo hecho policial o político es titulado y enfocado por los distintos portales de noticias de Bahía Blanca. ¿Qué palabras eligen? ¿A quién entrevistan? ¿Qué fotos usan? Este ejercicio de análisis comparativo de la prensa local no solo desarrolla el pensamiento crítico, sino que los hace conscientes de su propio rol como consumidores y potenciales productores de información en su ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.7 — Mass media: medios masivos de comunicación</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Sigue existiendo el "público masivo" homogéneo al que se dirigía la televisión del siglo XX, o los mass media tradicionales se han rendido y fragmentado para sobrevivir como meros proveedores de contenido para las redes sociales?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los Mass Media (medios masivos de comunicación: prensa, radio, cine, TV) operaron durante décadas bajo el modelo broadcasting (uno a muchos, asimétrico, centralizado). En la era digital, este modelo entra en crisis frente a la comunicación en red (muchos a muchos). Sin embargo, los mass media no desaparecen: mutan. Se convierten en "marcas" que distribuyen sus contenidos a través de las plataformas digitales (YouTube, Spotify, redes sociales), adaptando sus formatos a la lógica de la inmediatez, el fragmento y la interactividad forzada.</p>
<p>El Diseño Curricular pide "analizar el impacto de Internet en los nuevos medios de comunicación (mass media)" (DC, 2010, p. 22). Didácticamente, se aborda mediante la arqueología de los consumos mediáticos familiares: los estudiantes entrevistan a sus padres y abuelos sobre cómo consumían noticias y entretenimiento, y lo contrastan con su propio consumo actual (streaming, podcasts, TikTok). El debate central es la fragmentación de las audiencias: ya no hay "eventos nacionales" que todos vean al mismo tiempo, sino nichos algorítmicos que dificultan la construcción de una agenda pública compartida.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La Ley de Servicios de Comunicación Audiovisual (26.522) y sus posteriores modificaciones (DNU 236/15 y DNU 690/20) intentaron regular este ecosistema en transición, debatiendo entre la concentración de los grandes grupos mediáticos nacionales y la democratización de la palabra. Hoy, el desafío argentino es cómo sostener el periodismo de investigación y la producción cultural local cuando la publicidad se fuga hacia los duopolios globales (Google y Meta).</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene una rica historia de mass media locales (Canal 9, LU2 Radio Bahía Blanca, ABC, La Nueva). Proponer a los estudiantes que investiguen cómo estas instituciones históricas están sobreviviendo en la era digital (¿tienen podcasts? ¿hacen streaming en vivo por YouTube? ¿cómo monetizan sus redes?) les muestra la realidad económica y cultural de la industria mediática en su propia ciudad, y la importancia de sostener medios locales frente a la homogeneización global.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.8 — Sistemas de videoconferencia</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la videoconferencia simula el "cara a cara" pero nos reduce a rectángulos de píxeles y nos obliga a mirarnos a nosotros mismos en la pantalla, ¿qué dimensión de la empatía y el lenguaje corporal perdemos en la traducción digital, y qué nueva etiqueta debemos inventar?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los sistemas de videoconferencia (VoIP con video: Zoom, Meet, Teams) son herramientas de comunicación sincrónica que permiten la interacción audiovisual a distancia. Su análisis requiere comprender tanto su infraestructura técnica (ancho de banda, latencia, compresión de video) como su impacto cognitivo y social. La "fatiga de Zoom" está documentada: el cerebro se agota al tener que procesar señales no verbales limitadas, al mantener contacto visual artificial y al lidiar con la disonancia de estar "físicamente en una habitación y socialmente en otra".</p>
<p>El DC sugiere la "realización de videoconferencias mediante software VoIP, como modelo comunicativo para la realización de prácticas comunicacionales sincrónicas" (DC, 2010, p. 25). Didácticamente, no se trata solo de "usar" la herramienta, sino de producir un evento sincrónico: los estudiantes deben organizar, moderar y grabar un webinar o entrevista a distancia (por ejemplo, a un especialista de otra ciudad). Deben gestionar los roles (moderador, técnico de sonido, chat), los tiempos y las contingencias técnicas, experimentando la complejidad de la comunicación mediada en tiempo real.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La pandemia por COVID-19 y el ASPO (Aislamiento Social, Preventivo y Obligatorio) convirtieron a la videoconferencia en la infraestructura de supervivencia del sistema educativo, judicial y sanitario argentino. Esta adopción forzada dejó lecciones profundas sobre la brecha de conectividad y la necesidad de pensar la pedagogía y la telemedicina no como meros parches de emergencia, sino como modalidades con gramáticas propias que requieren formación específica.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La UNS y la UTN Regional Bahía Blanca utilizan intensivamente estos sistemas para clases, defensas de tesis y conferencias internacionales. Una actividad potente es conectar el aula de NTICx con una escuela secundaria de otra región del país (por ejemplo, una escuela rural de la Patagonia o del NOA) mediante videoconferencia. Este intercambio cultural sincrónico permite a los estudiantes bahienses experimentar la ubicuidad, contrastar realidades territoriales y practicar la competencia comunicativa en un entorno formal y colaborativo.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.9 — Periodismo digital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si en el periodismo digital el "clic" es la moneda de cambio y el titular debe competir con el meme y el video de 15 segundos, ¿cómo sobreviven la jerarquía de la noticia, la verificación de fuentes y el interés público frente a la tiranía del algoritmo?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El periodismo digital se caracteriza por la hipertextualidad, la multimedia, la interactividad y la actualización constante (inmediatez). A diferencia del diario impreso, donde el editor decidía la jerarquía por el tamaño y la ubicación en la página, en el digital la jerarquía la dictan los clics, el SEO (posicionamiento en buscadores) y las tendencias de redes. Esto genera tensiones éticas: la tentación del clickbait (titulares engañosos), la publicación sin verificación para "llegar primero" y la precarización de la figura del periodista, que ahora debe ser redactor, fotógrafo, editor de video y community manager.</p>
<p>El Diseño Curricular incluye el periodismo digital como un medio a analizar críticamente. Didácticamente, se propone el taller de "Redacción para Redes vs. Redacción Periodística": dada una noticia de interés local, los estudiantes deben redactar tres versiones: un hilo de Twitter/X (inmediatez, síntesis), un posteo de Instagram (visual, emocional) y una nota para el portal web (profundidad, hipervínculos a fuentes). Luego se debate: ¿qué se pierde en cada formato? ¿Cómo asegurar la veracidad en 280 caracteres?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El periodismo argentino atraviesa una crisis de sostenibilidad económica. Los grandes diarios nacionales han levantado sus versiones impresas o las han reducido, migrando a modelos de paywall (suscripción) o dependiendo de la pauta oficial y privada en redes. Paralelamente, han surgido medios digitales nativos, cooperativos y de investigación (como El Destape, Tiempo Argentino digital, o portales provinciales) que buscan nuevos modelos de negocio y relación con la audiencia.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca cuenta con redacciones locales que lidian con esta transición. Invitar a un periodista digital de un medio bahiense (o visitar sus instalaciones) para que explique cómo se decide el "Home" del portal, cómo usan las métricas de audiencia y cómo verifican los videos que les mandan por WhatsApp los vecinos, acerca la teoría a la práctica. Los estudiantes pueden luego armar un blog de periodismo escolar cubriendo eventos de la escuela o el barrio, aplicando las rutinas productivas del periodismo digital.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 5 · TRAMO C (5.10–5.13) ===== */
TEORIA_ADI[4].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.10 — Webquest: búsquedas de información orientadas</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si Internet es un laberinto de información caótica, ¿la WebQuest es el hilo de Ariadna que nos guía al conocimiento, o es una "jaula dorada" que limita nuestra curiosidad a los enlaces que el docente ya pre-seleccionó y validó?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La WebQuest, metodología desarrollada por Bernie Dodge, es una actividad de investigación guiada donde la información proviene fundamentalmente de recursos de la web preseleccionados. Su estructura clásica incluye: Introducción, Tarea, Proceso, Recursos, Evaluación y Conclusión. Su valor pedagógico no está en la búsqueda libre (que puede llevar a la frustración o a fuentes falsas), sino en el andamiaje cognitivo: el docente diseña una tarea de alto nivel (análisis, síntesis, creación) y provee los recursos para que el estudiante dedique su energía a procesar la información y no a encontrarla.</p>
<p>Aunque el DC la menciona también en el Módulo 3 (búsqueda), en el Módulo 5 se enfoca como herramienta de comunicación y colaboración. Didácticamente, los estudiantes no solo deben resolver una WebQuest, sino que en el nivel avanzado deben diseñar una WebQuest para alumnos de años inferiores (por ejemplo, de 1ro o 2do año). Diseñar la tarea, curar los enlaces, armar la rúbrica de evaluación y el andamiaje los coloca en el rol de arquitectos del aprendizaje, profundizando su comprensión de la gestión de la información y la comunicación educativa.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El portal Educ.ar y las plataformas de la provincia de Buenos Aires (como ABC o Continuar Estudiando) han utilizado históricamente el formato WebQuest y secuencias didácticas similares para estructurar el aprendizaje mediado por tecnología. En un país con brechas de conectividad, la WebQuest es una herramienta valiosa porque puede descargarse para su uso asincrónico (offline), optimizando el tiempo de conexión a internet en zonas vulnerables.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes de 4to año pueden diseñar WebQuests situadas sobre problemáticas bahienses: "El impacto ambiental del Polo Petroquímico", "La historia de la inmigración en Ingeniero White" o "La arquitectura art déco del centro de Bahía Blanca". Estas WebQuests, una vez validadas por el docente, pueden ser donadas a las bibliotecas escolares o a los docentes de Historia y Geografía de la institución, generando un repositorio de recursos educativos abiertos (REA) de producción local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.11 — Medios colaborativos sociales (weblogs, wikis, edublog, blogosfera, blogonauta, blogging, blogofolio, fotolog, redes sociales digitales)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la Web 2.0 nos prometió la democratización de la voz a través de blogs y wikis, ¿por qué hoy esa voz ha migrado a los muros cerrados y algorítmicos de tres o cuatro redes sociales corporativas? ¿Perdimos la web abierta a cambio de la comodidad del "like"?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Este contenido abarca la evolución de los medios colaborativos: desde la blogosfera (la red abierta de weblogs interconectados por hipervínculos y RSS, donde el usuario era dueño de su dominio y su contenido) hasta la hegemonía de las redes sociales digitales (plataformas cerradas donde el contenido es efímero y pertenece a la empresa). El DC incluye conceptos específicos como edublog (blog educativo), blogofolio (portafolio de trabajos en formato blog), wikis (escritura colaborativa sin jerarquías) y fotologs (históricos precursores de Instagram). Comprender esta genealogía es vital para entender la pérdida de soberanía sobre los propios datos.</p>
<p>Didácticamente, el Diseño Curricular prescribe la "construcción de blog con fines educativos" y la "creación de soluciones mediante escritura colaborativa (wiki)" (DC, 2010, p. 24). La propuesta es doble: 1) Crear un Wiki del curso donde se construya colaborativamente el glosario vivo de la materia o la enciclopedia de NTICx. 2) Que cada estudiante inicie su Blogofolio Digital, un espacio personal (en WordPress o Blogger) donde documente sus proyectos, reflexiones y producciones a lo largo del año. El blogofolio es la herramienta de evaluación procesual por excelencia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tuvo una de las blogosferas más vibrantes de la región en los años 2000, con blogs que marcaron la agenda política y cultural. Hoy, esa energía migró a Twitter/X, Instagram y TikTok. Sin embargo, el movimiento de Software Libre y las cooperativas tecnológicas en Argentina siguen defendiendo la web abierta, el uso de WordPress autoalojado y las redes sociales federadas (como Mastodon). Enseñar la diferencia entre un blog propio y un perfil de Instagram es enseñar la diferencia entre alquilar un espacio y ser propietario de tu voz digital.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El Blogofolio de los estudiantes bahienses puede convertirse en una vidriera de talentos locales. Al finalizar el año, se puede organizar una "Feria de Blogofolios" virtual o presencial donde los estudiantes muestren sus portafolios a referentes de empresas de software, medios de comunicación y universidades de Bahía Blanca. Esto vincula la alfabetización en medios colaborativos con la inserción laboral y la continuidad de estudios superiores, uno de los fines de la Escuela Secundaria.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.12 — Plataformas virtuales de aprendizaje, campus virtuales o entornos virtuales de aprendizaje (EVA)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Un campus virtual es una extensión democrática de la escuela que rompe los muros, o es una arquitectura de panóptico digital donde cada clic, cada tiempo de lectura y cada error del estudiante es medido, cronometrado y vigilado por el sistema?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los Entornos Virtuales de Aprendizaje (EVA) o LMS (Learning Management Systems, como Moodle, Canvas, Classroom) son plataformas que estructuran la asincronía educativa. Proveen espacios para la distribución de materiales, foros de debate, wikis, entregas de tareas y calificaciones. Su análisis crítico implica entender su arquitectura pedagógica: ¿fomentan el aprendizaje colaborativo o la mera entrega de tareas individuales? ¿permiten la construcción colectiva o son repositorios verticales? El DC espera que los estudiantes no solo sean usuarios, sino que comprendan la lógica de estos entornos.</p>
<p>Didácticamente, dado que los estudiantes ya usan estas plataformas como alumnos, la actividad consiste en cambiarlos de rol: deben diseñar un módulo de curso dentro del EVA de la escuela (o en un Moodle de prueba) para enseñar un tema a sus compañeros. Deben configurar los foros, subir los recursos, diseñar las rúbricas y las actividades colaborativas. Al pasar de "alumno" a "arquitecto del entorno", comprenden las limitaciones y potencias de la virtualidad estructurada.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Las universidades públicas argentinas (incluida la UNS y la UTN) y el sistema educativo provincial dependen fuertemente de Moodle y plataformas similares. Durante la pandemia, estos EVA soportaron el peso de la continuidad pedagógica. El debate actual en la academia argentina gira en torno a las "analíticas de aprendizaje" (learning analytics): el uso de los datos que estas plataformas recogen para predecir deserción o personalizar contenidos, y los riesgos éticos de la perfilación algorítmica de los estudiantes.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Dado que el campus virtual de la UNS y la UTN será el destino inmediato de muchos egresados de 4to año, la alfabetización en EVA es una preparación para la vida universitaria. Se puede proponer un taller de supervivencia en el campus universitario: invitar a un estudiante avanzado o docente de la UNS para que muestre cómo se organiza un curso universitario virtual, cómo se participan en los foros académicos y cómo se gestionan los bibliografías digitales, cerrando la brecha entre la escuela secundaria y la universidad local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 5.13 — Herramientas colectivas de comunicación: sincrónicas (chat, IRC, mensajería instantánea, mundos virtuales) y asincrónicas (listas de distribución y foros de discusión)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Elegimos realmente el tiempo de nuestra comunicación, o la urgencia del chat y la notificación push nos ha esclavizado a la respuesta inmediata, matando la reflexión pausada, el debate profundo y la memoria que permiten los foros asincrónicos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El Diseño Curricular exige manejar y distinguir las herramientas colectivas según su temporalidad (DC, 2010, p. 22). Las sincrónicas (chat, IRC, WhatsApp, Discord, y los mundos virtuales gráficos 3D mencionados en la nota 12 del DC, como Roblox o Minecraft) exigen co-presencia temporal, favorecen la inmediatez, la emocionalidad y la toma rápida de decisiones, pero dificultan la argumentación compleja. Las asincrónicas (foros, listas de correo, Reddit, comentarios en blogs) permiten el tiempo diferido, favoreciendo la reflexión, la investigación previa, la cita de fuentes y la construcción de memoria colectiva (el hilo no se pierde en el scroll).</p>
<p>Didácticamente, se propone el experimento de la dualidad: plantear un dilema ético o un problema complejo de la ciudad. Primero, los estudiantes deben debatirlo durante 20 minutos en un chat grupal (sincrónico). Luego, deben migrar al foro del aula virtual (asincrónico) y tener un debate de una semana de duración, con la regla de que cada intervención debe incluir al menos una fuente externa y responder argumentativamente a un compañero. La reflexión final compara la calidad del pensamiento y la convivencia en ambos entornos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La cultura digital argentina está fuertemente sesgada hacia lo sincrónico: el "audio de WhatsApp" de 5 minutos, la grieta en tiempo real en Twitter/X, la urgencia del grupo de Facebook. Los espacios asincrónicos de debate profundo han quedado relegados a ámbitos académicos o técnicos. Recuperar el foro como espacio de deliberación ciudadana y escolar es un acto de resistencia contra la superficialidad y la polarización que fomentan los algoritmos de las redes sincrónicas.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Para el experimento asincrónico, se puede utilizar el foro del aula virtual para debatir sobre un tema de agenda local que requiera pensamiento a largo plazo, como "El futuro de la costa bahiense y el desarrollo urbano" o "Políticas de reciclaje y gestión de residuos en Bahía Blanca". Obligar a la asincronía permite que los estudiantes investiguen en el Módulo 3, consulten mapas en el Módulo 4, y redacten propuestas fundamentadas, demostrando que la tecnología, cuando se usa con los tiempos adecuados, es una herramienta insuperable para la construcción de ciudadanía local.</div>
</div>`;
