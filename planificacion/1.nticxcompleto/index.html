   ROLES
================================================================ */
function setRole(role){
  STATE.role=role;
  document.body.className = role==='docente'?'theme-docente':'theme-alumno';
  document.body.classList.add('text-slate-800','antialiased');
  const bd=document.getElementById('btnDocente'), ba=document.getElementById('btnAlumno');
  if(role==='docente'){ bd.className='btn !py-2 !px-4 !rounded-xl text-xs font-bold bg-accent text-white shadow'; ba.className='btn !py-2 !px-4 !rounded-xl text-xs font-bold text-slate-500 hover:bg-white'; STATE.view='plan'; }
  else{ ba.className='btn !py-2 !px-4 !rounded-xl text-xs font-bold bg-accent text-white shadow'; bd.className='btn !py-2 !px-4 !rounded-xl text-xs font-bold text-slate-500 hover:bg-white'; STATE.view='module'; STATE.moduleId='m1'; }
  buildSidebar(); render(); closeSearch();
}

/* ================================================================
   SIDEBAR
================================================================ */
function buildSidebar(){
  const sb=document.getElementById('sidebar'); let html='';
  if(STATE.role==='docente'){
    html+=`<div class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2 mb-2">Panel Docente</div>`;
    html+=navItem('plan','fa-calendar-days','Planificación Anual');
    html+=navItem('marco','fa-book-open','Marco Teórico / ADI');
    html+=navItem('contextos','fa-earth-americas','Contextos Sociales');
    html+=navItem('salidas','fa-bus','Salidas Educativas');
    html+=`<div class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2 mt-4 mb-2">Módulos</div>`;
  } else {
    html+=`<div class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-2 mb-2">Cuadernillo del Estudiante</div>`;
  }
  MODULES.forEach(m=>{ html+=moduleNav(m); });
  sb.innerHTML=html;
}
function navItem(view,icon,label){
  const act=STATE.view===view?'active':'';
  return `<button class="nav-btn ${act}" onclick="goView('${view}')"><i class="nav-ic fa-solid ${icon}"></i>${label}</button>`;
}
function moduleNav(m){
  const act=(STATE.view==='module'&&STATE.moduleId===m.id)?'active':'';
  const pend=m.pending?'<span class="ml-auto text-[9px] font-bold text-amber-500 bg-amber-50 px-1.5 py-0.5 rounded-full border border-amber-200">pend.</span>':'';
  return `<button class="nav-btn ${act}" onclick="goModule('${m.id}')"><i class="nav-ic fa-solid ${m.icon}"></i><span class="truncate">${m.num} · ${m.titulo}</span>${pend}</button>`;
}
function goView(v){ STATE.view=v; render(); closeSidebarMobile(); }
function goModule(id){ STATE.view='module'; STATE.moduleId=id; STATE.level='principiante'; render(); closeSidebarMobile(); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
function closeSidebarMobile(){ if(window.innerWidth<1024) document.getElementById('sidebar').classList.add('hidden'); }

/* ================================================================
   RENDER PRINCIPAL
================================================================ */
function render(){
  const main=document.getElementById('main');
  if(STATE.role==='docente'){
    if(STATE.view==='plan') main.innerHTML=viewPlan();
    else if(STATE.view==='marco') main.innerHTML=viewMarco();
    else if(STATE.view==='marcoadi') main.innerHTML=viewMarcoADI();  
    else if(STATE.view==='contextos') main.innerHTML=viewContextos();
    else if(STATE.view==='salidas') main.innerHTML=viewSalidas();
    else if(STATE.view==='teoriaadi') main.innerHTML=viewTeoriaADI();
    else main.innerHTML=viewModule();
  } else {
    main.innerHTML=viewModule();
  }
  window.scrollTo({top:0});
}

/* ---------- VISTA MÓDULO (docente y alumno) ---------- */
function viewModule(){
  const m=MODULES.find(x=>x.id===STATE.moduleId); if(!m) return '';
  const isDoc=STATE.role==='docente';
  const pendBadge=m.pending?`<span class="chip bg-amber-50 text-amber-600 border border-amber-200 ml-2"><i class="fa-solid fa-triangle-exclamation"></i> Narrativas pendientes de inyección</span>`:'';
  let html=`<div class="fade-in space-y-5">
    <div class="card p-6 relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-40 h-40 rounded-full opacity-10" style="background:${m.color}"></div>
      <div class="flex items-center gap-2 flex-wrap mb-2">
        <span class="chip ${isDoc?'bg-accent-soft text-accent':'bg-accent-soft text-accent'}"><i class="fa-solid ${isDoc?'fa-chalkboard-user':'fa-user-graduate'}"></i> ${isDoc?'Docente':'Alumno'}</span>
        <span class="chip bg-slate-100 text-slate-500">${m.adi}</span>${pendBadge}
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 flex items-center gap-3"><i class="fa-solid ${m.icon}" style="color:${m.color}"></i> Módulo ${m.num} · ${m.titulo}</h1>
      <div class="mt-4 flex gap-2 flex-wrap no-print">
        <button onclick="window.print()" class="btn btn-primary"><i class="fa-solid fa-print"></i> Imprimir Módulo / Guardar PDF</button>
        ${(!isDoc&&!m.pending)?`<button onclick="startQuiz('${m.id}')" class="btn btn-ghost"><i class="fa-solid fa-circle-check"></i> Autoevaluación</button>`:''}
        ${isDoc?`<button onclick="startQuiz('${m.id}')" class="btn btn-ghost"><i class="fa-solid fa-eye"></i> Vista previa del examen</button>`:''}
      </div>
    </div>`;

  if(m.pending){
    html+=pendingModule(m);
  } else {
    // LECTURA DE NIVELACIÓN (alumno) / FUNDAMENTACIÓN (docente)
    html+=`<div class="card p-6"><h2 class="font-bold text-slate-900 mb-3"><i class="fa-solid ${isDoc?'fa-lightbulb':'fa-book-open-reader'} mr-2 text-accent"></i>${isDoc?'Fundamentación para la enseñanza':'Lectura de Nivelación'}</h2><div class="text-sm text-slate-600 space-y-2">${m.nivelacion}</div></div>`;
    // ACTIVIDADES POR NIVELES (tabs)
    html+=renderLevels(m);
    // DESAFÍO (alumno) / CONTEXTO (docente)
    if(!isDoc){ html+=`<div class="card p-6 bg-accent-soft border-accent border">${m.desafio}</div>`; html+=renderGlosario(m); }
    else { html+=renderGlosario(m); html+=renderContextoModule(m); html+=renderSalidasModule(m); }
    // QUIZ
    html+=`<div id="quizBox" class="no-print"></div>`;
  }
  html+=`</div>`; return html;
}
function pendingModule(m){
  return `<div class="card p-6 border-2 border-dashed border-amber-200 bg-amber-50/40">
    <h2 class="font-bold text-amber-700 mb-2"><i class="fa-solid fa-plug-circle-plus mr-2"></i>Contenido narrativo pendiente de inyección</h2>
    <p class="text-sm text-slate-600 mb-3">Las <strong>actividades oficiales por nivel</strong> del Diseño Curricular ya están cargadas debajo. Para completar este módulo (lectura de nivelación, glosario, desafío, contexto y banco de 20 preguntas), solicitá: <code class="bg-white px-2 py-0.5 rounded border text-xs font-mono">"Inyectar Módulo ${m.num}: ${m.titulo}"</code>.</p>
    ${renderLevels(m,true)}
  </div>`;
}
function renderLevels(m, readonly=false){
  const L=[['principiante','Principiante','fa-seedling'],['intermedio','Intermedio','fa-arrow-trend-up'],['avanzado','Avanzado','fa-rocket']];
  const tabs=L.map(([k,lab,ic])=>`<button class="tab-pill ${STATE.level===k?'active':''}" onclick="setLevel('${k}')"><i class="fa-solid ${ic} mr-1.5"></i>${lab}</button>`).join('');
  const n=m.niveles[STATE.level]||m.niveles.principiante;
  const pasos=readonly?`<li class="text-sm text-slate-500 italic">[Pasos a inyectar]</li>`:(n.pasos||[]).map(p=>`<li class="text-sm text-slate-600 flex gap-2"><i class="fa-solid fa-circle-check text-accent mt-0.5"></i><span>${p}</span></li>`).join('');
  const crit=(n.criterios||[]).map(c=>`<span class="chip bg-accent-soft text-accent !text-[11px]">${c}</span>`).join(' ');
  return `<div class="card p-6">
    <h2 class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-sliders mr-2 text-accent"></i>Propuestas de Intervención por Nivel</h2>
    <p class="text-xs text-slate-500 mb-4">Atención a la diversidad: cada estudiante trabaja según su nivel de dominio (Diseño Curricular, p. 23-29).</p>
    <div class="tab-bar flex gap-2 mb-4 flex-wrap no-print">${tabs}</div>
    <div class="fade-in">
      <div class="flex items-center gap-2 mb-2"><span class="chip bg-accent-soft text-accent capitalize"><i class="fa-solid fa-layer-group"></i> Nivel ${STATE.level}</span></div>
      <p class="text-sm font-medium text-slate-700 mb-3">${n.consigna}</p>
      <h4 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Pasos</h4>
      <ul class="space-y-2 mb-4">${pasos}</ul>
      <h4 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Criterios de logro (Diseño Curricular)</h4>
      <div class="flex flex-wrap gap-2">${crit||'<span class="text-sm text-slate-400 italic">[Criterios a inyectar]</span>'}</div>
    </div>
  </div>`;
}
function setLevel(l){ STATE.level=l; render(); }
function renderGlosario(m){
  const items=(m.glosario||[]).map(g=>`<div class="bg-slate-50 rounded-xl p-3 border border-slate-100"><span class="font-bold text-accent text-sm">${g.t}.</span> <span class="text-sm text-slate-600">${g.d}</span></div>`).join('');
  return `<div class="card p-6"><h2 class="font-bold text-slate-900 mb-3"><i class="fa-solid fa-spell-check mr-2 text-accent"></i>Glosario Técnico Micro</h2>
    <div class="grid md:grid-cols-2 gap-2">${items||'<p class="text-sm text-slate-400 italic">[Glosario pendiente de inyección]</p>'}</div></div>`;
}
function renderContextoModule(m){
  if(!m.contexto) return '';
  return `<div class="card p-6"><h2 class="font-bold text-slate-900 mb-3"><i class="fa-solid fa-earth-americas mr-2 text-accent"></i>Contexto Social</h2>
    <h4 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1"><i class="fa-solid fa-flag mr-1"></i>Argentina</h4><p class="text-sm text-slate-600 mb-3">${m.contexto.argentina}</p>
    <h4 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1"><i class="fa-solid fa-location-dot mr-1"></i>Bahía Blanca</h4><p class="text-sm text-slate-600">${m.contexto.bahiaBlanca}</p></div>`;
}
function renderSalidasModule(m){
  if(!m.salidas) return '';
  const s=m.salidas.map(x=>`<div class="salida-item bg-slate-50 rounded-xl p-4 border border-slate-100">
    <h4 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-bus mr-1 text-accent"></i>${x.lugar}</h4>
    <p class="text-xs text-slate-500 mb-2">${x.dir}</p><p class="text-sm text-slate-600 mb-2"><strong>Objetivo:</strong> ${x.objetivo}</p>
    <ul class="text-sm text-slate-600 list-disc ml-5">${x.actividades.map(a=>`<li>${a}</li>`).join('')}</ul></div>`).join('');
  return `<div class="card p-6"><h2 class="font-bold text-slate-900 mb-3"><i class="fa-solid fa-bus mr-2 text-accent"></i>Salidas Educativas del Módulo</h2><div class="space-y-3">${s}</div></div>`;
}

/* ================================================================
   BUSCADOR · SIMULADOR DE IA (respeta el rol activo)
================================================================ */
const STOP=new Set(['de','la','el','en','y','a','los','se','del','las','un','por','con','no','una','su','para','es','al','lo','como','más','que','qué','donde','dónde','puedo','ir','hacer','hay','sobre']);
function tokenize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9ñ]+/).filter(w=>w.length>2&&!STOP.has(w)); }

function buildIndex(){
  const idx=[];
  const push=(role,module,title,snippet,kw,url)=>idx.push({role,module,title,snippet,kw:tokenize(kw.join(' ')),url});
  MODULES.forEach(m=>{
    // Nivelación / fundamentación → ambos roles
    if(m.nivelacion) push('ambos',m.id,`${m.num} · ${m.titulo} — Lectura`, m.nivelacion.replace(/<[^>]+>/g,'').slice(0,180), [m.titulo,m.adi,'nivelacion','lectura'],()=>goModule(m.id));
    // Glosario
    (m.glosario||[]).forEach(g=>push('ambos',m.id,`Glosario: ${g.t}`, g.d, [g.t,g.d,m.titulo],()=>goModule(m.id)));
    // Actividades por nivel
    ['principiante','intermedio','avanzado'].forEach(nv=>{
      const n=m.niveles[nv]; if(!n) return;
      push('ambos',m.id,`${m.titulo} — Actividad ${nv}`, n.consigna, [m.titulo,nv,'actividad',...(n.criterios||[])],()=>{goModule(m.id); STATE.level=nv; render();});
    });
    // Desafío (alumno)
    if(m.desafio) push('alumno',m.id,`${m.titulo} — Desafío grupal`, m.desafio.replace(/<[^>]+>/g,'').slice(0,160), [m.titulo,'desafio','grupo','abp'],()=>goModule(m.id));
    // Contextos y salidas (docente)
    if(m.contexto){ push('docente',m.id,`${m.titulo} — Contexto Argentina`, m.contexto.argentina.replace(/<[^>]+>/g,'').slice(0,160), [m.titulo,'contexto','argentina'],()=>{STATE.view='contextos';render();});
      push('docente',m.id,`${m.titulo} — Contexto Bahía Blanca`, m.contexto.bahiaBlanca.replace(/<[^>]+>/g,'').slice(0,160), [m.titulo,'bahia','contexto','excursion'],()=>{STATE.view='contextos';render();}); }
    (m.salidas||[]).forEach(s=>push('docente',m.id,`Salida: ${s.lugar}`, s.objetivo, [s.lugar,'salida','excursion','bahia','visita','utn','uns','conicet'],()=>{STATE.view='salidas';render();}));
    // Quiz
    (m.quiz||[]).forEach(q=>push('ambos',m.id,`Examen ${m.titulo}: ${q.q}`, q.q, [q.q,q.t,m.titulo,'examen','quiz','autoevaluacion'],()=>startQuiz(m.id)));
  });
  // Entradas globales docente
  push('docente','_g','Planificación Anual','Objetivos de enseñanza y organización de los 7 módulos ADI.',['planificacion','objetivos','anual'],()=>{STATE.view='plan';render();});
  push('docente','_g','Marco Teórico · ADI','Conectividad, interactividad e hipermedialidad.',['marco','adi','teoria','conectividad'],()=>{STATE.view='marco';render();});
  return idx;
}
const INDEX=buildIndex();

function liveSearch(){
  const q=document.getElementById('searchInput').value.trim();
  const box=document.getElementById('searchResults');
  if(q.length<3){ box.classList.add('hidden'); return; }
  const terms=tokenize(q);
  const results=INDEX
    .filter(it=> it.role==='ambos' || it.role===STATE.role )
    .map(it=>{ let score=0; terms.forEach(t=>{ if(it.title.toLowerCase().includes(t))score+=3; if(it.kw.some(k=>k.includes(t)||t.includes(k)))score+=2; if(it.snippet.toLowerCase().includes(t))score+=1; }); return {it,score}; })
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
  if(!results.length){ box.innerHTML=`<div class="p-5 text-center text-sm text-slate-400"><i class="fa-regular fa-face-frown mr-2"></i>Sin resultados para "${q}" en modo ${STATE.role}.</div>`; box.classList.remove('hidden'); return; }
  box.innerHTML=results.map(({it})=>`
    <div class="result-card p-4 border-b border-slate-100 last:border-0" onclick="(${it.url.toString()})();closeSearch()">
      <div class="flex items-center gap-2 mb-1"><i class="fa-solid fa-wand-magic-sparkles text-accent text-xs"></i>
        <span class="font-bold text-sm text-slate-900">${it.title}</span>
        <span class="chip ${it.role==='docente'?'bg-blue-50 text-blue-700':'bg-slate-100 text-slate-500'} !text-[10px]">${it.role==='ambos'?'general':it.role}</span></div>
      <p class="text-xs text-slate-500 line-clamp-2">${it.snippet}…</p>
    </div>`).join('');
  box.classList.remove('hidden');
}
function closeSearch(){ document.getElementById('searchResults').classList.add('hidden'); }
document.addEventListener('click',e=>{ if(!e.target.closest('#searchWrap')) closeSearch(); });

/* ================================================================
   QUIZ · AUTOEVALUACIÓN (20 al azar · máx 100 · penalización 50%)
================================================================ */
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }
function startQuiz(id){
  const m=MODULES.find(x=>x.id===id); if(!m||!m.quiz||!m.quiz.length){ alert('El banco de preguntas de este módulo está pendiente de inyección.'); return; }
  const pick=shuffle(m.quiz).slice(0,Math.min(20,m.quiz.length));
  STATE.quiz={id,pick,answers:new Array(pick.length).fill(null)};
  STATE.view='module'; STATE.moduleId=id; render();
  const box=document.getElementById('quizBox'); if(!box) return;
  const val=(100/pick.length);
  let html=`<div class="card p-6 border-t-4" style="border-color:${m.color}">
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h2 class="font-bold text-slate-900"><i class="fa-solid fa-circle-check mr-2 text-accent"></i>Autoevaluación · Módulo ${m.num}: ${m.titulo}</h2>
      <span class="chip bg-accent-soft text-accent">${pick.length} preguntas · Máx 100 · Incorrecta −${ (val/2).toFixed(1) }</span>
    </div>
    <p class="text-xs text-slate-500 mb-4">Seleccioná una opción por pregunta. Al finalizar verás tu puntaje y los temas a repasar.</p>
    <div class="space-y-5">`;
  pick.forEach((q,i)=>{
    html+=`<div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
      <div class="font-semibold text-sm text-slate-800 mb-3">${i+1}. ${q.q} <span class="chip bg-white border border-slate-200 text-slate-400 !text-[10px] ml-1">${q.t}</span></div>
      <div class="space-y-2">${q.o.map((op,oi)=>`<label class="opt" id="opt-${i}-${oi}"><input type="radio" name="q${i}" class="mt-0.5 accent-current" onchange="pickAns(${i},${oi})"><span>${op}</span></label>`).join('')}</div>
    </div>`;
  });
  html+=`</div><div class="mt-5 flex gap-2 flex-wrap">
    <button class="btn btn-primary" onclick="gradeQuiz()"><i class="fa-solid fa-flag-checkered"></i> Finalizar y ver resultado</button>
    <button class="btn btn-ghost" onclick="render()"><i class="fa-solid fa-rotate-left"></i> Reiniciar</button></div></div>`;
  box.innerHTML=html; box.scrollIntoView({behavior:'smooth'});
}
function pickAns(i,oi){
  STATE.quiz.answers[i]=oi;
  const opts=document.querySelectorAll(`input[name="q${i}"]`);
  opts.forEach((inp,idx)=>inp.closest('.opt').classList.toggle('selected',idx===oi));
}
function gradeQuiz(){
  const {pick,answers}=STATE.quiz; const val=100/pick.length; let score=0; const temas={};
  pick.forEach((q,i)=>{
    const a=answers[i];
    if(a===q.a){ score+=val; }
    else { score-=val/2; if(a!==null) temas[q.t]=(temas[q.t]||0)+1; else temas[q.t]=(temas[q.t]||0)+0.5; }
  });
  score=Math.max(0,Math.round(score));
  const correct=pick.filter((q,i)=>answers[i]===q.a).length;
  const color=score>=70?'#16a34a':(score>=40?'#f59e0b':'#dc2626');
  const msg=score>=70?'¡Excelente dominio del módulo!':(score>=40?'Buen intento, repasá los temas señalados.':'Te recomendamos revisar el módulo con calma.');
  const repaso=Object.keys(temas).length?`<div class="mt-4 text-left bg-amber-50 border border-amber-200 rounded-xl p-4"><h4 class="font-bold text-amber-700 text-sm mb-2"><i class="fa-solid fa-book-open mr-1"></i>Temas a repasar</h4><div class="flex flex-wrap gap-2">${Object.keys(temas).map(t=>`<span class="chip bg-white border border-amber-200 text-amber-700">${t}</span>`).join('')}</div></div>`:`<div class="mt-4 bg-green-50 border border-green-200 rounded-xl p-4 text-sm text-green-700 text-left"><i class="fa-solid fa-star mr-1"></i>¡Sin temas pendientes! Respondiste todo correctamente.</div>`;
  document.getElementById('quizBox').innerHTML=`
    <div class="card p-8 text-center fade-in">
      <div class="w-36 h-36 mx-auto rounded-full flex flex-col items-center justify-center text-white shadow-pop" style="background:${color}">
        <span class="text-4xl font-extrabold">${score}</span><span class="text-xs opacity-90 font-medium">de 100 puntos</span></div>
      <h3 class="font-bold text-slate-900 mt-4 text-lg">${msg}</h3>
      <p class="text-sm text-slate-500 mt-1">Respuestas correctas: <strong>${correct}</strong> de ${pick.length} · Valor por pregunta: ${val.toFixed(1)} · Penalización incorrecta: −${(val/2).toFixed(1)}</p>
      ${repaso}
      <div class="mt-5 flex gap-2 justify-center flex-wrap">
        <button class="btn btn-primary" onclick="startQuiz('${STATE.quiz.id}')"><i class="fa-solid fa-shuffle"></i> Nuevo examen (otras preguntas)</button>
        <button class="btn btn-ghost" onclick="render()"><i class="fa-solid fa-arrow-left"></i> Volver al módulo</button>
      </div>
    </div>`;
  document.getElementById('quizBox').scrollIntoView({behavior:'smooth'});
}

/* ================================================================
   INICIO
================================================================ */
setRole('docente');
if(window.innerWidth<1024) document.getElementById('sidebar').classList.add('hidden');
</script>
