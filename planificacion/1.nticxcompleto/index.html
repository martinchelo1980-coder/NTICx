  p:'¿La cibercultura es una subcultura de las pantallas o la cultura dominante que subordinó a todas las demás?',
  d:'Prácticas, valores y sociabilidad nacidos de la interconexión (Lévy, inteligencia colectiva); nuevas identidades y temporalidades; el meme y los lenguajes digitales.',
  c:'Argentina con alta penetración de redes sociales; cultura del meme y activismos digitales.',
  b:'Colectivos culturales bahienses en Instagram y TikTok; análisis de la cibercultura juvenil local.'},
 {t:'Sociedad red.',
  p:'Si la sociedad red se organiza en nodos y flujos, ¿qué pasa con quienes no son ni nodo ni flujo?',
  d:'Castells: morfología social basada en redes; la exclusión como desconexión; el poder sobre los flujos y los interruptores de la red.',
  c:'Argentina Conectada y la REFEFO como políticas de red; brecha digital territorial.',
  b:'Bahía Blanca como nodo del sudoeste: puerto y Polo conectados globalmente frente a barrios desconectados.'},
 {t:'Sociedad de la información.',
  p:'¿Tener más información nos hace estar más informados, o la superabundancia nos vuelve más ignorantes?',
  d:'La información como materia prima de la economía (Toffler, Bell); infoxicación; diferencia entre dato e información; higiene informativa.',
  c:'Ley de Acceso a la Información Pública y datos abiertos en Argentina (datos.gob.ar).',
  b:'Procesamiento en el aula de datos abiertos del Municipio de Bahía Blanca.'},
 {t:'Sociedad del conocimiento y el aprendizaje.',
  p:'Si la información es el dato y el conocimiento es el sentido, ¿por qué la escuela aún evalúa la retención?',
  d:'UNESCO: de la sociedad de la información a la del conocimiento; aprendizaje a lo largo de la vida; gestión del conocimiento; transformar información en conocimiento.',
  c:'Sistema científico argentino (CONICET, universidades públicas) como productor de conocimiento.',
  b:'Vinculación con investigadores del CCT CONICET Bahía Blanca y la UNS; estudiantes como productores de conocimiento.'},
 {t:'Web 1.0 red pasiva.',
  p:'¿Fue la Web 1.0 una inocencia digital o el momento en que las corporaciones instalaron el broadcasting?',
  d:'Web de solo lectura: HTML estático, portales como directorios, usuario consumidor; modelo unidireccional de difusión.',
  c:'Primeros portales argentinos y cibercafés con dial-up de los 90 y 2000.',
  b:'Arqueología web: primeros sitios bahienses en la Wayback Machine; comparación con el presente.'},
 {t:'Web 2.0 red participativa-colaborativa.',
  p:'Si la Web 2.0 nos hizo a todos productores, ¿por qué la riqueza de nuestro trabajo gratuito terminó en Silicon Valley?',
  d:'O Reilly: web participativa, contenido generado por el usuario, blogs, wikis, redes sociales y arquitectura de la participación (Piscitelli); el prosumidor.',
  c:'Auge de los blogs argentinos y de Wikipedia en español; blogósfera vibrante.',
  b:'Blog educativo y wiki colaborativa del curso de NTICx en Bahía Blanca; periodismo ciudadano local.'},
 {t:'Web 3.0 red global semántica.',
  p:'Si la web semántica promete que las máquinas entiendan el significado, ¿construimos una web más inteligente o delegamos la nuestra?',
  d:'Berners-Lee: ontologías, RDF y datos enlazados; máquinas que interpretan el sentido; base de los asistentes y de la IA actual.',
  c:'Datos abiertos enlazados del Estado argentino; interoperabilidad entre organismos.',
  b:'Integración de bases de datos locales (municipio, escuela) como ejercicio de semántica en el aula.'},
 {t:'Web 4.0 red basada en inteligencia artificial.',
  p:'Cuando la web predice lo que deseamos antes de que lo sepamos, ¿quién es el usuario y quién es el producto?',
  d:'Web inteligente y ubicua: IA, machine learning, IoT y asistentes; personalización predictiva y burbujas de filtro; ética crítica de la recomendación.',
  c:'Debate sobre regulación de la IA en Argentina; desarrollo local (empresas de software, universidades).',
  b:'Análisis de los algoritmos de recomendación en los feeds de estudiantes bahienses; IA aplicada al agro y al puerto de la región.'}
]},

{t:'Alfabetización en Manejo de Componentes de Imagen Visual',icon:'fa-image',color:'#ea580c',contenidos:[
 {t:'La imagen como mensaje.',
  p:'¿Una imagen habla por sí sola o siempre comunica lo que alguien con poder decidió que comunicara?',
  d:'La imagen no es un reflejo pasivo sino un mensaje construido: encuadre, luz, color y momento son decisiones. Opera con códigos icónicos y de modo simultáneo; se lee en tres niveles: denotativo, connotativo y retórico.',
  c:'Argentina tiene fuerte tradición en diseño gráfico y publicidad; la lectura crítica de imágenes es defensa frente a la manipulación mediática.',
  b:'Análisis de publicidades y tapas de medios bahienses; galería fotográfica comentada de espacios locales.'},
 {t:'Denotación y connotación de imágenes.',
  p:'¿Existe alguna imagen que solo muestre lo que hay?',
  d:'Denotación: significado literal y objetivo. Connotación: sentido sugerido, cultural y emocional. La operación publicitaria naturaliza la connotación; distinguirlas es el núcleo de la lectura crítica.',
  c:'Imágenes de la historia argentina con connotación disputada (Malvinas, crisis, movimientos sociales).',
  b:'Análisis de símbolos locales (escudo municipal, clubes, murales) entrevistando a distintas generaciones bahienses.'},
 {t:'Cultura icónica.',
  p:'¿Vivimos en una cultura donde las imágenes dominan sobre las palabras?',
  d:'La cultura icónica: la imagen como medio principal de conocimiento y socialización (Sartori, Homo Videns). Pantallas, interfaces y flujos; doble lectura: democratización expresiva y concentración del poder simbólico.',
  c:'Alto consumo de imágenes en Argentina; la alfabetización en medios como política educativa.',
  b:'Autodiagnóstico de consumo icónico de estudiantes bahienses; archivo icónico de la ciudad.'},
 {t:'El análisis morfosintáctico de textos visuales.',
  p:'Cuando una foto funciona y otra no, ¿hay reglas que lo explican o es pura intuición?',
  d:'Morfología (punto, línea, plano, forma, textura, color, luz) y sintaxis (encuadre, composición, equilibrio, ritmo, tensión, figura-fondo). Pasar de la impresión subjetiva a la lectura fundamentada.',
  c:'Diseño gráfico profesional en Argentina; demanda de comunicadores visuales.',
  b:'Disección formal de tres piezas visuales bahienses (tapas, afiches, gráfica de clubes).'},
 {t:'La abstracción visual como instrumento de descubrimiento de significados.',
  p:'¿Abstraer es el acto más radical de conocimiento: ver la estructura oculta bajo la apariencia?',
  d:'Reducir a rasgos esenciales para revelar relaciones y patrones: mapas, diagramas, esquemas, pictogramas. Ver lo que la apariencia no muestra; conexión con el Aprendizaje Visual y los mapas conceptuales.',
  c:'Producción argentina de diagramas e infografías en ciencia, estadística y periodismo.',
  b:'Mapa conceptual virtual de Bahía Blanca (producción, educación, servicios, cultura) con CmapTools.'},
 {t:'La interpretación semántica y la valoración ética y estética.',
  p:'¿Puede una imagen ser bella y éticamente repudiable al mismo tiempo?',
  d:'Interpretación del significado global; valoración estética (calidad formal) y ética (dignidad, estereotipos, manipulación). Sostener ambas preguntas a la vez sin que una anule a la otra.',
  c:'Normativa argentina: Ley de Defensa del Consumidor y Ley 26.485 (violencia simbólica en medios).',
  b:'Doble juicio (estético y ético) aplicado a publicidades bahienses; publicación del análisis en el blog del curso.'},
 {t:'Concepto de publicidad.',
  p:'¿La publicidad vende productos o universos de sentido?',
  d:'Comunicación persuasiva que promueve el consumo de bienes, servicios o ideas. Estructura denotativa-connotativa-retórica; dimensión técnica y crítica; producir con conciencia.',
  c:'Industria publicitaria argentina reconocida internacionalmente; regulación y autorregulación (CONAR).',
  b:'Análisis de la publicidad local y diseño de una campaña para una causa bahiense (biblioteca, club, reciclaje).'},
 {t:'Símbolos y signos.',
  p:'¿Quién controla los símbolos que una comunidad acepta como naturales?',
  d:'Signo: algo que representa otra cosa para alguien. Icono (semejanza), índice (relación física o causal) y símbolo (arbitrario y convencional); el símbolo depende del acuerdo social.',
  c:'Símbolos nacionales (bandera, escudo) y símbolos políticos en disputa permanente.',
  b:'Sistema simbólico local (escudo municipal, clubes, instituciones fundacionales) y diseño de un símbolo contemporáneo para una causa bahiense.'},
 {t:'Semiótica: sintaxis visual, semántica visual.',
  p:'¿Es la semiótica la disciplina más urgente en una época donde el sentido se fabrica industrialmente?',
  d:'Ciencia de los signos y de la producción de sentido. Sintaxis visual (cómo se combinan los elementos) y semántica visual (qué significan); vocabulario preciso para analizar cualquier producto visual.',
  c:'Tradición semiótica argentina (Verón, análisis del discurso, universidades públicas).',
  b:'Aplicación del método semiótico a un corpus local (una semana de tapas bahienses) con informe final.'},
 {t:'Recursos retóricos.',
  p:'¿Cuántas de nuestras decisiones libres son respuestas a trucos retóricos que no sabemos identificar?',
  d:'Retórica visual: metáfora, metonimia, hipérbole, antítesis, elipsis y serialización. Identificar el recurso desmonta la persuasión.',
  c:'Historia gráfica argentina rica en retórica (afiches políticos, publicidad, campañas).',
  b:'Relevamiento retórico de la vía pública bahiense (fotografiar, clasificar, analizar) y producción de una pieza para una causa local.'},
 {t:'El color en la publicidad.',
  p:'¿Cuántas decisiones de compra se toman por un color que el comprador nunca eligió racionalmente?',
  d:'El color como expresión y persuasión; RGB y CMYK; connotaciones culturales (rojo energía, azul confianza, verde naturaleza, negro lujo); identidad cromática de las marcas.',
  c:'Marcas argentinas con identidad cromática fuerte; formación en diseño.',
  b:'Mapa cromático de Bahía Blanca (institucional, deportivo, comercial) y paleta para un proyecto local.'},
 {t:'Logotipo, isotipo e isologo.',
  p:'¿Qué hace reconocible a una marca: el nombre, el símbolo o ambos?',
  d:'Logotipo (solo texto), isotipo (solo símbolo) e isologo (combinación inseparable). Condiciones de eficacia: funciona en tamaño pequeño, en blanco y negro y es reconocible.',
  c:'Diseño de identidad visual argentino con reconocimiento internacional.',
  b:'Análisis de la identidad de instituciones bahienses y diseño o rediseño de la identidad de una organización local.'},
 {t:'Creación de lemas publicitarios.',
  p:'¿Por qué los lemas más eficaces suelen decir menos?',
  d:'Lema o slogan: frase breve que condensa la promesa o el posicionamiento. Recursos verbales y visuales (rima, ritmo, brevedad, ambigüedad controlada); anclaje o relevo con la imagen.',
  c:'Lemas argentinos memorables que integran la cultura popular.',
  b:'Creación de lemas para causas e instituciones bahienses; publicación en el blog con votación comunitaria.'},
 {t:'Concepto de manipulación publicitaria.',
  p:'¿Dónde termina la persuasión legítima y empieza la manipulación?',
  d:'Estrategias que limitan la decisión racional: miedos, inseguridades, necesidades artificiales, testimonios falsos, explotación de vulnerabilidades. La línea la marcan la ética y la regulación.',
  c:'Normas argentinas contra publicidad engañosa y violencia simbólica; Defensoría del Público.',
  b:'Análisis de casos límite en medios locales y diseño de una campaña ética para Bahía Blanca.'},
 {t:'Análisis de interfaces digitales.',
  p:'¿La interfaz es el lugar donde se decide qué podemos y qué no podemos hacer?',
  d:'Superficie de contacto entre usuario y sistema. Arquitectura de la información, jerarquía visual, usabilidad, accesibilidad y dark patterns; analizar cómo el diseño orienta el comportamiento.',
  c:'Ley 26.653 de accesibilidad web en Argentina; diseño UX/UI como salida laboral.',
  b:'Auditoría de usabilidad y accesibilidad de dos apps o sitios bahienses (municipio, medios) con propuestas de mejora.'},
 {t:'El icono y la comunicación.',
  p:'¿Es el icono la forma más pura y más exigente del diseño?',
  d:'Signo figurativo simplificado, universal, consistente y legible; señalética e interfaces digitales. El diseño de iconos como abstracción visual aplicada.',
  c:'Señalética internacional y accesibilidad en espacios públicos argentinos.',
  b:'Auditoría de la señalética de un espacio público bahiense (hospital, estación, parque) y diseño de un sistema icónico mejorado.'},
 {t:'Mapas conceptuales virtuales y representación visual de conceptos.',
  p:'¿El mapa conceptual es la herramienta más honesta del aprendizaje?',
  d:'Representación gráfica de conceptos (nodos) y relaciones (enlaces) con jerarquías. Obliga a explicitar relaciones; CmapTools; conexión con el Aprendizaje Visual.',
  c:'Uso extendido en la educación y la investigación argentinas.',
  b:'Mapa conceptual virtual de una materia de 4to año de otra asignación (transversalidad) producido por estudiantes bahienses.'},
 {t:'Presentaciones como constructoras de información en modo visual.',
  p:'¿Por qué la mayoría de las presentaciones duermen a la audiencia?',
  d:'La presentación como apoyo visual del discurso oral: poco texto, imágenes potentes, gráficos claros y estructura narrativa. El DC las define como constructoras de información en modo visual.',
  c:'Presentaciones en el ámbito académico y laboral argentino.',
  b:'Presentación multimedia sobre un tema local (estuario, puerto, Sierra de la Ventana) con fotos capturadas por estudiantes bahienses.'},
 {t:'Editores de video como transmisores de ideas a través de imágenes y videos.',
  p:'¿El montaje hace decir a las imágenes exactamente lo que el editor quiere?',
  d:'El montaje es constitutivo del lenguaje audiovisual (efecto Kuleshov). Decisiones de encuadre, orden y ritmo; dimensión técnica y ética de la edición.',
  c:'Industria audiovisual argentina (INCAA) y producción local creciente.',
  b:'Corto documental sobre un tema bahiense (barrio, oficio, institución) editado y publicado por los estudiantes.'},
 {t:'Programas para la edición de fotos, imágenes y videos.',
  p:'¿Dónde termina el retoque legítimo y empieza la fabricación de una realidad que nunca existió?',
  d:'Editores de imagen (recorte, color, retoque, capas) y de video (montaje, transiciones, sonido). Herramientas libres (GIMP, Kdenlive, Audacity); ética de la edición.',
  c:'Software libre en Argentina (Huayra) y formación en diseño digital.',
  b:'Restauración digital de fotografías antiguas de Bahía Blanca (archivo histórico, familias) publicada con su historia.'},
 {t:'Formato de archivo de imágenes: tipo y características.',
  p:'¿Por qué un logo debe ser vectorial y una foto un mapa de bits?',
  d:'Mapa de bits (píxeles: JPG, PNG, GIF, BMP) frente a vectorial (fórmulas: SVG). Compresión con y sin pérdida, transparencia y escalabilidad; elección según el propósito.',
  c:'Formatos abiertos y preservación digital en Argentina.',
  b:'Auditoría técnica de las imágenes de sitios bahienses (logos, peso, formato) y guía de buenas prácticas para instituciones locales.'}
]},


{t:'Alfabetización en Medios Digitales de Comunicación y Colaboración',icon:'fa-comments',color:'#db2777',contenidos:[
 {t:'Concepto de comunicación digital.',
  p:'¿Comunicarse digitalmente es solo transmitir datos o es habitar un nuevo ecosistema de signos?',
  d:'La comunicación digital codifica el mensaje en binario, desmaterializa el soporte y multiplica los canales; deja huella de datos y no equivale a la comunicación analógica. Conectar no siempre es comunicar.',
  c:'Argentina con alta penetración de WhatsApp y redes; la comunicación digital reconfigura el tejido social, político y educativo.',
  b:'Grupos barriales, medios locales y aulas virtuales como sistema nervioso de la comunidad bahiense.'},
 {t:'Modelos y componentes del proceso comunicativo digital.',
  p:'Si el modelo de Shannon fue pensado para la telefonía, ¿cómo explicamos la comunicación en red donde todos emiten, reciben y modifican?',
  d:'Evolución de los modelos lineales (emisor, mensaje, receptor, canal, código, contexto) a modelos reticulares y ecosistémicos; el prosumidor y el algoritmo como nuevo mediador del mensaje.',
  c:'Estudios de comunicación en Argentina (UBA, UNS); polarización y burbujas de filtro en el debate público.',
  b:'Mapeo de actores comunicativos locales de Bahía Blanca: medios, periodistas, municipio e influencers.'},
 {t:'Medios técnicos y competencia comunicativa.',
  p:'¿Tener el último smartphone nos hace competentes comunicativamente o solo usuarios veloces de interfaces ajenas?',
  d:'Competencia comunicativa: saber qué decir, a quién, por qué canal, con qué código y etiqueta. Dominio técnico frente a dominio pragmático; elección del canal adecuado según propósito y destinatario.',
  c:'Brecha de segundo nivel en Argentina: usos recreativos frente a usos críticos y productivos.',
  b:'Comunicación formal e informal en instituciones bahienses; protocolo de comunicación digital del curso.'},
 {t:'Ubicuidad: una nueva forma de comunicación.',
  p:'Si podemos estar presentes en todos lados sin movernos, ¿dónde termina el espacio físico y dónde empieza el digital?',
  d:'Ubicuidad: comunicación y acceso en cualquier momento y lugar (Cobo Romaní, Piscitelli). Disolución de las fronteras del aula; gestión de la atención y FOMO.',
  c:'Los planes Conectar Igualdad sacaron la escuela del edificio; ubicuidad y desigualdad de acceso.',
  b:'Estudiantes bahienses conectados en el transporte, las plazas con Wi-Fi y el hogar; registro etnográfico local.'},
 {t:'Tercer entorno: nueva configuración social.',
  p:'¿El ciberespacio es un tercer entorno con derechos y democracia o una colonia digital donde las corporaciones escriben las leyes?',
  d:'Echeverría: E1 naturaleza, E2 ciudad, E3 ciberespacio. Entorno artificial y desterritorializado que requiere prótesis; identidad múltiple y economía de los datos.',
  c:'Argentina habita el E3 con contradicciones: sociedad civil activa frente a dependencia de plataformas extranjeras.',
  b:'Servidores de Discord, marketplaces y streaming locales como experiencias bahienses del tercer entorno.'},
 {t:'Análisis de medios digitales: fuentes, técnicas y códigos, naturaleza de la realidad construida por los medios, valores, intencionalidad mediática, medios digitales y su lenguaje.',
  p:'Cuando un medio digital nos muestra la realidad, ¿vemos el mundo o la interfaz ideológica de quien programó el algoritmo?',
  d:'Alfabetización mediática: fuentes, técnicas y códigos; framing y agenda setting; intencionalidad y valores; lenguaje implícito y explícito; sesgos algorítmicos.',
  c:'Observatorios argentinos de medios y desinformación; la lectura crítica como defensa democrática.',
  b:'Análisis de un portal de noticias bahiense: portada, financiamiento, recolección de datos y sección de comentarios.'},
 {t:'Mass media: medios masivos de comunicación.',
  p:'¿Sigue existiendo el público masivo o se rindió ante los nichos algorítmicos?',
  d:'Medios masivos (prensa, radio, TV, grandes portales); del broadcasting al networking; migración de los mass media a las plataformas; fragmentación de audiencias.',
  c:'Crisis de los gráficos argentinos; auge del podcast y las redes; concentración mediática.',
  b:'Medios locales de Bahía Blanca (La Nueva, LU2, Canal 9) y su migración a YouTube y streaming; análisis de convergencia.'},
 {t:'Sistemas de videoconferencia.',
  p:'Si la videoconferencia simula el cara a cara pero nos reduce a rectángulos de píxeles, ¿qué dimensión humana se pierde?',
  d:'VoIP con video; sincronicidad, latencia y lenguaje paraverbal limitado; fatiga de Zoom; roles, etiqueta y grabación con permiso.',
  c:'Uso masivo en Argentina durante el ASPO; continuidad educativa, judicial y sanitaria.',
  b:'Videoconferencia con un especialista (historiador, periodista, investigador de la UNS) como práctica comunicativa del curso bahiense.'},
 {t:'Periodismo digital.',
  p:'Si el clic es la moneda y el titular compite con el meme, ¿cómo sobreviven la verificación y la jerarquía de la noticia?',
  d:'Inmediatez, hipertextualidad, multimedia e interactividad; periodismo ciudadano frente a profesional; clickbait; verificación y fact-checking.',
  c:'Periodismo digital argentino y portales locales; precarización y nuevos modelos de negocio.',
  b:'Análisis de la redacción de un medio bahiense; cómo se verifica una noticia local; estudiantes como productores de periodismo escolar.'},
 {t:'Webquest: búsquedas de información orientadas.',
  p:'¿La WebQuest es el hilo de Ariadna o una jaula dorada que limita la curiosidad a lo preseleccionado?',
  d:'Bernie Dodge: investigación guiada con introducción, tarea, proceso, recursos, evaluación y conclusión; andamiaje cognitivo; el foco en procesar y no solo buscar.',
  c:'Educ.ar y portales provinciales usan WebQuest; descargables para contextos de baja conectividad.',
  b:'WebQuest sobre temas locales de Bahía Blanca (historia del puerto, estuario, inmigración) resuelta por los estudiantes.'},
 {t:'Medios colaborativos sociales: weblogs, wikis (escritura colaborativa), edublog, blogosfera, blogonauta, blogging, blogofolio, fotolog, redes sociales digitales (tipos y características).',
  p:'Si la Web 2.0 prometió democratizar la voz, ¿por qué hoy esa voz está secuestrada en muros cerrados?',
  d:'Weblogs, wikis, edublog, blogosfera, blogonauta, blogging, blogofolio y fotolog; redes sociales digitales y sus tipos; de la blogósfera abierta a las plataformas cerradas.',
  c:'Vibrante blogósfera argentina de los 2000; blogs políticos y culturales; migración a las redes.',
  b:'Blog educativo y wiki colaborativa del curso de NTICx en Bahía Blanca; blogofolio estudiantil como portafolio digital.'},
 {t:'Plataformas virtuales de aprendizaje, campus virtuales o entornos virtuales de aprendizaje.',
  p:'¿El campus virtual es una extensión de la escuela o una arquitectura de control que mide cada clic?',
  d:'LMS (Moodle, Classroom): materiales, foros, entregas y calificaciones; analíticas de aprendizaje; asincronía estructurada; la virtualidad como complemento.',
  c:'Universidades públicas argentinas (UNS, UTN) y sistema provincial sobre Moodle/Classroom; pandemia.',
  b:'Campus virtuales de la UNS y la UTN como destino inmediato de egresados bahienses; taller de supervivencia en el campus.'},
 {t:'Herramientas colectivas de comunicación: sincrónicas (chat, irc, mensajería instantánea, mundos virtuales) y asincrónicas (listas de distribución y foros de discusión).',
  p:'¿Elegimos el tiempo de nuestra comunicación o la urgencia del chat mató la reflexión pausada?',
  d:'Sincrónicas (chat, IRC, mensajería, mundos virtuales) frente a asincrónicas (listas de distribución, foros). Diferencias cognitivas y sociales; moderación y roles.',
  c:'Cultura argentina sesgada a lo sincrónico (audios de WhatsApp); el foro como espacio de deliberación.',
  b:'Foro de 48 horas sobre una problemática de Bahía Blanca frente a un chat grupal; comparación de calidad del pensamiento y la convivencia.'}
]},

{t:'Alfabetización Multimedia',icon:'fa-photo-film',color:'#9333ea',contenidos:[
 {t:'Concepto de multimedia.',
  p:'¿Qué tiene de multi la multimedia si todo se reduce a ceros y unos? ¿Es integración o es la ilusión de la integración?',
  d:'Integración de múltiples formatos (texto, imagen fija y en movimiento, sonido y animación) en un único soporte digital. No es suma sino orquestación; la multimedia cumple el rol integrador de las demás alfabetizaciones.',
  c:'Industria argentina del software, el videojuego y el audiovisual produce multimedia; salida laboral creciente.',
  b:'Productoras audiovisuales y estudios de diseño de Bahía Blanca; estudiantes como productores multimedia locales.'},
 {t:'Nuevos lenguajes y formas de comunicar la información.',
  p:'Si cada época tuvo su lenguaje dominante, ¿cuál es la gramática del lenguaje digital y quién la está escribiendo?',
  d:'Narrativas transmedia, memes y formatos efímeros; la convergencia reorganiza los lenguajes anteriores; la pregunta por quién controla la gramática del nuevo lenguaje.',
  c:'Argentina produce narrativas transmedia y memes estudiados internacionalmente; cultura digital vibrante.',
  b:'Medios y creadores bahienses adoptando nuevos lenguajes; producción estudiantil de contenido local.'},
 {t:'La información y sus formatos: textual, verbal, sonora y visual.',

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.1 — Conceptos de técnica, tecnología e innovación</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Las computadoras "aplican ciencia" o son técnicas que precedieron a toda teorización? Si enseñamos NTICx como destino tecnológico inevitable y no como construcción social e histórica, ¿no estaremos formando usuarios obedientes en lugar de ciudadanos capaces de decidir qué tecnología quieren para su comunidad?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La técnica debe entenderse como el conjunto de procedimientos y saberes prácticos orientados a transformar el entorno, anteriores y muchas veces independientes de la sistematización científica: el ser humano talló piedra, domesticó el fuego y tejió redes mucho antes de poder explicar físicamente esas operaciones. La tecnología, en cambio, es la tecnociencia moderna: conocimiento técnico sistemático, basado en fundamentos científicos, orientado a producir bienes y resolver problemas sociales con criterios de eficiencia y reproducibilidad. La innovación, por su parte, no es sinónimo de invención: siguiendo la tradición schumpeteriana que recoge el Diseño Curricular cuando habla de "Revolución Tecnológica" e "innovaciones" (DC, 2010, p. 9), innovar es introducir una novedad que efectivamente se adopta y transforma prácticas, mercados y relaciones sociales. Invención sin adopción es curiosidad; innovación es invención socializada.</p>
<p>Históricamente, la relación entre estas tres categorías se invirtió varias veces. Las grandes técnicas preindustriales (molinos, imprenta, telares) precedieron a sus teorías; la segunda revolución industrial (electricidad, química) ya fue hija de la ciencia de laboratorio; y la revolución digital —en la que se inscribe NTICx— presenta una particularidad: la computación nació como ingeniería (máquinas de Turing y von Neumann, radar, criptografía de guerra) y solo después produjo su propia ciencia formal (ciencias de la computación), en un circuito de retroalimentación permanente donde la teoría habilita artefactos y los artefactos plantean nuevos problemas teóricos. Comprender esta genealogía es imprescindible para no naturalizar el presente tecnológico.</p>
<p>Didácticamente, este contenido es la puerta de entrada crítica de toda la materia: si el docente presenta la tecnología como fenómeno autónomo ("la tecnología avanza"), clausura la discusión política y ética que el Diseño Curricular exige (mirada crítico-reflexiva, dimensiones comunicativa, tecnológica y social). La estrategia sugerida es partir de objetos concretos del aula (un celular, una netbook del programa de inclusión digital) y reconstruir colectivamente su historia: quién la diseñó, con qué materiales, bajo qué modelo de negocio, qué prácticas sociales generó. Así la técnica deja de ser magia y se vuelve objeto de análisis, habilitando el abordaje de la innovación tecnológica que el Módulo 7 retomará al hablar de inteligencia artificial y nanotecnología como factores de ciudadanía digital.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina ofrece un caso paradigmático para discutir técnica, tecnología e innovación: INVAP (Bariloche, fundada en 1976) demostró que un país periférico puede desarrollar tecnología de frontera —reactores nucleares, satélites geoestacionarios ARSAT-1 y ARSAT-2— con ingeniería propia, mientras la industria electrónica fueguina (Ley 19.640) muestra el extremo opuesto: ensamblaje con alto componente importado. Esa tensión entre innovación genuina y dependencia tecnológica atraviesa el debate educativo nacional: el sistema científico (CONICET, universidades nacionales, INTI) produce conocimiento, pero la capacidad de convertirlo en innovación socialmente apropiada depende de políticas de Estado sostenidas. Enseñar esta distinción en la secundaria es enseñar a leer el modelo de desarrollo nacional.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca esta tensión se vive en clave local: la Universidad Nacional del Sur (UNS), a través de su Departamento de Ciencias e Ingeniería de la Computación y del ICIC (instituto de doble dependencia UNS-CONICET), forma investigadores que publican en inteligencia artificial y software a nivel mundial, mientras el Polo Petroquímico de Ingeniero White y el puerto operan con tecnología mayormente importada que demanda capacidades locales de mantenimiento, adaptación e integración. La ciudad exhibe así el ciclo completo: técnica aplicada en la industria, ciencia en la universidad, y el desafío permanente de convertir ese capital en innovación productiva local —startups, cooperativas de software, soluciones para el municipio— que retenga el talento formado en la región.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.2 — Datos, información, computación, informática, telemática, ofimática, burótica, domótica, orgware, nanotecnología. Hardware, software e infoware</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si los datos no son información, la información no es conocimiento y el conocimiento no es sabiduría, ¿qué es exactamente lo que la escuela transmite cuando dice "enseñar computación"? ¿Y quién se beneficia cuando una sociedad entera confunde acumular datos con comprender el mundo?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La jerarquía conceptual que este contenido exige distinguir es la siguiente: dato es la representación cruda (un número, un carácter, una señal) sin contexto; información es el dato organizado, contextualizado y con significado para un receptor; computación es la ciencia del cálculo automático y el procesamiento formal de símbolos; e informática, la disciplina que estudia el tratamiento automático de la información mediante computadoras. Sobre esa base se montan los campos compuestos: la telemática (telecomunicaciones + informática), la ofimática (automatización de tareas de oficina), la burótica (automatización integral del trabajo de buró o despacho, término de origen francés que amplía la ofimática a flujos documentales y circuitos administrativos), la domótica (automatización del hogar), el orgware (software orientado a modelar y soportar la organización institucional) y la nanotecnología (manipulación de la materia a escala nanométrica, que hoy produce los transistores de pocos nanómetros sin los cuales no existiría la computación actual).</p>
<p>A esta taxonomía el Diseño le agrega la tríada hardware/software/infoware: hardware es el soporte físico; software es el soporte lógico (clasificable en software de base, de aplicación y de programación); e infoware es una categoría más reciente que designa la información misma que los sistemas procesan y las prácticas humanas que la dotan de sentido: sin datos, sin usuarios que los interpreten y sin organizaciones que los gobiernen, hardware y software son chatarra cara. Esta tríada anticipa el núcleo del Módulo 7: la información como mercancía y objeto de disputa en la sociedad del conocimiento.</p>
<p>Didácticamente, el desafío es evitar la clase "diccionario": doce conceptos juntos producen saturación si se enseñan como lista. La propuesta es organizarlos como un mapa de dependencias (de dato → información → informática → telemática → campos aplicados) y anclar cada uno en una experiencia concreta del estudiante: el mensaje de WhatsApp (telemática), el trabajo práctico en el procesador de textos (ofimática), la alarma inteligente de una casa (domótica), el sistema de turnos del hospital (burótica/orgware), el procesador de su celular (nanotecnología). El Diseño Curricular exige expresamente que los estudiantes "conozcan e identifiquen la terminología en el campo de las NTICx" (DC, 2010, p. 19): la precisión léxica es aquí un objetivo de aprendizaje evaluable, no un adorno.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina regula la dimensión infoware desde la Ley 25.326 de Protección de los Datos Personales (habeas data), y el Estado nacional ha construido infraestructura de datos propia (data centers estatales, ANSES, RENAPER, plataformas como Mi Argentina) que materializa la idea de que los datos de los argentinos son un recurso estratégico. La tensión entre dato e información se vive hoy en el debate sobre dónde se alojan los datos nacionales (nubes extranjeras vs. infraestructura soberana) y en las políticas de datos abiertos que buscan convertir el dato estatal en información pública reutilizable. Enseñar estos conceptos es enseñar la materia prima de la economía contemporánea.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca es un laboratorio viviente de estos conceptos: el municipio avanzó con políticas de gobierno digital (expediente electrónico, turnos digitales, portal de datos abiertos) que son ejemplos locales de burótica y orgware; el Polo Petroquímico opera sistemas de automatización y control que ilustran la domótica llevada a escala industrial; y la UNS dicta desde hace décadas la formación en informática que nutre a las empresas locales de servicios digitales. Proponer a los estudiantes que clasifiquen los sistemas que usan diariamente en la ciudad convierte la terminología en lectura del propio territorio.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.3 — Análisis del desarrollo de los conceptos: TIC, NTIC, NTIT y NTICx</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué el Diseño Curricular bonaerense se niega a llamar a la materia "TIC" o "Informática" y la bautiza NTICx? ¿Qué visión de sociedad se juega en el cambio de una sigla, y por qué la "conectividad" merece una letra propia cuando la "comunicación" ya estaba incluida?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La secuencia siglar no es caprichosa sino histórica. TIC (Tecnologías de la Información y la Comunicación) designa el conjunto de herramientas que digitalizan información y la comunican; el prefijo que introduce NTIC (Nuevas Tecnologías de la Información y la Comunicación) marca una ruptura epocal: no se trata de cualquier tecnología comunicativa (la imprenta también comunicaba), sino de las tecnologías digitales, interactivas y en red surgidas de la convergencia entre microelectrónica, telecomunicaciones y software. NTIT (Nuevas Tecnologías de la Información y la Telecomunicación) desplaza el énfasis hacia la infraestructura de transmisión —el soporte físico y protocolar sin el cual la información no viaja—, visibilizando que detrás de cada mensaje hay redes, antenas, cables y protocolos.</p>
<p>El Diseño Curricular bonaerense da un paso más y acuña NTICx —Nuevas Tecnologías de la Información y la Conectividad— fundamentándose en el análisis del fenómeno Internet que el propio documento expone (DC, 2010, pp. 9-10): la conectividad es la primera constante estructural (sin conexión no hay impacto de red), la interactividad es la segunda (la conexión genera nuevas formas de relación a escala mundial) y la hipermedialidad es la tercera (acceso interactivo a cualquier componente informacional desde cualquier punto). La "x" final opera como variable abierta: la conectividad no es solo técnica sino social, económica y política. Como cita el documento a partir de Palamidessi, el nuevo escenario exige preparar a las futuras generaciones para "utilizar tecnologías y entornos digitales, construir conocimiento en un mundo de superabundancia de fuentes de información y comunicarse y trabajar en red" (DC, 2010, p. 9).</p>
<p>Didácticamente, este contenido permite trabajar la dimensión histórica del lenguaje tecnológico: proponer a los estudiantes que rastreen en qué documentos oficiales, publicidades y medios aparece cada sigla y en qué época, para descubrir que los nombres de las tecnologías también son construcciones políticas. El análisis siglar culmina con una pregunta que atraviesa toda la materia: estar conectado, ¿es estar comunicado? El propio Diseño advierte que "esta conexión no implica necesariamente comunicación, pese a que en muchos casos ambas ideas se confundan" (DC, 2010, p. 10), y esa advertencia es el punto de partida para todo el Módulo 5.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino nominó sus políticas públicas con estas siglas: programas como Argentina Conectada, el Plan Nacional de Conectividad y el DNU 690/2020 —que declaró a los servicios TIC y el acceso a Internet servicios públicos esenciales— expresan institucionalmente el paso de "TIC" a "conectividad" como derecho. ENACOM (Ente Nacional de Comunicaciones) regula ese campo y publica los indicadores de penetración de Internet que muestran la brecha entre centros urbanos y zonas rurales. La discusión NTICx es, en Argentina, una discusión sobre si la conectividad es mercancía o derecho, y ese debate llega al aula cada vez que un estudiante se conecta (o no puede conectarse) para estudiar.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca ilustra materialmente la diferencia entre las siglas: la ciudad cuenta con infraestructura de telecomunicaciones histórica (central telefónica, llegada de fibra de los grandes operadores nacionales, la cooperativa telefónica local y cooperativas de servicios de la región que extienden conectividad a localidades vecinas), pero esa infraestructura no se traduce automáticamente en comunicación ni en inclusión: en los barrios de la periferia la calidad de conexión sigue siendo desigual, y es allí donde la escuela secundaria se vuelve muchas veces el único punto de acceso estable. Trabajar NTICx en Bahía Blanca implica partir de esa realidad: mapear con los estudiantes dónde la ciudad está bien conectada, dónde no, y qué consecuencias tiene para estudiar, trabajar y participar.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.4 — Arquitectura y componentes de una computadora: CPU, ALU, UC, RAM, ROM, puertos USB/SD, placa madre, tarjetas de audio y video</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Puede ser plenamente ciudadano digital alguien que nunca abrió la máquina que usa todos los días? Si la opacidad del hardware es deliberada —fabricantes que sellan equipos, manuales que desaparecen, reparaciones prohibidas—, ¿no es el desconocimiento técnico una forma contemporánea de analfabetismo político?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La arquitectura dominante en las computadoras actuales sigue siendo, en lo esencial, la arquitectura de von Neumann (1945): una CPU (Unidad Central de Proceso) que integra la ALU (Unidad Aritmético-Lógica, encargada de los cálculos y las comparaciones) y la UC (Unidad de Control, que interpreta las instrucciones y coordina el flujo de datos), trabajando sobre una memoria principal donde conviven instrucciones y datos. La memoria RAM (Random Access Memory) es volátil: almacena temporalmente los programas y datos en uso, y se borra al apagar el equipo; la memoria ROM (Read Only Memory) y sus variantes modernas (BIOS/UEFI, firmware) conservan información permanente necesaria para el arranque. Comprender esta jerarquía de memorias —registro, caché, RAM, almacenamiento— es comprender por qué una computadora "se pone lenta" cuando la RAM se satura.</p>
<p>La placa madre (motherboard) es el chasis lógico que integra todo: aloja el microprocesador, los bancos de memoria, los slots de expansión y los buses que comunican los componentes; sobre ella se conectan los puertos USB (interfaz serial universal para periféricos y almacenamiento externo), los lectores de tarjetas SD (estándar de almacenamiento flash de cámaras y celulares) y las tarjetas de expansión, entre ellas la tarjeta de audio (conversión digital-analógica de sonido) y la tarjeta de video (GPU: originalmente encargada de renderizar gráficos, hoy convertida en el procesador masivamente paralelo que sostiene la inteligencia artificial contemporánea). La evolución histórica es parte del contenido: de placas separadas a chips integrados, de la Ley de Moore a los sistemas-en-chip (SoC) de los celulares, y de la CPU generalista al protagonismo actual de las GPU.</p>
<p>Didácticamente, el Diseño Curricular prevé este contenido con niveles de complejidad diferenciados: el estudiante principiante clasifica y explica periféricos y operaciones básicas; el intermedio describe funciones de las partes y secuencias de arranque; el avanzado administra, configura y detecta fallas (DC, 2010, p. 25). La estrategia de máxima eficacia es el desmontaje pedagógico: trabajar con equipos en desuso que los alumnos abren, identifican, fotografían y documentan, produciendo una "ficha técnica" con nomenclatura correcta. Nada reemplaza tocar una placa madre para que CPU, RAM y puertos dejen de ser abstracciones.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El hardware en Argentina es un tema de soberanía industrial: la Ley 19.640 de promoción industrial de Tierra del Fuego permitió el ensamblado nacional de netbooks, celulares y televisores (plantas como las de Río Grande), y el programa Conectar Igualdad (desde 2010) compró millones de netbooks que incluyeron producción local. Sin embargo, el diseño de los microprocesadores sigue concentrado en pocas empresas globales, lo que exhibe los límites del modelo de ensamblaje. Conocer la arquitectura de una computadora en la escuela pública argentina es también conocer qué parte de la cadena de valor tecnológico el país domina y cuál depende del exterior.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca, las netbooks de los planes nacionales de inclusión digital (Conectar Igualdad y sus continuaciones) llegaron a las escuelas secundarias locales y generaron un ecosistema propio: docentes que aprendieron a administrarlas, referentes técnicos escolares que las mantienen, y un mercado local de reparación y venta de insumos que emplea a técnicos egresados de las escuelas técnicas (EET) de la ciudad. Proponer el desmontaje de equipos en desuso de la propia escuela —muchas veces acumulados sin destino— resuelve simultáneamente el objetivo pedagógico y un problema real de la institución, y conecta el contenido con los talleres de las escuelas técnicas bahienses y los laboratorios de la UNS y la UTN Regional Bahía Blanca.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.5 — Concepto de sistema informático</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Una computadora apagada, sin datos y sin usuarios, ¿es un sistema informático? Si la respuesta es no, entonces el sistema no está en la máquina: está en las relaciones entre máquinas, programas, datos y personas. ¿Y quién gobierna esas relaciones en la vida de un adolescente?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Un sistema informático es un conjunto articulado de componentes orientado al tratamiento automático de la información, que integra cinco elementos inseparables: hardware (equipamiento), software (programas que lo gobiernan), datos (la materia prima procesada), recursos humanos (quienes lo operan, administran y usan) y comunicaciones (los enlaces que lo conectan con otros sistemas). Esta definición sistémica es crucial porque desplaza la mirada del objeto al proceso: una misma computadora es sistemas distintos según el software, los datos y las personas que la habiten. El enfoque sistémico —entradas, proceso, salidas, retroalimentación, control— permite además comparar sistemas informáticos con otros sistemas sociales, anticipando el pensamiento en red que la materia desarrollará en el Módulo 2.</p>
<p>Los sistemas informáticos se clasifican según su alcance: sistemas transaccionales (cajeros, puntos de venta), sistemas de gestión (administración de escuelas, hospitales, municipios), sistemas de soporte a decisiones, sistemas embebidos (los que gobiernan un auto, un semáforo o una planta industrial) y sistemas distribuidos en red. Cada uno combina los cinco elementos con distinta proporción: en un sistema embebido domina el hardware; en una plataforma web dominan los datos y las comunicaciones; en todos, el factor humano decide la calidad del resultado. El Diseño Curricular espera que los estudiantes "manejen los dispositivos electrónicos y sistemas informáticos" e "investiguen y resuelvan problemas referidos al uso de sistemas y aplicaciones informáticas" (DC, 2010, p. 19), objetivos imposibles si el sistema se reduce mentalmente a "la computadora".</p>
<p>Didácticamente, la estrategia indicada es el relevamiento de sistemas reales: que los estudiantes identifiquen los sistemas informáticos presentes en su escuela (sistema de asistencia, libreta digital, biblioteca), en su municipio y en su vida cotidiana, y para cada uno determinen los cinco componentes, quién lo administra y qué pasaría si fallara. Este ejercicio introduce, sin nombrarla todavía, la noción de dependencia tecnológica: cuanto más crítico es el sistema, más importante es quien lo controla.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino es un enorme sistema informático: ANSES, AFIP-ARCA, el sistema de salud (historias clínicas digitales), el RENAPER, la emisión del voto y los padrones electorales, la tarjeta SUBE. Cada uno de esos sistemas plantea la pregunta por la soberanía: ¿dónde se procesan esos datos, quién los administra, qué pasa si un proveedor externo los retiene? Los debates nacionales sobre data centers estatales y nube soberana son la versión adulta de este contenido escolar, y muestran que "sistema informático" es sinónimo de infraestructura crítica nacional.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca ofrece ejemplos cercanos y analizables: el sistema de turnos y gestión del Hospital Municipal, los sistemas administrativos de la municipalidad (expediente electrónico), los sistemas de gestión académica de la UNS y la UTN, y los sistemas de operación del puerto y las terminales del polo industrial. Proponer a los estudiantes que elijan uno de estos sistemas, describan sus cinco componentes y evalúen su criticidad (¿qué pasa si se cae un día?) transforma el concepto abstracto en un diagnóstico concreto del funcionamiento tecnológico de su propia ciudad.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.6 — Proceso computacional: entrada, procesamiento y salida de información</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si todo proceso computacional puede reducirse a entrada-procesamiento-salida, ¿por qué la etapa de procesamiento se vuelve cada vez más invisible, más opaca y más poderosa? ¿Qué ciudadanía es posible cuando las decisiones que afectan a millones se toman dentro de cajas negras que nadie puede auditar?</div>

<p>El modelo E-P-S (entrada, procesamiento, salida) describe el ciclo básico de cualquier sistema computacional: los dispositivos de entrada (teclado, mouse, micrófono, cámara, sensores) capturan datos del mundo exterior; la unidad de proceso (CPU y memorias) ejecuta las instrucciones del programa sobre esos datos; y los dispositivos de salida (pantalla, parlantes, impresora, actuadores) devuelven resultados perceptibles. El modelo se completa con dos elementos que muchas veces se omiten en la enseñanza inicial: el almacenamiento (la información se guarda antes, durante y después del proceso) y la retroalimentación (las salidas modifican las entradas siguientes, como ocurre en un termostato o en el algoritmo de una red social que aprende de nuestros clics).</p>
<p>La evolución histórica del modelo es parte del contenido: las primeras computadoras procesaban por lotes (batch), con entrada por tarjetas perforadas y salida impresa; la interactividad (años 1960-70) hizo que entrada y salida fueran simultáneas; la conectividad en red (años 1990 en adelante) distribuyó las tres etapas en máquinas distintas; y la era actual de sensores, Internet de las Cosas e inteligencia artificial multiplicó las entradas (datos de comportamiento, geolocalización, voz) y volvió algorítmicas las decisiones del procesamiento. Por eso el modelo E-P-S, aparentemente simple, es la llave para discutir temas complejos: qué datos entregamos (entrada), quién los procesa y con qué criterios (procesamiento), y qué recibimos a cambio (salida) es exactamente el esquema con que se analiza una red social, un sistema de crédito o una plataforma educativa.</p>

<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En el territorio bahiense el modelo E-P-S se industrializa: el Polo Petroquímico de Ingeniero White funciona como un gigantesco sistema de entrada (sensores de presión, temperatura y flujo), procesamiento (sistemas de control SCADA que gobiernan plantas continuas) y salida (actuadores, alarmas, informes), y el puerto replica el esquema con sensores de carga, sistemas de logística y documentación electrónica. En el aula, proponer el diagrama E-P-S de estos sistemas locales —con sus riesgos y sus salvaguardas— vincula la materia con la matriz productiva real de la ciudad y con las salidas laborales técnicas de los estudiantes.</div>

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.7 — Características de un computador: almacenamiento de información y velocidad de procesamiento</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿"Más gigas y más gigahertz" significa automáticamente "mejor computadora"? Si el mercado educa a los jóvenes para leer especificaciones como quien lee una carta de restaurante, ¿qué concepción de ciudadano tecnológico estamos formando: un consumidor o un sujeto crítico?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Las dos características fundamentales que el Diseño Curricular destaca para evaluar un computador son la capacidad de almacenamiento y la velocidad de procesamiento. La capacidad de almacenamiento se mide en unidades binarias (del bit al yottabyte, contenido siguiente) y depende del tipo de soporte: discos rígidos (HDD, mecánicos, gran capacidad, menor velocidad), unidades de estado sólido (SSD, sin partes móviles, mucho más rápidas) y almacenamiento en la nube (externalizado). La velocidad de procesamiento depende de la frecuencia de reloj (medida en gigahertz), la cantidad de núcleos del procesador, la memoria caché, la cantidad y velocidad de la RAM y la arquitectura del conjunto: un equipo "rápido" lo es por equilibrio de componentes, no por un número aislado.</p>
<p>La enseñanza de estas características es inseparable de su historia: la Ley de Moore (duplicación aproximada de transistores cada dos años) sostuvo durante décadas el crecimiento exponencial de velocidad y capacidad; ese crecimiento físico hoy se acerca a límites térmicos y cuánticos, y la industria responde con multinúcleo, arquitecturas especializadas (GPU, NPU para inteligencia artificial) y almacenamiento cada vez más denso. Esta evolución explica fenómenos que los estudiantes viven sin comprender: por qué su celular de tres años "se volvió lento" (obsolescencia de software sobre hardware viejo, obsolescencia programada), por qué un video que antes no entraba hoy se guarda sin pensar, y por qué las especificaciones técnicas cambian de significado año a año.</p>
<p>Didácticamente, el contenido se trabaja con comparación crítica de equipos reales: tomar las especificaciones de una netbook escolar, un celular de gama baja y un equipo gamer, y analizar qué combinación de almacenamiento y velocidad necesita cada uso (escribir trabajos, ver videos, programar, jugar). El objetivo no es formar compradores informados sino ciudadanos que comprendan que las especificaciones son variables de un modelo de negocio: la obsolescencia programada, la basura electrónica y el derecho a reparar son las consecuencias sociales directas de este contenido, y conectan con la dimensión social que el Diseño exige en todas las alfabetizaciones.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina no tiene una ley nacional integral de residuos de aparatos eléctricos y electrónicos (RAEE), pese a los proyectos presentados durante años en el Congreso, y la basura electrónica crece mezclada con residuos comunes o termina en circuitos informales de recupero, con riesgos ambientales y sanitarios. Al mismo tiempo, la brecha de equipos es una dimensión central de la brecha digital nacional: millones de estudiantes acceden a la informática a través de dispositivos prestados, compartidos o anticuados, y los planes estatales de entrega de netbooks (Conectar Igualdad, Juana Manso) son la respuesta pública a esa desigualdad. Hablar de almacenamiento y velocidad en la escuela pública argentina es hablar, también, de quién puede y quién no puede actualizar su tecnología.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca la cuestión se territorializa: las escuelas que recibieron netbooks estatales enfrentan el problema del envejecimiento de los equipos (baterías agotadas, discos lentos, software que ya no corre), y la respuesta local combina referentes técnicos escolares, talleres de reparación del centro de la ciudad y proyectos de reutilización. Trabajar este contenido comparando las especificaciones reales de los equipos disponibles en la propia escuela —y calculando cuánto tardarían en quedar obsoletos— produce un diagnóstico honesto de la infraestructura educativa local y habilita proyectos concretos: campañas de optimización, recuperación de equipos y concientización sobre basura electrónica con destino responsable en la ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.8 — Clasificación de periféricos: de entrada, de salida, de almacenamiento masivo y de conectividad</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Son los periféricos simples "accesorios" de la computadora, o son las prótesis que definen qué puede percibir, qué puede hacer y con quién puede hablar una máquina? Si agregamos un sensor a una computadora, ¿cambiamos su hardware o cambiamos su mundo?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los periféricos son los dispositivos que median entre el núcleo de procesamiento y el mundo exterior, y se clasifican por la dirección del flujo de información: de entrada (introducen datos al sistema: teclado, mouse, escáner, micrófono, cámara, lector de huellas, sensores), de salida (entregan resultados al usuario: monitor, impresora, parlantes, auriculares), de almacenamiento masivo (conservan información de forma persistente: discos externos, pendrives, tarjetas SD, unidades ópticas, y hoy también los NAS y la nube como almacenamiento desmaterializado) y de conectividad (vinculan el equipo con redes y otros dispositivos: placa de red, módem, adaptadores Wi-Fi y Bluetooth). La clasificación no es rígida: una pantalla táctil, un pendrive o un headset con micrófono son simultáneamente entrada y salida, y esa ambigüedad es didácticamente productiva.</p>
<p>La evolución de los periféricos cuenta la historia de la relación humano-máquina: del teclado y el mouse (interfaces de escritorio) a las pantallas táctiles, los comandos de voz, los sensores biométricos y los dispositivos vestibles e IoT, donde los "periféricos" se vuelven objetos cotidianos inteligentes. Cada nuevo periférico amplía lo que la computadora puede capturar del mundo —y por lo tanto amplía también lo que puede registrar sobre las personas: una cámara, un micrófono y un GPS son periféricos de entrada y son a la vez puntos de vigilancia potencial. Esta doble faz es la que el Módulo 7 (privacidad, robo de identidad) retoma y que debe anunciarse ya desde el Módulo 1.</p>
<p>Didácticamente, el Diseño Curricular ubica este contenido en el nivel principiante de sus tablas de intervención ("Clasificar y explicar los distintos periféricos de una computadora", DC, 2010, p. 25), lo que lo hace ideal para las primeras clases y para estudiantes con baja experiencia previa. La actividad recomendada es el inventario periferizado del aula: listar todos los dispositivos conectables presentes en la escuela, clasificarlos en las cuatro categorías, discutir los casos mixtos y redactar definiciones propias con terminología correcta. El cierre puede ser proyectivo: ¿qué periféricos necesitaría una computadora para ayudar en una tarea comunitaria concreta (por ejemplo, monitorear la temperatura de un comedor escolar)?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El acceso a periféricos es una dimensión invisible de la brecha digital argentina: muchas escuelas tienen computadoras pero carecen de impresoras funcionales, escáneres o audio; muchos estudiantes tienen celular pero no auriculares ni micrófono para clases virtuales. La accesibilidad agrega una capa de derechos: la Ley 26.653 de accesibilidad de la información en páginas web y las tecnologías asistivas (lectores de pantalla, teclados adaptados) recuerdan que los periféricos también son herramientas de inclusión para personas con discapacidad. Enseñar la clasificación es también enseñar que la configuración de una máquina define quién puede usarla.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca el relevamiento de periféricos puede anclarse en instituciones reales: las escuelas técnicas locales (EET) cuentan con laboratorios de electrónica e informática donde los estudiantes pueden inventariar equipos; los espacios de inclusión digital municipales y los puntos de acceso comunitario exhiben configuraciones pensadas para usuarios sin equipamiento propio; y el comercio tecnológico del centro bahiense muestra la oferta y los precios reales de cada categoría. Proponer que los estudiantes diseñen la configuración de periféricos para un caso local concreto (una biblioteca popular, un club de barrio, una sala de salud) convierte la clasificación en un ejercicio de diagnóstico territorial.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.9 — Concepto de sistema binario</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué la máquina más compleja que construyó la humanidad piensa en un idioma de dos únicos estados? Cuando toda la cultura —música, fotos, libros, voces— se reduce a ceros y unos, ¿qué se conserva y qué se pierde en esa traducción universal?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El sistema binario es el sistema de numeración en base 2 que utiliza únicamente dos dígitos (0 y 1) para representar toda cantidad, y es el lenguaje nativo de las computadoras porque sus circuitos electrónicos trabajan con dos estados físicos claramente distinguibles: presencia o ausencia de tensión eléctrica (transistor saturado o cortado). Cada dígito binario es un bit (binary digit), y las combinaciones de bits representan números, caracteres, instrucciones, imágenes y sonidos: 8 bits forman un byte, capaz de codificar 256 valores distintos. La historia del binario es larga: Leibniz lo formalizó en el siglo XVII, Boole lo convirtió en lógica algebraica en el XIX, y Shannon demostró en 1937 que los circuitos eléctricos podían implementar esa lógica, fundando así la computación digital.</p>
<p>Comprender el binario es comprender el corazón de la digitalización: una operación aritmética (suma binaria con acarreo), una conversión decimal-binario y la idea de codificación (ASCII y luego Unicode para texto, muestreo para audio, matriz de píxeles para imagen) bastan para que el estudiante vea cómo cualquier fenómeno se vuelve procesable por una máquina. Este contenido es además la base conceptual de la criptografía, la compresión de datos y la detección de errores: sin bits no hay cifrado, sin bits no hay streaming, sin bits no hay Internet. El Módulo 2 entero (redes digitales) presupone que la información viaja como secuencias binarias.</p>
<p>Didácticamente, el binario es uno de los contenidos que mejor se enseñan sin computadora (actividades desenchufadas): tarjetas que se muestran u ocultan (cada una vale el doble que la anterior: 1, 2, 4, 8, 16) permiten componer cualquier número delante de la clase; el juego de adivinar fechas de cumpleaños con tarjetas binarias demuestra la potencia del sistema; y la codificación de iniciales con una tabla ASCII simplificada convierte nombres en ceros y unos. Estas actividades incluyen a los estudiantes con menor experiencia tecnológica porque no requieren máquina, solo razonamiento, y producen el momento conceptual más potente del Módulo 1: la comprensión de que la computadora no "entiende" nada distinto de lo que nosotros decidimos codificar.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene tradición en la enseñanza de las ciencias de la computación y en competencias de programación: la Olimpíada Informática Argentina (OIA) convoca desde hace décadas a estudiantes de todo el país, y las carreras de informática de las universidades públicas forman a los profesionales de una industria del software que es el tercer complejo exportador de conocimientos del país. El binario que se enseña en el aula es la base exacta de esa cadena: sin ese fundamento no hay programación, sin programación no hay industria del conocimiento, y sin industria del conocimiento Argentina pierde uno de sus pocos sectores competitivos a escala global. Enseñar binario con seriedad es política tecnológica de base.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca es sede de instancias locales y regionales de la Olimpíada Informática Argentina y de competencias de programación que involucran a escuelas secundarias de la ciudad y la región, articuladas con la UNS y la UTN. El Departamento de Ciencias e Ingeniería de la Computación de la UNS sostiene además proyectos de extensión de enseñanza de programación en escuelas, y las escuelas técnicas bahienses incorporan lógica y sistemas digitales en sus talleres. Conectar el contenido binario con estas instancias —invitar a un competidor de la OIA, resolver en clase los problemas de la olimpíada local— muestra a los estudiantes que el bit que aprenden hoy es el piso de una trayectoria real de estudio y trabajo en su propia ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.10 — Concepto de digitalización</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando digitalizamos un documento, una voz o un rostro, ¿estamos copiando la realidad o estamos construyendo otra cosa? Y si lo digitalizado puede copiarse, alterarse y viralizarse sin degradarse, ¿de quién es ese duplicado y qué derechos quedan atrapados en la conversión?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Digitalizar es convertir información analógica —continua en el tiempo y en sus valores, como una voz, una fotografía en papel o un documento manuscrito— en una representación numérica discreta (secuencias de bits) que una computadora puede almacenar, procesar y transmitir. El proceso técnico tiene etapas definidas: muestreo (tomar mediciones periódicas de la señal), cuantificación (asignar a cada muestra un valor numérico de una escala finita) y codificación (expresar esos valores en binario). La calidad de la digitalización depende de la frecuencia de muestreo y de la resolución: el teorema de Nyquist establece que para reconstruir una señal hay que muestrear al menos al doble de su frecuencia máxima, principio que explica por qué el audio digital estándar usa 44,1 kHz.</p>
<p>La digitalización es el fenómeno cultural de nuestra era y el propio Diseño Curricular lo ubica en el centro: la "Revolución Tecnológica impulsa procesos globalizadores en la economía, mundialización de las comunicaciones y digitalización de la cultura" (DC, 2010, p. 9). Música, cine, fotografía, libros, trámites, dinero y vínculos sociales se volvieron bits, y esa conversión trajo propiedades inéditas: copia perfecta sin pérdida, distribución instantánea global, procesamiento algorítmico y, también, nuevas vulnerabilidades (alteración, vigilancia, pérdida de soporte). El concepto de digitalización conecta directamente con los Módulos 3 y 4 (información e imagen) y con el Módulo 7 (propiedad intelectual, privacidad).</p>
<p>Didácticamente, el contenido se enseña con experiencias de conversión: digitalizar un objeto analógico del aula (un dibujo en papel con la cámara del celular, una voz con una grabadora) y comparar el original con su versión digital (¿qué se conservó, qué se perdió, cuánto pesa, cuántas copias pueden hacerse?); luego, el camino inverso: imprimir un texto o revelar digitalmente una imagen para cerrar el ciclo. El debate ético se introduce con casos: ¿qué pasa cuando digitalizamos la voz de una persona sin permiso? ¿Y cuando una IA usa millones de imágenes digitalizadas para entrenarse? La digitalización deja así de ser técnica y se vuelve problema ciudadano.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino llevó adelante procesos masivos de digitalización: la digitalización de registros civiles y del DNI, la historia clínica digital, los expedientes judiciales y administrativos electrónicos, los libros de las bibliotecas populares en programas de preservación, y la televisión digital. Cada digitalización estatal redefine derechos: un trámite digitalizado acerca el Estado a quien tiene conectividad y puede alejarlo de quien no la tiene. La Ley 25.326 protege los datos personales resultantes de esas digitalizaciones, y el debate sobre la validez legal del documento digital (firma digital, Ley 25.506) completa el cuadro: digitalizar es también decidir qué vale jurídicamente.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca digitalizó en los últimos años buena parte de su administración: expediente electrónico municipal, turnos digitales de salud, boletines oficiales en línea y sesiones del Concejo Deliberante accesibles por Internet, además del archivo histórico local y de los materiales de la Biblioteca Rivadavia, cuya preservación digital es tema de interés comunitario tras los episodios climáticos que afectaron a la ciudad. Proponer a los estudiantes analizar un trámite municipal digitalizado —cuál era su versión analógica, qué se ganó, quién puede quedar excluido— convierte el concepto técnico en una evaluación concreta de la modernización del Estado local.</div>
</div>`;
