<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.11 — Unidades de medida: bit, byte, kbyte, mbyte, gbyte, terabyte, petabyte, exabyte, zettabyte y yottabyte</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Cuánto es un yottabyte y quién lo produce? Si cada clic, cada foto y cada mensaje genera datos que alguien almacena, explota y vende, ¿dónde se alojan los datos de los argentinos, bajo qué jurisdicción y a beneficio de quién?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La escala de medición de la información digital parte del bit (unidad mínima, 0 o 1) y del byte (8 bits, la unidad práctica básica), y crece en múltiplos que históricamente se enseñaron en potencias de 1024 (2¹⁰) aunque hoy la norma IEC distingue kilobyte (1000 bytes, decimal) de kibibyte (1024 bytes, binario). La sucesión que el Diseño Curricular exige recorrer es completa: kilobyte (KB), megabyte (MB), gigabyte (GB), terabyte (TB), petabyte (PB), exabyte (EB), zettabyte (ZB) y yottabyte (YB), cada una mil veces mayor que la anterior en notación decimal. El objetivo no es la memorización mecánica sino la construcción de una intuición de escala: una canción ronda los 4 MB, una película varios GB, un disco actual 1-4 TB, los centros de datos de las grandes plataformas se miden en exabytes y el tráfico global anual de Internet se estima en decenas de zettabytes.</p>
<p>Esta escala tiene historia y tiene economía: durante décadas el límite fue el almacenamiento (los disquetes de 1,44 MB obligaban a pensar el tamaño de cada archivo); hoy el límite parece haber desaparecido para el usuario, pero el costo solo se desplazó: los datos "gratuitos" se alojan en granjas de servidores que consumen energía comparable a la de países pequeños. El concepto de big data nace de esta escala: cuando el volumen (zettabytes), la velocidad y la variedad de datos superan la capacidad de procesamiento tradicional, aparecen nuevas técnicas (análisis algorítmico, inteligencia artificial) y nuevos poderes: quien acumula y procesa datos a esa escala condiciona mercados, elecciones y comportamientos. El Módulo 7 lo dirá con todas las letras: la información es mercancía.</p>
<p>Didácticamente, el contenido funciona con equivalencias corporales y comparaciones absurdas que fijan la escala: si un bit fuera un grano de arena, ¿cuántos granos son un terabyte?; ¿cuántos pendrives de la escuela harían falta para un petabyte?; ¿cuánto tarda en llenarse un gigabyte con las fotos del celular de un estudiante? La actividad de cierre recomendada es la auditoría personal: calcular cuántos MB/GB consume y produce cada estudiante por semana (mensajes, videos, juegos) y proyectar ese número al curso, a la ciudad y al país, transformando la unidad de medida en conciencia del propio peso digital.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La pregunta por dónde viven los datos argentinos es estratégicamente central: gran parte del tráfico nacional se aloja en centros de datos de empresas extranjeras, fuera de la jurisdicción nacional, mientras el Estado desarrolla infraestructura propia (data centers estatales, el centro de datos de ARSAT en Benavídez) para retener información sensible. ENACOM publica estadísticas de tráfico y acceso, y el debate sobre soberanía de datos cruza a todos los gobiernos desde la sanción de la Ley 25.326. Enseñar las unidades de medida junto con la pregunta "¿dónde está un gigabyte argentino?" es enseñar geopolítica de la información con herramientas matemáticas simples.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca concentra infraestructura de datos regional: salas de servidores del municipio, de la UNS, de bancos y empresas del polo industrial, y nodos de telecomunicaciones que sirven al sudoeste bonaerense. Proponer a los estudiantes estimar la huella de datos de su propia comunidad —cuánto almacenamiento usa su escuela, cuántos GB mueve el municipio, qué tamaño tiene el archivo digital local— y compararla con las escalas del contenido (¿llegamos al terabyte?, ¿al petabyte?) territorializa la abstracción y abre la discusión sobre qué datos se generan en la ciudad, quién los guarda y para qué.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.12 — Concepto de programa</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Un programa de computadora es una cosa, una idea o una ley? Si un programa es texto escrito (código), ¿por qué hay países que prohíben leerlo, modificarlo y compartirlo? ¿Qué modelo de sociedad decide quién puede escribir las instrucciones que gobiernan la vida de todos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Un programa es un conjunto finito y ordenado de instrucciones que una computadora puede ejecutar para resolver un problema o realizar una tarea; esas instrucciones se escriben en lenguajes de programación, desde los de bajo nivel (ensamblador, cercano al hardware) hasta los de alto nivel (Python, Java, C++, orientados a la comprensión humana), y se traducen al lenguaje máquina mediante compiladores o intérpretes. La secuencia lógica que todo programa encierra —entrada, proceso, salida, con estructuras de secuencia, selección e iteración— es el contenido profundo del concepto: programar es formalizar el pensamiento, y por eso el Diseño Curricular vincula este contenido con el desarrollo del pensamiento crítico, creativo e innovador (DC, 2010, p. 15).</p>
<p>La historia del programa es la historia de la informática misma: de las tarjetas perforadas de los años 1950 a los sistemas operativos, de los programas empaquetados de los 80 a las aplicaciones móviles y los servicios en la nube del presente. En esa evolución cambió también la naturaleza jurídica y económica del programa: primero fue conocimiento compartido entre laboratorios, luego mercancía protegida por derechos de autor (modelo propietario) y desde los años 1980 convive con el modelo de código abierto, que garantiza por licencia las libertades de uso, estudio, modificación y distribución. Esta dimensión legal no es un agregado: es el puente directo hacia el Módulo 7 (licencias de software, copyright, creative commons, hacking ético).</p>
<p>Didácticamente, el concepto de programa debe enseñarse antes con lógica que con sintaxis: algoritmos de la vida cotidiana (recetas, instrucciones para atarse los cordones) escritos con precisión y probados por un compañero que los ejecuta "como una máquina" (actividad desenchufada de rol), diagramas de flujo de decisiones simples y, recién entonces, entornos visuales de programación por bloques (Scratch y similares) donde el estudiante produce su primer programa real. El Diseño Curricular espera que los estudiantes "investiguen y resuelvan problemas referidos al uso de sistemas y aplicaciones informáticas" (DC, 2010, p. 19): producir un programa propio, por modesto que sea, es la forma más profunda de investigar un sistema.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La industria argentina del software es un caso de éxito nacional: el régimen de promoción (Ley 25.922 y su continuidad en la Ley 27.506 de Economía del Conocimiento) consolidó un sector exportador que emplea a más de cien mil profesionales, con empresas argentinas que compiten globalmente. Las universidades públicas son la cantera de ese talento, y los clubes de programación y las olimpíadas informáticas federales son la puerta de entrada. Al mismo tiempo, el Estado argentino produce y usa software propio (con desarrollos nacionales en áreas estratégicas) y la distribución Huayra GNU/Linux demostró que el país puede construir sus propias herramientas. Enseñar qué es un programa es enseñar la materia prima de una de las pocas industrias donde Argentina es competitiva en el mundo.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene un ecosistema de software propio: empresas y estudios radicados en la ciudad que exportan servicios y productos digitales, alimentados por graduados de la UNS y la UTN Regional Bahía Blanca; comunidades locales de desarrollo que organizan encuentros, hackathones y talleres; y proyectos de extensión universitaria que llevan programación a las escuelas secundarias. Invitar a desarrolladores locales al aula, visitar (presencial o virtualmente) una empresa de software bahiense o participar de las instancias locales de la Olimpíada Informática Argentina transforma el concepto abstracto de "programa" en una trayectoria concreta de estudio y trabajo disponible en la propia ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.13 — Sistema operativo: propietarios y código abierto (open source); operaciones básicas</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Puede una escuela pública enseñar pensamiento crítico usando un software cuyo código está prohibido leer? Cuando elegimos entre Windows y Linux para una netbook estatal, ¿estamos eligiendo un producto o estamos eligiendo un modelo de soberanía tecnológica?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El sistema operativo (SO) es el programa fundamental que administra el hardware y provee servicios al resto del software: gestiona el procesador (qué programa usa la CPU y cuándo), la memoria (qué datos residen en RAM), el sistema de archivos (cómo se guardan y organizan los datos), los dispositivos (mediante controladores o drivers) y la interfaz con el usuario (escritorio, ventanas, iconos). Sin sistema operativo, una computadora es un circuito inerte; con él, se convierte en una máquina de propósito general. La clasificación que el Diseño exige es doble: SO propietarios (código fuente cerrado, licencia restrictiva, pago por licencia; ejemplos: Windows, macOS) y SO de código abierto/open source (código accesible, modificable y redistribuible según licencias libres como la GPL; ejemplo central: GNU/Linux y sus distribuciones).</p>
<p>La historia del código abierto es parte del contenido: el proyecto GNU (Richard Stallman, 1983) y las cuatro libertades del software libre (usar, estudiar, modificar, distribuir), el núcleo Linux (Linus Torvalds, 1991) y su adopción masiva en servidores, supercomputadoras, celulares (Android se basa en Linux) y dispositivos embebidos. El estudiante debe comprender que el open source no es una curiosidad militante sino la base de la infraestructura digital mundial: la mayor parte de Internet funciona sobre software libre. Las operaciones básicas que el Diseño Curricular prescribe (uso del escritorio, administración de ventanas e iconos, exploración de carpetas y archivos, búsquedas, nociones de resguardo, DC, 2010, p. 26) constituyen el piso operativo desde el cual se construye toda la materia.</p>
<p>Didácticamente, este contenido es una oportunidad única de enseñanza comparativa: trabajar la misma operación (crear carpetas, guardar archivos, buscar, configurar) en un SO propietario y en una distribución GNU/Linux (por ejemplo Huayra o una distribución liviana que corra desde un pendrive) para que los estudiantes descubran que "el" sistema operativo no es uno solo, que las interfaces son diseños y no naturalezas, y que existe elección real. La tabla de intervención del Diseño gradúa la exigencia: el principiante utiliza el escritorio; el intermedio maneja panel de control y protección del sistema; el avanzado instala el SO, configura servicios y optimiza tareas (DC, 2010, p. 26).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina protagonizó una de las experiencias de software libre estatal más grandes del mundo: el programa Conectar Igualdad distribuyó millones de netbooks con Huayra GNU/Linux, una distribución desarrollada por el Estado nacional (Educ.ar) pensada para el aula, y el debate sobre software libre en el Estado (transparencia, soberanía, costos, independencia de proveedores) atraviesa universidades nacionales, provincias y municipios desde hace dos décadas. Las universidades públicas argentinas enseñan y desarrollan GNU/Linux en sus carreras de informática, y organismos estatales migraron parcialmente sus estaciones de trabajo. Elegir un sistema operativo en el aula argentina es, literalmente, discutir el modelo de país tecnológico.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca el contenido tiene anclaje directo: las netbooks con Huayra de los planes de inclusión digital circularon por las escuelas secundarias locales; la UNS y la UTN Regional Bahía Blanca cuentan con cátedras, grupos de estudio y usuarios de GNU/Linux que históricamente organizaron jornadas de instalación (install fests) y difusión del software libre; y muchas de las computadoras de escuelas y organizaciones barriales funcionan mejor con distribuciones livianas de Linux que recuperan equipos antiguos. Proponer en clase la experiencia comparada Windows/Linux sobre el mismo hardware escolar —incluida la instalación supervisada de una distribución libre en un equipo en desuso— convierte el contenido en práctica concreta de soberanía tecnológica local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.14 — Administración de un sistema operativo</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿"Administrar" una computadora es una destreza técnica menor o es un ejercicio de gobierno sobre lo propio? Quien solo sabe "usar" pero no "administrar", ¿no está delegando el control de su herramienta en quien sí puede configurarla? ¿Qué autonomía pierde un ciudadano digital que no administra sus propios dispositivos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Administrar un sistema operativo significa gobernar su funcionamiento: gestionar usuarios y permisos (quién puede acceder a qué), procesos y servicios (qué programas corren, con qué prioridad, cuáles se inician con el sistema), archivos y carpetas (organización, atributos, respaldo), dispositivos y controladores (instalación y actualización de drivers), actualizaciones de seguridad, y herramientas de diagnóstico como el administrador de tareas y el visor de eventos. El Diseño Curricular gradúa esta administración en tres niveles: el principiante opera el escritorio y comprende la importancia de resguardar archivos; el intermedio trabaja con el explorador, el panel de control, la configuración de barra y menú, la protección contra amenazas y el software de resguardo; el avanzado instala el sistema operativo, configura servicios, instala y quita aplicaciones, optimiza funciones y sistematiza el resguardo (DC, 2010, p. 26).</p>
<p>La administración es inseparable de la seguridad: un sistema sin actualizar, sin permisos bien definidos y sin respaldos es un sistema vulnerable, y el propio Diseño Curricular integra aquí la protección del sistema operativo frente a amenazas informáticas como contenido del nivel intermedio. La evolución histórica muestra un desplazamiento: de sistemas que exigían administración experta permanente (línea de comandos, edición manual de configuración) a sistemas que ocultan la administración tras interfaces amigables, con el riesgo de que el usuario pierda conciencia de lo que ocurre bajo la superficie. Recuperar esa conciencia es un objetivo pedagógico explícito de NTICx.</p>
<p>Didácticamente, la administración se enseña con talleres de mantenimiento real: asignar a cada equipo de estudiantes una computadora del aula para que la diagnostiquen (estado del disco, memoria en uso, programas que inician con el sistema, actualizaciones pendientes), documenten el diagnóstico y ejecuten tareas de optimización y resguardo supervisadas. La creación de un protocolo de respaldo escolar (qué se copia, dónde, cada cuánto, quién verifica) produce un artefacto institucional útil y evaluable, y anticipa el concepto de plan estratégico que el Diseño Curricular exige en la evaluación (DC, 2010, p. 30).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La administración de sistemas es una profesión con demanda sostenida en Argentina: administradores de redes, de servidores y de bases de datos trabajan en bancos, hospitales, municipios, universidades y empresas del conocimiento, y las universidades públicas y las escuelas técnicas son las formadoras históricas de ese capital humano. En el sistema educativo, la figura del referente técnico escolar —quien administra las netbooks, la conectividad y el software de cada institución— se volvió estratégica con los planes de inclusión digital, y su capacitación es política pública. Mostrar esta dimensión laboral del contenido es parte de la orientación hacia el mundo del trabajo que la Escuela Secundaria debe garantizar.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca cada escuela secundaria cuenta con equipamiento que necesita administración real: las netbooks de los planes nacionales, las aulas de informática, la conectividad. Proponer que los estudiantes construyan el plan de administración y resguardo de la propia aula de informática —inventario, usuarios, permisos, cronograma de actualizaciones, protocolo de backup, registro de incidencias— convierte el contenido en un servicio concreto a la institución y en una práctica preprofesional. Además, los egresados de las escuelas técnicas bahienses y de las carreras de sistemas de UNS y UTN que se desempeñan como administradores de sistemas en empresas locales, el municipio y el polo industrial pueden ser invitados a contar su trabajo, cerrando el círculo entre aula y territorio.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.15 — Administración y utilización de procesadores de textos (consideraciones generales)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Escribimos con el procesador de textos o el procesador de textos escribe con nosotros? Si el corrector decide qué palabra es correcta, la plantilla decide qué formato es aceptable y la nube decide dónde vive el documento, ¿cuánta libertad de escritura queda en la caja de herramientas digital del estudiante?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El procesador de textos es la aplicación ofimática central para la producción de documentos escritos: permite crear, editar, dar formato (fuentes, alineación, interlineado, columnas), insertar elementos (imágenes, tablas, encabezados y pies de página), verificar ortografía y gramática, paginar e imprimir, y trabajar con funciones avanzadas como estilos, índices automáticos y combinación de correspondencia. Su historia es la de la mecanografía digitalizada: de las máquinas de escribir eléctricas y los primeros editores de línea de comando a los programas WYSIWYG de los años 1980 y a los procesadores actuales, propietarios (Microsoft Word) y libres (Writer de LibreOffice), que el Diseño Curricular ubica en los niveles de intervención principiante e intermedio (componentes básicos, creación y guardado de documentos, formatos, corrector, cortar/copiar/pegar, numeración y viñetas, configuración de impresión; luego interlineado, columnas, saltos, cuadros de texto; finalmente índices, ecuaciones y tablas avanzadas, DC, 2010, p. 26).</p>
<p>La dimensión contemporánea del contenido es la escritura colaborativa en la nube: los documentos compartidos con edición simultánea, el historial de versiones y los comentarios transformaron el procesador de textos de herramienta individual en espacio de trabajo colectivo, anticipando el Módulo 5 (colaboración digital). También es parte del contenido la cuestión de los formatos: los formatos propietarios (.docx) frente a los formatos abiertos (.odt), con implicancias directas de interoperabilidad y soberanía (¿puedo leer mi documento dentro de diez años?, ¿puedo abrirlo sin pagar licencia?). El Diseño Curricular espera que los estudiantes "seleccionen y usen aplicaciones ofimáticas en forma efectiva y productiva" (DC, 2010, p. 19), lo que incluye elegir la herramienta y el formato adecuados a cada propósito.</p>
<p>Didácticamente, el procesador de textos no debe enseñarse como lista de botones sino como género de producción real: el proyecto de escritura del trimestre (informes de investigación del Módulo 3, documentos de los proyectos colaborativos) es la excusa para enseñar cada función en el momento en que hace falta. La secuencia recomendada: producir un texto real con investigación previa, luego editarlo con formato profesional (estilos, índice, citas), luego versionarlo colaborativamente y finalmente publicarlo (PDF para difusión, formato abierto para archivo). La escritura se vuelve así producto cultural y no ejercicio escolar descartable.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino y las universidades públicas han protagonizado migraciones parciales a suites ofimáticas libres (LibreOffice) por razones presupuestarias, de interoperabilidad y de soberanía, y el programa Educ.ar produjo durante años materiales y secuencias didácticas para la enseñanza de la escritura digital en las escuelas. La escritura académica universitaria argentina se realiza íntegramente sobre procesadores de texto, y las tesis, informes y publicaciones del sistema científico son el destino natural de esta competencia. Enseñar a escribir digitalmente con criterios de formato abierto es formar para ese ecosistema académico y estatal.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca el procesador de textos es herramienta cotidiana de la administración municipal digitalizada, de las escuelas y de la vida universitaria de la UNS y la UTN. Una propuesta situada es que los estudiantes produzcan con el procesador de textos documentos reales para destinatarios reales: el informe técnico del diagnóstico de su aula de informática (Contenido 1.14), una nota formal dirigida al municipio o a la cooperadora escolar, o la documentación del proyecto del trimestre, aplicando normas de presentación, formato abierto y publicación responsable. La escritura deja de ser simulacro y se vuelve intervención en la vida institucional de la ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.16 — Administración y utilización de planillas electrónicas de cálculos (consideraciones generales)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Es una planilla de cálculo una herramienta matemática neutral o un modo específico de gobernar la información? Cuando una decisión pública o empresaria depende de una fórmula escrita en una celda, ¿quién audita esa fórmula y quién responde por sus errores?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La planilla electrónica de cálculo organiza la información en una grilla de filas y columnas cuyas celdas pueden contener datos, texto o fórmulas y funciones que calculan automáticamente sobre otras celdas, y permite ordenar y filtrar datos, construir gráficos y formatear resultados. Su potencia conceptual está en la referencia relativa y absoluta: el cálculo se escribe una vez y se propaga a miles de celdas, lo que convierte a la planilla en un lenguaje de programación visual al alcance de cualquiera. La historia va de VisiCalc (1979, la primera planilla, que sola justificó la compra de computadoras personales) a Excel y a la alternativa libre Calc de LibreOffice, y el Diseño Curricular gradúa su enseñanza: conceptos básicos, columnas y filas, formatos de celdas, fórmulas y funciones elementales (principiante); prácticas con funciones, ordenamiento, filtrado y gráficos (intermedio); funciones lógicas, operaciones con fechas, validación de entradas (avanzado) (DC, 2010, p. 27).</p>
<p>El valor formativo de la planilla excede lo operativo: es la primera herramienta de análisis de datos que la escuela puede enseñar masivamente, y anticipa el razonamiento sobre bases de datos, estadística y toma de decisiones basada en evidencia. Con una planilla se puede calcular el presupuesto de un evento escolar, analizar las notas del curso, graficar el consumo eléctrico del aula o procesar los datos de una encuesta comunitaria. El Diseño Curricular vincula expresamente la materia con los contenidos de las demás materias de 4.º año para generar transversalidad (DC, 2010, p. 24), y la planilla es el instrumento transversal por excelencia: Matemática, Geografía, Economía e Historia producen datos que la planilla vuelve procesables.</p>
<p>Didácticamente, la recomendación es partir de datos reales y cercanos: construir con los estudiantes la planilla de gastos de una salida educativa, el seguimiento de un ahorro colectivo o el registro de temperaturas del aula, y recién entonces introducir funciones sobre ese material propio. El cierre natural es el gráfico: traducir la tabla en visualización y discutir qué muestra y qué oculta cada tipo de gráfico, articulando con el Módulo 4 (imagen como mensaje). La pregunta crítica que debe quedar instalada: una planilla mal formulada puede decidir un despido, un crédito o una política pública; auditar fórmulas es también ciudadanía.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La planilla de cálculo es el instrumento invisible del Estado argentino: presupuestos públicos, padrones, estadísticas del INDEC en etapas de procesamiento, liquidaciones de haberes y controles de programas sociales pasan por grillas de cálculo antes de llegar a los sistemas formales, y buena parte de la información pública que los Estados nacional, provinciales y municipales abren en sus portales de datos abiertos se publica en formatos tabulares (CSV, XLS) pensados para ser procesados con estas herramientas. Formar estudiantes que sepan leer y auditar esas tablas es formar sujetos capaces de controlar la información pública.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca publica información municipal (datos abiertos, ejecución presupuestaria, indicadores locales) que puede descargarse en formato tabular, y el puerto, el comercio y las pymes de servicios de la ciudad operan cotidianamente con planillas de gestión. Una propuesta situada y potente: descargar datos abiertos municipales reales (por ejemplo, presupuesto o datos de salud) y procesarlos en el aula con la planilla electrónica para responder preguntas formuladas por los propios estudiantes, publicando luego los gráficos producidos. El ejercicio convierte a los alumnos en analistas de la información pública de su propia ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 1.17 — Conceptos de virus, antivirus y malware</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Los virus informáticos son "enfermedades" de las máquinas o son armas escritas por personas con nombre y apellido? Si todo malware es código creado con intención, ¿por qué hablamos de "infección" como si fuera clima? ¿Qué responsabilidades tiene el ciudadano digital que recibe, reenvía o ignora el código malicioso?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El término malware (software malicioso) engloba todo programa creado para dañar, espiar o tomar control de un sistema: virus (código que se adhiere a archivos y se propaga con intervención del usuario), gusanos (se replican solos por la red), troyanos (se disfrazan de software legítimo), ransomware (secuestra los datos mediante cifrado y exige rescate), spyware (espía la actividad), adware invasivo y herramientas de robo de credenciales. El antivirus es el software defensivo que detecta malware por firmas (patrones conocidos), heurística (comportamientos sospechosos) y análisis en la nube, y se complementa con el firewall (filtro de comunicaciones), las actualizaciones de seguridad y las buenas prácticas (no ejecutar adjuntos desconocidos, verificar enlaces, mantener respaldos). La historia del malware —de los experimentos académicos de los años 1980 a la industria criminal global del ransomware actual— muestra la profesionalización del ataque.</p>
<p>La enseñanza de este contenido es inseparable de la dimensión ética y social que el Diseño Curricular prescribe como objetivo de aprendizaje: "Utilizar de modo seguro, legal y ético la información digital" (DC, 2010, p. 16) y, entre los objetivos de enseñanza, "enseñar sobre el peligro que tiene el robo de identidades en Internet y las formas posibles de protección" y "prevenir acerca de las formas de acoso digital, tales como el ciber-acoso o el ciberbullying" (DC, 2010, p. 15). El malware no es solo un problema técnico: el phishing explota la confianza humana, el robo de identidad destruye reputaciones y patrimonios, y el secuestro de datos de un hospital o un municipio puede costar vidas y servicios. La seguridad informática es, en rigor, ciudadanía digital aplicada.</p>
<p>Didácticamente, el contenido se trabaja con análisis de casos reales (método que el propio Diseño Curricular recomienda, DC, 2010, p. 24): estudiar un correo de phishing real (anonimizado), identificar sus marcas de falsedad, discutir qué haría cada destinatario; analizar un caso de ransomware contra una institución pública y reconstruir qué falló y qué lo hubiera evitado; y producir como cierre un protocolo de seguridad del aula de informática (actualizaciones, antivirus, respaldos, contraseñas, conducta ante adjuntos y enlaces), que se integra naturalmente con el decálogo de comportamiento y ética que el Diseño Curricular exige como criterio de evaluación (DC, 2010, p. 30).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina cuenta con organismos dedicados a la ciberseguridad (el CSIRT nacional y áreas específicas de respuesta a incidentes), y los ataques a instituciones públicas argentinas —municipios, hospitales, organismos nacionales— dejaron de ser hipótesis para volverse incidentes reales que paralizaron servicios durante días. La Ley 25.326 de datos personales y los tipos penales informáticos incorporados al Código Penal completan el marco normativo. Para el estudiante, el mensaje es doble: el país necesita profesionales de ciberseguridad (una de las especialidades con mayor demanda laboral del sector del conocimiento) y necesita ciudadanos que no sean el eslabón débil de la cadena.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las instituciones bahienses —municipio, escuelas, hospitales, empresas del polo industrial y pymes— enfrentan las mismas amenazas que cualquier organización conectada, y la ciudad forma profesionales del área a través de las carreras de sistemas e ingeniería de la UNS y la UTN Regional Bahía Blanca, con grupos de estudio y profesionales locales que trabajan en seguridad informática. Una propuesta situada: invitar a un especialista local a analizar en vivo técnicas de phishing y de ingeniería social, y que los estudiantes produzcan una campaña de prevención digital para la propia escuela (afiches, folletos, publicación en el blog del curso), aplicando simultáneamente los Módulos 1, 4 y 7: seguridad, imagen como mensaje y ciudadanía digital.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 2 · TRAMO A (2.1–2.5) ===== */
TEORIA_ADI[1].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.1 — Concepto de red informática</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Una computadora aislada y diez computadoras aisladas suman diez capacidades; diez computadoras conectadas, ¿multiplican o transforman la capacidad? Si el valor de una red crece con cada nodo que se incorpora, ¿por qué hay comunidades enteras que siguen fuera de la red y quién decide eso?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Una red informática es un conjunto de dispositivos (nodos) interconectados mediante enlaces físicos o inalámbricos que siguen reglas comunes (protocolos) para compartir recursos e información. Sus componentes esenciales son: los nodos (computadoras, servidores, impresoras, celulares, sensores), los medios de transmisión (cables, ondas de radio, fibra), los dispositivos de interconexión (switches, routers, puntos de acceso) y los protocolos (las convenciones que hacen posible el entendimiento). El propósito fundacional de toda red es el compartir: recursos de hardware (una impresora), recursos de información (archivos) y recursos de comunicación (un enlace a Internet), y esa triple economía del compartir es la que convierte a la red en algo más que la suma de sus partes.</p>
<p>El concepto tiene historia: las primeras redes surgieron en los años 1960-70 (ARPANET en EE. UU., con el objetivo de compartir recursos entre centros de investigación y garantizar comunicaciones robustas), y de allí se pasó a las redes locales de oficinas, a las redes empresariales y finalmente a la interconexión global. El Diseño Curricular ubica este contenido como puerta del Módulo 2 porque sin la noción de red no hay comprensión posible de Internet, y porque espera que los estudiantes "reconozcan las distintas formas de organización de una red" y "administren una red como centro de recursos compartidos" (DC, 2010, p. 20).</p>
<p>Didácticamente, la estrategia de arranque es el mapeo de la red propia: que los estudiantes dibujen la red de su escuela tal como la imaginan, y luego la releven empíricamente (¿dónde entra el cable de Internet?, ¿qué aparato reparte la conexión?, ¿cuántas computadoras comparten la impresora?). El contraste entre el dibujo imaginado y el relevamiento real produce el aprendizaje, y deja instalada la pregunta política: una red es también una estructura de poder (quién administra, quién puede y quién no puede).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina construyó su red troncal nacional con la Red Federal de Fibra Óptica (REFEFO) impulsada por ARSAT, que interconecta las provincias y permite que los operadores locales lleguen con banda ancha a localidades que el mercado solo no alcanzaba; a eso se suma la histórica Ley 27.078 "Argentina Digital" (2014), que declaró a las TIC y a las redes de telecomunicaciones bienes y servicios de interés estratégico, y el DNU 690/2020 que reforzó el carácter de servicio público esencial del acceso a Internet. Comprender qué es una red es comprender el objeto de esas políticas: sin red no hay derecho efectivo a la conectividad.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca es un nodo de comunicaciones del sudoeste bonaerense: por la ciudad pasan trazas de fibra óptica de los grandes operadores nacionales y de la red provincial, y existe una trama local de prestadores (la cooperativa telefónica local, cooperativas de servicios de la región y pequeños ISPs) que capilarizan la conectividad hacia los barrios y localidades vecinas. En clase, ese ecosistema se vuelve material didáctico: mapear con los estudiantes por dónde entra Internet a la ciudad, quiénes la distribuyen y qué zonas quedan peor servidas transforma el concepto abstracto de "red informática" en una lectura concreta del territorio bahiense.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.2 — Tipos de información: analógica y digital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si una señal analógica se parece al mundo (es continua, infinita en matices) y una señal digital lo traduce todo a ceros y unos, ¿qué perdemos cada vez que digitalizamos algo? ¿Y por qué, a pesar de esa pérdida, el mundo entero eligió traducirse a lo discreto?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La información analógica se representa mediante señales continuas que varían suavemente en el tiempo (una voz humana, la aguja de un termómetro, un disco de vinilo, la televisión tradicional), mientras que la información digital se representa mediante valores discretos —secuencias de bits— obtenidos por muestreo y cuantificación de la señal original. La elección histórica por lo digital no se debe a que sea "más fiel" en origen, sino a ventajas decisivas para el procesamiento y la transmisión: resistencia al ruido (los ceros y unos se regeneran sin degradación), posibilidad de compresión, de corrección de errores, de cifrado y de copia perfecta ilimitada.</p>
<p>La historia de las telecomunicaciones es la historia de una digitalización progresiva: la telefonía nació analógica, se digitalizó en sus troncales desde los años 1970-80, y la televisión y la radio recorrieron el mismo camino décadas después; hoy prácticamente toda la infraestructura mundial transporta bits, aunque los extremos del circuito (voz, imagen, sonido en el aire) vuelvan a ser analógicos. Este contenido conecta directamente con el Módulo 1 (concepto de digitalización y sistema binario) y anticipa el Módulo 6 (digitalización del sonido y la imagen).</p>
<p>Didácticamente, el contraste se enseña con experiencias sensoriales: comparar un casete o una radio analógica con un archivo de audio digital (¿qué pasa si copio uno y otro cien veces? ¿qué pasa con el ruido?), graficar una señal continua y su versión muestreada en el pizarrón, y discutir qué se pierde y qué se gana. El cierre crítico es obligatorio: digitalizar permite almacenar y transmitir, pero también registrar y vigilar todo lo que antes se desvanecía.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina atravesó sus propias transiciones analógico-digital: la digitalización de las centrales telefónicas desde los años 1980, la televisión digital terrestre (norma ISDB-T adoptada en 2009, con producción estatal de decodificadores y contenidos) y la progresiva digitalización de archivos estatales y medios públicos. Cada transición redefinió accesos: la TV digital multiplicó señales gratuitas, pero exigió equipos nuevos, y volvió visible que todo cambio de formato produce incluidos y excluidos temporarios hasta que la infraestructura se universaliza.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca estas transiciones se vivieron en cadena: los bahienses pasaron de la telefonía fija analógica a la digital, de la TV abierta analógica a la TDT, y hoy consumen radio y televisión también por Internet. El relevamiento generacional funciona muy bien en el aula: entrevistar a familiares sobre cómo escuchaban radio, veían TV y llamaban por teléfono antes y ahora, y sistematizar en una tabla analógico/digital los cambios, ancla el contenido en la memoria tecnológica de las propias familias bahienses.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.3 — Arquitecturas de las redes de información: LAN, MAN, WAN, PAN</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué existen cuatro palabras distintas para decir "red"? Si la escala —personal, local, metropolitana, mundial— cambia el nombre de la red, ¿no será que la escala cambia también quién la gobierna, quién la paga y quién queda afuera?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Las arquitecturas de red se clasifican por su alcance geográfico: PAN (Personal Area Network, red de área personal, de pocos metros: el Bluetooth entre el celular y los auriculares), LAN (Local Area Network, red de área local: un aula, una oficina, una casa), MAN (Metropolitan Area Network, red de área metropolitana: abarca una ciudad, interconectando sedes u organizaciones) y WAN (Wide Area Network, red de área extensa: un país, un continente, el mundo). A mayor alcance, mayor complejidad de infraestructura, mayores costos y mayor cantidad de actores involucrados en su administración; Internet es, por definición, la WAN de las WANs.</p>
<p>Cada arquitectura tiene sus tecnologías típicas: la PAN se apoya en Bluetooth o USB; la LAN en Ethernet (cable) y Wi-Fi; la MAN en anillos de fibra metropolitana y enlaces de radio; la WAN en fibra de larga distancia, enlaces satelitales y submarinos. El Diseño Curricular espera que los estudiantes "comprendan las distintas arquitecturas de red" (DC, 2010, p. 20) y las tablas de intervención ubican el reconocimiento de tipos de redes en el nivel principiante y los elementos de una LAN en el nivel intermedio (DC, 2010, p. 28), lo que marca la progresión didáctica del contenido.</p>
<p>Didácticamente, la enseñanza funciona con la escalera de ejemplos propios: la PAN del estudiante (celular-auriculares), la LAN del aula de informática, la MAN municipal o universitaria y la WAN que los conecta con un sitio del exterior. Conviene hacerles descubrir que el mismo mensaje puede atravesar las cuatro arquitecturas en un segundo, y que cada salto de escala implica nuevos administradores, nuevos puntos de control y nuevos riesgos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> En Argentina las cuatro escalas tienen actores visibles: la PAN en los dispositivos personales; las LAN en escuelas y empresas; las MAN en redes metropolitanas de municipios y universidades (varias ciudades del país tendieron anillos de fibra institucionales); y las WAN en los grandes operadores nacionales y en la REFEFO estatal. La Red de Interconexión Universitaria (RIU), que enlaza a las universidades nacionales, es el ejemplo argentino más claro de WAN educativa con fines públicos: demuestra que las arquitecturas de red también pueden construirse con lógica de derecho y no solo de mercado.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca exhibe las cuatro arquitecturas en un solo territorio: la PAN de cada estudiante; las LAN de sus escuelas, empresas y organismos; una escala MAN encarnada en las redes del municipio, del sistema de salud y en la infraestructura de la UNS (que conecta sedes, institutos y su campus); y la WAN que llega por los troncales de fibra que atraviesan la ciudad y la vinculan con Buenos Aires y el resto del país a través de la RIU y los operadores nacionales. Proponer a los estudiantes diagramar esas cuatro capas sobre un plano de la ciudad convierte la clasificación en cartografía local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.4 — Red de datos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué la información viaja hoy "en pedacitos" (paquetes) en lugar de viajar entera por un canal dedicado, como antes? ¿Qué visión de mundo contiene una tecnología que trocea todo, lo mezcla con datos ajenos en el mismo cable y lo reordena recién en destino?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Una red de datos es una red concebida específicamente para el intercambio de información digital entre equipos, a diferencia de las redes pensadas originalmente para voz. Su rasgo técnico central es la conmutación de paquetes: el mensaje se divide en bloques (paquetes) que llevan dirección de origen y destino, viajan de forma independiente —posiblemente por caminos distintos— y se reensamblan en el destino. Este modelo, surgido en los años 1960 como alternativa a la conmutación de circuitos de la telefonía, es más robusto (la caída de un nodo no interrumpe todo), más eficiente (el canal se comparte estadísticamente) y es la base de Internet.</p>
<p>Históricamente, las redes de datos atravesaron varias generaciones tecnológicas (X.25, Frame Relay, ATM) antes de que el conjunto de protocolos TCP/IP se impusiera como estándar universal, unificando redes heterogéneas bajo un mismo lenguaje. Hoy la expresión "red de datos" designa tanto las redes corporativas internas como los servicios de transporte de datos que ofrecen los operadores (desde enlaces dedicados hasta 4G/5G), y su comprensión es requisito para el contenido siguiente (TCP-IP) y para la expectativa oficial de "analizar cómo se transmiten los datos dentro de una red informática" (DC, 2010, p. 20).</p>
<p>Didácticamente, el paquete se enseña con una simulación corporal: una carta larga se recorta en sobres numerados con origen y destino, varios "mensajeros" (estudiantes) los llevan por caminos distintos del aula, y el destinatario los reordena; si uno se pierde, se pide reenvío. La analogía instala la idea clave: en una red de datos no se reserva el camino, se comparte, y eso explica tanto la eficiencia como los problemas (paquetes perdidos, demoras) que luego se verán en tasa de transferencia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La infraestructura nacional de redes de datos creció al calor de la privatización de las telecomunicaciones de los años 1990 (de ENTEL a Telecom y Telefónica) y de la expansión posterior de los operadores de Internet, y hoy el Estado opera también su propia infraestructura de transporte de datos a través de ARSAT y de redes de investigación. La dependencia del transporte de datos explica debates estratégicos actuales: dónde se intercambia el tráfico nacional (los NAP locales), cuánto tráfico argentino sale al exterior sin necesidad, y qué pasa con la información nacional cuando viaja por redes de terceros.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca concentra redes de datos de distinta escala: las redes internas de bancos, empresas y organismos públicos locales; las redes de los operadores que prestan servicios corporativos e industriales (con exigencias críticas en el Polo Petroquímico y el puerto, donde la red de datos transporta telemetría y control); y las redes académicas de UNS y UTN. Analizar en clase los requerimientos de una red de datos industrial (¿qué pasa si se pierde un paquete de una planta?) frente a los de una red escolar (¿qué pasa si se demora un video?) muestra que no toda red de datos es igual ni cuesta lo mismo.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.5 — Red telefónica</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué la tecnología más vieja de la conectividad —el teléfono— sigue siendo para millones el único puente hacia Internet? Si la red telefónica fue durante un siglo una red de voz, ¿qué pasa con una sociedad cuando esa misma red se convierte en su puerta de entrada al conocimiento?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La red telefónica es la infraestructura histórica de telecomunicaciones: nació como red de conmutación de circuitos analógica (el par de cobre que unía físicamente dos interlocutores a través de centrales), se digitalizó progresivamente en sus troncales y evolucionó hasta las redes móviles celulares y la telefonía sobre IP. Su importancia en NTICx no es nostálgica: durante décadas la red telefónica fue el único medio por el cual los hogares accedieron a las redes de datos (módems dial-up, luego ADSL sobre el mismo par de cobre), y en muchos territorios sigue siendo la base física del acceso.</p>
<p>La evolución conceptual puede resumirse en cuatro saltos: de la conmutación de circuitos (canal dedicado durante toda la llamada) a la digitalización de centrales; de la telefonía fija a la telefonía móvil celular (celdas que reutilizan frecuencias, de 1G analógico a 5G con datos de alta velocidad); y de la voz como servicio principal a la voz como aplicación (VoIP: la llamada viaja como datos sobre Internet). Cada salto redefinió el modelo de negocio, la regulación y los hábitos sociales; el celular es hoy para muchos jóvenes el único dispositivo de acceso a Internet, lo que vuelve este contenido directamente autobiográfico.</p>
<p>Didácticamente, el contenido se trabaja con línea de tiempo generacional: reconstruir con los estudiantes la historia del teléfono en sus familias (fijo a manivela, fijo de disco, celular, smartphone, llamadas por WhatsApp) y asociar cada etapa a su tecnología (analógico/digital, circuito/paquete, cobre/radio). El cierre crítico pregunta: ¿qué diferencia hay entre llamar por la red telefónica tradicional y llamar por una app?, ¿quién cobra, quién registra, quién puede intervenir cada una?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La historia telefónica argentina es un caso de estudio político: la empresa estatal ENTEL fue privatizada en 1990 (Telecom y Telefónica), la telefonía móvil explotó en los años 2000 hasta superar largamente a la fija, el DNU 690/2020 declaró servicios públicos esenciales a la telefonía celular y al Internet, y en 2023 el Estado licitó espectro para 5G. La telefonía móvil es hoy la red más universal del país y a la vez la más concentrada en pocos operadores: enseñar red telefónica es enseñar también que la infraestructura de comunicación puede ser derecho, mercancía o ambas cosas a la vez.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tuvo una historia telefónica particular: además de la red de la operadora nacional, la ciudad cuenta con una cooperativa telefónica local que históricamente prestó el servicio de telefonía fija y luego servicios de datos, expresión del movimiento cooperativo de telecomunicaciones bonaerense que llevó el servicio a localidades donde las empresas no llegaban. En el aula, comparar la cobertura móvil y fija de los distintos barrios de la ciudad (zona céntrica, barrios periféricos, localidades rurales del partido) sobre un mapa convierte la red telefónica en un indicador concreto de igualdad territorial.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 2 · TRAMO B (2.6–2.10) ===== */
TEORIA_ADI[1].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.6 — Red satelital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Puede un país ser soberano si sus comunicaciones dependen de satélites extranjeros? Y al revés: ¿qué significa que un país periférico haya diseñado y lanzado sus propios satélites geoestacionarios? ¿La órbita geoestacionaria es un recurso técnico o un territorio en disputa?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Una red satelital utiliza satélites artificiales como estaciones repetidoras o nodos de comunicación: los satélites geoestacionarios (GEO), ubicados a unos 36.000 km sobre el ecuador, parecen fijos respecto de la Tierra y cubren con pocas unidades regiones enormes (televisión directa, telefonía rural, datos); los de órbita baja (LEO), a cientos de kilómetros, ofrecen menor latencia y requieren constelaciones de cientos o miles de unidades. El enlace satelital —subida (uplink), transponder, bajada (downlink)— tiene características propias: gran cobertura, independencia del terreno, pero latencia elevada en GEO y sensibilidad a las condiciones climáticas.</p>
<p>La red satelital es la tecnología de inclusión por excelencia para geografías extensas: llega donde la fibra y la telefonía no llegan (zonas rurales, mar, montaña, emergencia). Su contracara es la concentración tecnológica global: muy pocos países y empresas fabrican, lanzan y controlan satélites, y las posiciones orbitales y frecuencias son recursos finitos que se asignan en la Unión Internacional de Telecomunicaciones (UIT), lo que convierte al espacio en un territorio geopolítico. Este contenido dialoga con el Módulo 7: la infraestructura de comunicación es poder.</p>
<p>Didácticamente, el satélite se enseña con la analogía del espejo en el cielo y con datos concretos: ¿a qué altura está un GEO? ¿cuánto tarda la señal en subir y bajar (por qué hay delay en la TV satelital)? ¿qué cubre la huella de un satélite argentino? La actividad recomendada es comparar tres escenarios de conectividad (ciudad con fibra, pueblo rural con satélite, barco) y discutir cuál tecnología corresponde a cada uno y por qué, anticipando la idea de que no hay tecnología universal sino adecuada a cada territorio.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina es uno de los pocos países del mundo con capacidad satelital propia: ARSAT-1 (2014) y ARSAT-2 (2015), diseñados y fabricados por INVAP en Bariloche y lanzados al espacio, ocupan posiciones orbitales geoestacionarias que el país defendió ante la UIT; el Plan Nacional Espacial prevé nuevas generaciones de satélites, y la flota ARSAT distribuye televisión directa al hogar, conecta escuelas rurales y brinda datos en zonas sin fibra. Esta política de Estado —continuada por distintas gestiones con altibajos— es el ejemplo argentino más potente de soberanía tecnológica aplicada a las comunicaciones, y su enseñanza en la escuela secundaria está directamente prevista en el espíritu del Diseño Curricular.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Para Bahía Blanca y su región, el satélite tiene doble relevancia: las zonas rurales del partido y del sudoeste bonaerense (parajes, escuelas rurales, puestos productivos) acceden a conectividad educativa y comunitaria a través de soluciones satelitales impulsadas por programas nacionales, y la señal de TV satelital que llega a los hogares de la región viaja por la flota argentina. En clase, proponer el diseño de un plan de conectividad para una escuela rural ficticia del partido de Bahía Blanca —evaluando si conviene fibra, radio o satélite según distancia y costo— aplica el contenido a la geografía real del distrito.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.7 — Organización de las redes: Intranet, Extranet e Internet</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Tres redes con la misma tecnología pueden ser tres mundos distintos? Si una Intranet es "para nosotros", una Extranet es "para nosotros y algunos otros" e Internet es "para cualquiera", lo que las diferencia no es el cable sino la confianza: ¿y quién decide en quién confía una organización?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La clasificación organiza las redes según sus fronteras de acceso: la Intranet es una red privada basada en tecnología Internet (navegadores, páginas web internas, correo interno) limitada a los miembros de una organización; la Extranet extiende parte de esa red a usuarios externos autorizados (proveedores, clientes, otras instituciones) con acceso controlado; e Internet es la red pública global de redes interconectadas, sin dueño único. Las tres usan la misma familia de protocolos: lo que cambia es quién puede entrar, qué puede ver y quién administra.</p>
<p>La frontera entre las tres no es física sino política y técnica (autenticación, permisos, firewalls), y esa es la enseñanza conceptual central: la seguridad informática no es un adorno sino el mecanismo que define la identidad de una red. El Diseño Curricular ubica la interacción con Internet, Intranet y Extranet en el nivel avanzado de sus tablas de intervención (DC, 2010, p. 28), lo que indica que se espera una comprensión operativa y no solo declarativa: el estudiante debe poder reconocer ante qué tipo de red está en cada situación real.</p>
<p>Didácticamente, el contenido se trabaja con tres casos paralelos: la Intranet de la escuela o del municipio (¿qué se publica adentro y no afuera?), la Extranet de una empresa local con sus proveedores (¿qué ve el proveedor y qué no?), e Internet (¿qué puede ver cualquiera?). Cada equipo analiza un caso, identifica usuarios, permisos y riesgos, y expone. El cierre pregunta: ¿dónde están los datos de los estudiantes cuando usan el sistema escolar: en una Intranet, en una Extranet o en Internet?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino opera en las tres dimensiones: Intranets estatales (sistemas internos de organismos, historias clínicas hospitalarias, expedientes), Extranets interorganizacionales (intercambio entre organismos públicos, con bancos, con proveedores) e Internet (portales públicos, trámites en línea). La tensión permanente es de seguridad y soberanía: cada vez que un sistema estatal se apoya en nubes o servicios extranjeros, parte de esa Intranet/Extranet queda físicamente fuera del país. El debate sobre nube estatal y datos soberanos es la versión contemporánea de este contenido escolar.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca ofrece ejemplos inmediatos de las tres categorías: los sistemas internos del municipio y del Hospital Municipal funcionan con lógica Intranet/Extranet; las empresas del Polo Petroquímico operan Intranets industriales y Extranets con contratistas y clientes logísticos; y la UNS mantiene redes internas de gestión académica e investigación junto a su presencia pública en Internet. Proponer a los estudiantes clasificar sistemas reales de la ciudad en las tres categorías —y detectar casos límite (¿una plataforma educativa con login es Intranet o Internet?)— entrena el criterio técnico-político que el módulo exige.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.8 — Protocolo de red TCP-IP: principios de comunicación entre computadoras</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si dos computadoras fabricadas en países distintos, con sistemas distintos y conectadas por cables distintos pueden entenderse perfectamente, ¿quién escribió el idioma común que hablan? ¿Y qué pasa con una sociedad entera cuando ese idioma lo escribieron otros y puede cambiarse sin consultarnos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Un protocolo es un conjunto de reglas que permite la comunicación entre sistemas, y TCP/IP es la familia de protocolos que gobierna Internet. Sus principios son: el direccionamiento IP (cada dispositivo conectado posee una dirección numérica única que identifica origen y destino), la conmutación de paquetes (los datos viajan fragmentados y se reensamblan en destino), la arquitectura en capas (cada capa resuelve un problema —físico, de enlace, de red, de transporte, de aplicación— y se apoya en la inferior), y la confiabilidad por software (TCP verifica la llegada de los paquetes, reordena y retransmite lo perdido). La combinación de IP (entregar) y TCP (asegurar) es el corazón del modelo.</p>
<p>Históricamente, TCP/IP fue desarrollado en los años 1970 (Cerf y Kahn) para ARPANET y se impuso en 1983 como protocolo único, permitiendo que redes heterogéneas se federaran en "la red de redes"; su diseño abierto y descentralizado —cualquiera puede interconectarse cumpliendo las reglas— es la razón técnica de la expansión de Internet. La evolución actual incluye el agotamiento de las direcciones IPv4 y la migración progresiva a IPv6 (direcciones prácticamente ilimitadas), contenido implícito en la comprensión del direccionamiento. El Diseño Curricular espera que los estudiantes "analicen cómo se transmiten los datos dentro de una red informática" (DC, 2010, p. 20), objetivo que requiere llegar hasta este nivel de principios.</p>
<p>Didácticamente, TCP/IP se enseña con la analogía postal completa: dirección IP = dirección de casa; paquete = sobre con numeración; router = oficina de correos que decide el camino; TCP = remitente que confirma recepción y reenvía lo perdido. Luego se pasa a la práctica: observar en una computadora la configuración de red (dirección IP, máscara, puerta de enlace) y ejecutar comandos simples de diagnóstico (ping, trazado) si el equipamiento lo permite, o simulaciones en línea si no. El cierre conceptual: los protocolos son acuerdos, y los acuerdos los escriben personas.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La gobernanza de los protocolos tiene capítulo argentino: los recursos de numeración IP de la región los administra LACNIC (registro regional latinoamericano con participación argentina), y el dominio de país .ar es administrado históricamente por NIC Argentina, organismo que gestiona el registro de dominios nacionales como parte de la infraestructura crítica de Internet argentina. Enseñar TCP/IP junto con estos datos muestra que Internet no es una nube sin gobierno: tiene reglas, administradores y disputas, y Argentina participa institucionalmente de esa gobernanza.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En el aula bahiense el protocolo se vuelve visible con datos locales: observar las direcciones IP de las computadoras del aula, identificar el router que las conecta, y discutir cómo llega un paquete desde Bahía Blanca hasta un servidor (¿por dónde sale el tráfico local? ¿pasa por Buenos Aires?). Invitar a un técnico de un ISP local o de la red de la UNS a explicar cómo se enruta el tráfico de la ciudad convierte el protocolo en infraestructura tangible y, de paso, muestra una salida laboral concreta en redes.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.9 — Topologías de redes</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿La forma de una red es neutral? Una red en estrella tiene un centro que manda; una red en malla no tiene centro. ¿Por qué las dictaduras prefieren redes con centro y las comunidades resilientes sueñan con redes en malla? ¿Qué topología tiene la red de tu escuela y qué dice eso de quién manda en ella?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La topología describe la disposición lógica y física de los nodos y enlaces de una red. Las topologías clásicas son: bus (todos los nodos sobre un único cable común), estrella (todos los nodos conectados a un concentrador central, la dominante en las LAN actuales), anillo (cada nodo se conecta al siguiente, formando un circuito cerrado), malla (cada nodo se conecta con varios o todos los demás, máxima redundancia) y árbol (jerarquía de estrellas concatenadas, típica de redes grandes). Se distingue además la topología física (cómo están cableados) de la lógica (cómo circula la información).</p>
<p>Cada topología implica ventajas y desventajas que son el contenido central: el bus es económico pero frágil (si el cable común falla, cae todo); la estrella es fácil de administrar pero dependiente del centro (si el switch central falla, cae la red); el anillo ordena el acceso pero se interrumpe ante cortes (salvo doble anillo); la malla es la más robusta y cara (Internet, en su núcleo, se le parece). Comprender esto permite leer decisiones de diseño: por qué una escuela usa estrella, por qué un hospital o una planta industrial usan anillos redundantes, por qué una red militar o bancaria busca topologías sin punto único de falla.</p>
<p>Didácticamente, las topologías se enseñan con el cuerpo y con hilos: los estudiantes se disponen físicamente en cada topología y transmiten mensajes (¿qué pasa si "cae" un compañero?), o dibujan las topologías y simulan fallos. Luego se conecta con la realidad: diagramar la topología del aula de informática y discutir qué pasa si falla el switch. El Diseño Curricular espera que los estudiantes "reconozcan las distintas formas de organización de una red" (DC, 2010, p. 20), y nada fija mejor esa competencia que haber vivido corporalmente cada forma.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La topología de la infraestructura nacional de comunicaciones tiene una discusión estratégica conocida: durante décadas el tráfico entre muchas ciudades argentinas pasaba obligadamente por Buenos Aires (topología radial heredada), y las políticas de anillos federales de fibra (REFEFO, redes provinciales) buscan federalizar también la forma física de la red. Lo mismo ocurre con los puntos de intercambio de tráfico (NAP): cuanto más distribuidos están, más robusta y soberana es la red. La topología, entonces, no es solo un tema técnico: es un mapa del federalismo pendiente de las comunicaciones argentinas.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca permite leer topologías reales: las escuelas locales organizan sus redes en estrella (con el router como centro, lo que explica sus caídas típicas); el Polo Petroquímico emplea arquitecturas con redundancia (anillos de fibra industrial) porque una interrupción de comunicaciones en una planta continua tiene costos críticos; y la posición de la ciudad en el mapa nacional de fibra la convierte en nodo del sudoeste. Proponer a los estudiantes rediseñar la topología de la red escolar para hacerla más robusta (¿dónde agregar un segundo enlace?, ¿qué pasaría si...?) los coloca en el rol de analistas de redes que el Diseño Curricular espera.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.10 — Formas de conexión</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Da lo mismo llegar a Internet por un cable de cobre de hace cincuenta años, por una fibra nueva o por una antena prestada? Si la forma de conexión define la velocidad, el precio y hasta la privacidad de lo que hacemos, ¿elegimos realmente cómo nos conectamos o nos conectan como se puede?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Las formas de conexión se clasifican por el medio físico y la tecnología de acceso: guiadas (par de cobre telefónico —dial-up y ADSL—, cable coaxial de la televisión por cable, fibra óptica hasta el hogar o FTTH) y no guiadas (Wi-Fi dentro de la red local, telefonía móvil 3G/4G/5G, enlaces de radio punto a punto, satélite). Cada medio tiene compromisos distintos entre velocidad, distancia, costo, estabilidad y capacidad de despliegue: la fibra ofrece el mayor rendimiento, el cobre aprovecha infraestructura existente, el radio y el satélite llegan donde el cable no llega.</p>
<p>Históricamente, el acceso evolucionó del módem dial-up (56 kbps, línea telefónica ocupada) al ADSL (banda ancha sobre cobre), al cablemódem, a la fibra óptica y a las redes móviles de datos, en una secuencia que multiplicó la velocidad millones de veces en tres décadas. El Diseño Curricular ubica en sus tablas la comprensión de "las funciones de los componentes necesarios para una conexión a Internet" (nivel principiante) y "los elementos necesarios para el funcionamiento de una red LAN" y las "pautas para la contratación de un servicio de conexión" (niveles intermedio y avanzado, DC, 2010, p. 28): es decir, se espera que el estudiante no solo se conecte, sino que entienda y sepa contratar críticamente su conexión.</p>
<p>Didácticamente, el contenido se trabaja con un cuadro comparativo de accesos reales: los estudiantes relevan cómo llega Internet a sus casas (tecnología, velocidad contratada, precio, quien la presta) y construyen una tabla del curso; luego analizan el mapa resultante: ¿qué tecnologías predominan?, ¿hay barrios enteros con cobre viejo mientras otros tienen fibra?, ¿qué zonas solo acceden por datos móviles? La comparación instala la dimensión social del contenido: la forma de conexión es un indicador de desigualdad.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El mapa de accesos argentino es heterogéneo y está regulado: ENACOM publica periódicamente la composición tecnológica del acceso (fibra en crecimiento sostenido, ADSL en retroceso, móvil como acceso principal de millones de personas), y el DNU 690/2020 —que declaró servicios públicos esenciales a Internet, la telefonía y la TV paga— buscó garantizar precios y acceso mínimos en un mercado concentrado. Las cooperativas de servicios públicos tienen un papel histórico: en miles de localidades del interior bonaerense son ellas las que tienden la fibra que las grandes empresas no tienden.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca conviven todas las formas de conexión: cobre heredado en zonas céntricas antiguas, cablemódem, despliegues crecientes de fibra óptica por parte de operadores y cooperativas de la región, Wi-Fi en hogares y espacios públicos, y datos móviles como único acceso de muchos estudiantes. El relevamiento domiciliario del curso produce el mapa real de la conectividad bahiense: qué barrio tiene fibra, cuál depende del cobre, cuál del celular. Ese mapa es la materia prima para discutir con fundamento la brecha digital local que el Módulo 7 retomará.</div>
</div>`;
