<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.1 — Concepto de multimedia</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si todo contenido digital —texto, imagen, sonido, video— se reduce en última instancia a la misma secuencia de ceros y unos, ¿qué tiene de "multi" la multimedia? ¿Es una integración real de lenguajes o una ilusión de integración donde todo termina homogeneizado por el formato binario?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El concepto de multimedia designa la integración simultánea y coordinada de múltiples medios y formatos de información (texto, imagen fija, imagen en movimiento, sonido, animación) en un único soporte digital, con el propósito de comunicar de manera más rica y eficaz que cualquier medio aislado. El término, acuñado en los años 1960 y popularizado en los 1990 con la llegada de las computadoras personales capaces de manejar audio y video, implica una convergencia tecnológica que el propio Diseño Curricular identifica como una de las tres constantes de la era digital (conectividad, interactividad, hipermedialidad, DC, 2010, p. 10). La multimedia no es la mera suma de medios, sino su orquestación: cada formato aporta lo que mejor comunica, y el sentido emerge de la combinación.</p>
<p>Es fundamental distinguir tres conceptos que suelen confundirse: multimedia (integración de varios medios en un soporte digital), hipermedia (multimedia organizada de forma no lineal mediante enlaces que permiten múltiples recorridos, anticipada en el Módulo 3) e interactividad (capacidad del usuario de intervenir sobre el flujo de la información). Un video proyectado en clase es multimedia pero no interactivo; un sitio web con enlaces es hipermedia; un videojuego es multimedia, hipermedia e interactivo simultáneamente. El Diseño Curricular espera que los estudiantes "conozcan la clasificación y cualidades de la multimedia" (DC, 2010, p. 23), lo que exige esta precisión conceptual.</p>
<p>Didácticamente, el contenido se enseña con la deconstrucción de productos multimedia cotidianos: los estudiantes analizan una página web, un videojuego educativo o una presentación multimedia, identificando qué formatos la componen, cómo se coordinan y qué papel cumple cada uno. El ejercicio revela que la multimedia eficaz no es la que acumula más formatos, sino la que los usa con criterio: cada elemento debe justificar su presencia. El cierre productivo conecta con el objetivo integrador del módulo: los estudiantes planifican un producto multimedia propio donde la elección de cada formato esté fundamentada en la intención comunicativa.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una tradición multimedia consolidada: la industria nacional del videojuego (reconocida regionalmente), la producción audiovisual digital, el e-learning corporativo y educativo, y los portales de noticias multimedia son sectores donde el país genera valor y empleo. La multimedia es también una herramienta de inclusión: los materiales educativos accesibles (con texto, audio y lengua de señas simultáneos) permiten que personas con distintas discapacidades accedan al mismo contenido. Enseñar multimedia es formar tanto consumidores críticos como productores de esta industria del conocimiento.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca cuenta con productoras audiovisuales, desarrolladoras de software y medios locales que trabajan con productos multimedia. Proponer a los estudiantes analizar un producto multimedia local (el portal de noticias de un medio bahiense, un video institucional del municipio, una app desarrollada en la ciudad) identificando sus componentes y evaluando su eficacia comunicativa, conecta el concepto abstracto con la producción real del territorio. El ejercicio puede completarse invitando a un productor multimedia local a explicar su proceso de trabajo.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.2 — Nuevos lenguajes y formas de comunicar la información</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si cada época tuvo su lenguaje dominante —la oralidad, la escritura, la imprenta, el audiovisual—, ¿cuál es la gramática del lenguaje digital que estamos aprendiendo a hablar? ¿Y quién está escribiendo sus reglas: nosotros, los usuarios, o las plataformas que diseñan las interfaces que usamos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los nuevos lenguajes digitales no son simples traducciones de los lenguajes anteriores al formato digital, sino formas expresivas con gramática propia: la escritura digital incorpora hipervínculos, emojis y estructura visual; el audiovisual incorpora interactividad, no-linealidad y participación del espectador; el lenguaje de las redes sociales tiene sus códigos de inmediatez, brevedad y viralidad. La convergencia digital produce además fenómenos nuevos como las narrativas transmedia (una historia que se despliega coordinadamente en múltiples plataformas, cada una aportando una parte del relato), los memes (unidades culturales que se replican y mutan) y los formatos efímeros (stories, videos breves).</p>
<p>El Diseño Curricular incluye este contenido como segundo punto del Módulo 6 (DC, 2010, p. 22), y su enseñanza conecta con la Alfabetización en Medios del Módulo 5 y con la producción del Módulo 7. Los estudiantes deben comprender que cada lenguaje nuevo no reemplaza a los anteriores sino que los reorganiza: la escritura convive con la imagen, la imagen con el sonido, y todos con la interactividad. La pregunta central es crítica: ¿quién domina la gramática de estos lenguajes tiene poder comunicativo, y quién la desconoce queda en posición de receptor pasivo?</p>
<p>Didácticamente, el contenido se trabaja con el análisis comparativo de lenguajes: una misma información (por ejemplo, un evento escolar o una noticia local) comunicada en formato de texto escrito, de imagen, de audio y de multimedia interactiva. Los estudiantes comparan qué comunica cada formato, qué pierde y qué gana, y discuten cuál es el más adecuado para cada audiencia y propósito. El cierre productivo: los estudiantes eligen una información y la comunican deliberadamente en tres lenguajes distintos, experimentando las decisiones que cada uno exige.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una producción destacada en varios de estos nuevos lenguajes: las narrativas transmedia se estudian y producen en las universidades nacionales (la UNS tiene equipos de investigación en comunicación digital), el meme político argentino es un fenómeno de estudio internacional, y el podcast en español tiene una participación argentina de las más altas de la región. Enseñar estos lenguajes con conciencia crítica es formar ciudadanos capaces de producir sentido y no solo consumirlo, en un país donde la batalla cultural se libra crecientemente en estos formatos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los medios y productores bahienses están transitando estos nuevos lenguajes: los diarios locales que incorporan video y redes sociales, las radios que hacen podcast, los creadores de contenido locales que producen para plataformas globales. Proponer a los estudiantes relevar cómo los medios bahienses están adoptando estos nuevos lenguajes (¿tienen podcast? ¿hacen transmedia? ¿cómo usan las redes?) y producir ellos mismos un contenido en uno de estos formatos sobre un tema local, conecta la teoría con la práctica comunicativa del territorio.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.3 — La información y sus formatos: textual, verbal, sonora y visual</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué elegimos contar algo con palabras y no con imágenes, con sonido y no con texto? ¿El formato es un envase neutral que no afecta el contenido, o cada formato transforma irremediablemente lo que comunica?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La información puede representarse en cuatro formatos fundamentales que el Diseño Curricular enumera explícitamente (DC, 2010, p. 22): textual (palabras escritas, lineales, abstractas, exigen alfabetización lectora y permiten la argumentación compleja), verbal (palabras habladas, con prosodia, tono y emoción, permiten la cercanía y la oralidad), sonora (música, sonidos ambiente, silencios, comunican emoción y atmósfera sin pasar por el lenguaje verbal) y visual (imágenes fijas o en movimiento, simultáneas, icónicas, de alto impacto inmediato). Cada formato tiene fortalezas y límites comunicativos específicos, y la competencia multimedia consiste en saber elegir el formato adecuado para cada mensaje, audiencia y contexto.</p>
<p>La elección de formato no es una decisión técnica neutra sino comunicativa y política: un texto permite la precisión y la cita verificable; una imagen permite el impacto y la identificación emocional; un sonido permite la compañía y la atmósfera; un video permite la demostración y la narrativa. El estudiante multimedia debe dominar los cuatro formatos no como habilidades aisladas sino como un repertorio de decisiones: saber cuándo una información compleja necesita texto, cuándo un mensaje de sensibilización necesita imagen, cuándo una instrucción necesita audio. El Diseño Curricular espera que los estudiantes "comprendan la representación de la información en sus distintas formas" (DC, 2010, p. 23).</p>
<p>Didácticamente, el contenido se trabaja con el ejercicio de la traducción de formatos: los estudiantes reciben una información en un formato (por ejemplo, un texto) y deben transformarla en los otros tres (un audio, una imagen, un video), reflexionando en cada paso qué se gana, qué se pierde y qué decisiones se tomaron. Este ejercicio, que parece simple, revela la complejidad de cada lenguaje y la no-neutralidad de los formatos. El cierre conecta con el proyecto multimedia: los estudiantes justifican qué formato usarán para cada parte de su producto y por qué.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La accesibilidad es la dimensión social más importante de este contenido: las personas con discapacidad visual necesitan formatos sonoros y textuales (con lectores de pantalla), las personas con discapacidad auditiva necesitan formatos visuales y textuales (con subtítulos y lengua de señas). La Ley 26.653 de Accesibilidad Web y la Convención sobre los Derechos de las Personas con Discapacidad obligan a que la información pública esté disponible en formatos accesibles. Enseñar formatos con conciencia de accesibilidad es formar productores de información inclusivos, no solo eficaces.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene experiencias concretas en múltiples formatos: las radios locales (LU2, radios comunitarias) trabajan el formato verbal y sonoro, los medios gráficos el textual y visual, y las productoras locales el audiovisual. Proponer a los estudiantes producir una misma información local (por ejemplo, una campaña de concientización sobre un tema barrial) en los cuatro formatos, asegurando que cada versión sea accesible (subtítulos en el video, texto alternativo en las imágenes), convierte el contenido en una práctica de comunicación inclusiva para la comunidad bahiense.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.4 — Acceso a la información multimedia: hipermedia en la multimedia e interactividad</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la hipermedia nos ofrece múltiples caminos de navegación, ¿somos realmente libres de elegir nuestro recorrido o estamos siguiendo los caminos que el diseñador decidió que podíamos tomar? ¿La interactividad es emancipación o es una forma más sofisticada de control?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El acceso a la información multimedia está mediado por dos características que definen la experiencia del usuario: la hipermedia (la organización no lineal del contenido mediante enlaces que permiten múltiples recorridos, frente a la linealidad del texto impreso o del video tradicional) y la interactividad (la capacidad del usuario de intervenir sobre el flujo, el contenido o la forma de la información). La hipermedia transforma al lector en navegante: ya no hay un único orden de lectura sino una red de posibles recorridos, y esa libertad aparente es siempre una libertad acotada por la arquitectura que el diseñador construyó.</p>
<p>La interactividad tiene grados: desde la interactividad de selección (elegir entre opciones predefinidas, como un menú), pasando por la interactividad de conversación (el sistema responde a las acciones del usuario, como un videojuego), hasta la interactividad de construcción (el usuario produce contenido que modifica el sistema, como una wiki). Cada grado exige más del usuario y más del diseño. El Diseño Curricular ubica este contenido como parte del acceso a la información multimedia (DC, 2010, p. 22) y en sus tablas de intervención prescribe "Realizar prácticas que permitan organizar la información mediante el uso de la hipermedia" (nivel intermedio) y "Construir un producto multimedia... con sonidos, textos, videos, imágenes y animaciones" (nivel avanzado, DC, 2010, p. 29).</p>
<p>Didácticamente, el contenido se trabaja con el análisis de arquitecturas de navegación: los estudiantes eligen tres productos hipermedia (un sitio web, un videojuego educativo, una enciclopedia digital) y dibujan sus grafos de navegación (los nodos y los enlaces posibles). El ejercicio revela que la libertad del usuario está siempre estructurada: ¿cuántos caminos hay?, ¿hay caminos sin salida?, ¿quién decide el recorrido por defecto? El cierre productivo: los estudiantes diseñan el grafo de navegación de su propio producto multimedia antes de construirlo, tomando conciencia de que diseñar hipermedia es diseñar las libertades del otro.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene profesionales destacados en diseño de interacción, usabilidad y arquitectura de la información, y las universidades nacionales ofrecen formación específica en estas áreas. El debate sobre la interactividad tiene también una dimensión política: las plataformas que diseñan la interactividad de millones de usuarios (redes sociales, portales de trámites) toman decisiones que afectan el acceso a derechos. La usabilidad y la accesibilidad de los portales estatales argentinos es un tema de auditoría ciudadana permanente, y enseñar a analizar y diseñar hipermedia es formar tanto usuarios críticos como diseñadores responsables.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los portales y aplicaciones que los bahienses usan diariamente (el portal municipal de trámites, las apps de servicios, los sitios de los medios locales) son productos hipermedia que pueden analizarse críticamente. Proponer a los estudiantes auditar la hipermedia del portal municipal (¿cuántos clics requiere un trámite?, ¿hay caminos sin salida?, ¿la navegación es intuitiva?) y proponer mejoras concretas de arquitectura de información, convierte el contenido en una práctica de diseño centrado en el usuario aplicada a la infraestructura digital de la ciudad.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 6 · TRAMO B (6.5–6.8) ===== */
TEORIA_ADI[5].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.5 — La digitalización del sonido</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando una onda sonora continua, infinita en matices, se convierte en una secuencia finita de números, ¿qué se pierde en esa traducción? ¿El alma de la música, la calidez de una voz, caben realmente en un muestreo digital, o cada digitalización es una pequeña pérdida irreparable?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La digitalización del sonido es el proceso mediante el cual una señal sonora analógica (una onda continua de presión en el aire) se convierte en una secuencia de números binarios que una computadora puede almacenar, procesar y reproducir. El proceso tiene tres etapas técnicas fundamentales: el muestreo (sampling), que consiste en medir la amplitud de la onda a intervalos regulares de tiempo; la cuantificación, que asigna a cada muestra un valor numérico de una escala finita; y la codificación, que expresa esos valores en binario. La calidad de la digitalización depende de dos parámetros: la frecuencia de muestreo (cuántas mediciones por segundo, medida en Hz) y la profundidad de bits (cuántos valores posibles por muestra, que determina la resolución).</p>
<p>El teorema de Nyquist-Shannon establece que para reconstruir fielmente una señal hay que muestrearla al menos al doble de su frecuencia máxima: como el oído humano percibe hasta unos 20 kHz, el estándar de audio digital (el CD) usa 44,1 kHz. La digitalización del sonido tiene ventajas decisivas sobre el analógico: resistencia al ruido, copia sin pérdida, compresión, edición no destructiva y distribución instantánea. Pero también tiene costos: la pérdida de información en el muestreo (aunque sea imperceptible) y la dependencia de dispositivos para la reproducción. El Diseño Curricular incluye este contenido como parte del Módulo 6 (DC, 2010, p. 22) y su comprensión es requisito para el trabajo con audio digital que los estudiantes realizarán en sus producciones multimedia.</p>
<p>Didácticamente, el contenido se trabaja con la experimentación directa: los estudiantes graban un sonido con el micrófono de una computadora o celular, observan la forma de onda en un editor de audio gratuito (como Audacity), la muestrean a distintas frecuencias y comparan la calidad resultante. El ejercicio de escuchar la misma grabación a 8 kHz, 22 kHz y 44,1 kHz revela auditivamente el concepto de muestreo. El cierre conecta con la reflexión crítica: ¿qué sonidos de nuestra vida ya solo existen en formato digital?, ¿qué pasaría si perdiéramos todos nuestros archivos de audio?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una industria musical rica y una tradición de estudios de grabación que adoptaron tempranamente la tecnología digital. El software libre de audio (Audacity, Ardour, LMMS) ha democratizado la producción musical, permitiendo que artistas independientes produzcan con calidad profesional sin costos de licencias. El debate sobre la preservación del patrimonio sonoro argentino (grabaciones históricas, archivos de radio, música tradicional) incluye la digitalización como estrategia de conservación, pero también la pregunta sobre quién guarda esos archivos y en qué formatos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene una rica tradición musical y radial: las radios locales conservan archivos sonoros históricos, y la ciudad ha producido músicos de diversos géneros. Proponer a los estudiantes un proyecto de rescate sonoro local: entrevistar a un músico, un locutor o un vecino histórico de Bahía Blanca, grabar la entrevista con calidad digital, editarla y archivarla con metadatos, convierte la técnica de la digitalización en un acto de preservación del patrimonio sonoro bahiense. El archivo resultante puede donarse a la biblioteca escolar o a una institución cultural local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.6 — Los formatos de sonido</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si un MP3 pesa diez veces menos que un WAV y "suena igual", ¿qué nos está ocultando la compresión? ¿Qué sonidos decidió el algoritmo que no necesitábamos escuchar, y por qué aceptamos esa pérdida sin cuestionarla?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los formatos de sonido definen cómo se codifica, almacena y reproduce el audio digital, y se clasifican fundamentalmente en dos familias: sin compresión o sin pérdida (WAV, AIFF, FLAC: conservan toda la información original, archivos grandes, máxima calidad) y con compresión con pérdida (MP3, AAC, OGG Vorbis: eliminan la información que el oído humano percibe menos, archivos mucho más pequeños, calidad reducida aunque aceptable). La elección de formato implica un compromiso entre calidad, peso y compatibilidad: un estudio de grabación trabaja en WAV sin compresión, una plataforma de streaming usa AAC o MP3 comprimido, y una producción que necesita la máxima calidad con archivo razonable puede usar FLAC.</p>
<p>Los parámetros que definen la calidad de un archivo de sonido son la frecuencia de muestreo (Hz), la profundidad de bits y el bitrate (kilobits por segundo, que en los formatos comprimidos determina cuánta información se conserva). El Diseño Curricular incluye los formatos de sonido como contenido del Módulo 6 (DC, 2010, p. 22) y en sus tablas de intervención prescribe "Trabajar con los principales formatos de imagen, sonido y video" (nivel principiante, DC, 2010, p. 29). Los estudiantes deben saber identificar el formato de un archivo de audio, comprender sus características y elegir el formato adecuado para cada uso: no es lo mismo el formato para archivar una grabación que para subirla a una web.</p>
<p>Didácticamente, el contenido se trabaja con la comparación empírica de formatos: los estudiantes convierten la misma grabación de audio a distintos formatos (WAV, MP3 a distintos bitrates, OGG) y comparan el peso de cada archivo y su calidad percibida mediante una escucha atenta. El ejercicio revela que la compresión con pérdida tiene consecuencias audibles en ciertas condiciones, y que la elección de formato es una decisión técnica con consecuencias prácticas. El cierre es la aplicación: los estudiantes deben justificar el formato de audio que usarán en su producto multimedia según el destino del producto (web, presentación local, archivo).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El formato MP3 revolucionó la industria musical mundial y también la argentina: la digitalización y compresión del audio permitió la distribución independiente de música sin depender de las discográficas, y el podcast argentino (uno de los más activos de la región) existe gracias a los formatos comprimidos que hacen viable la distribución. El debate sobre los formatos abiertos (OGG, FLAC) frente a los propietarios (AAC) tiene implicancias de soberanía tecnológica y de preservación a largo plazo. Enseñar formatos de sonido con conciencia crítica es formar productores que eligen con conocimiento de causa.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las radios locales de Bahía Blanca están transitando la digitalización y muchas producen podcast: analizar qué formatos usan para emitir, para archivar y para distribuir sus contenidos es un ejercicio concreto y relevante. Proponer a los estudiantes producir un podcast breve sobre un tema bahiense (un barrio, un personaje local, una problemática de la ciudad), eligiendo conscientemente el formato de grabación, de edición y de publicación, y publicarlo en el blog del curso, aplica el contenido completo en una producción real de comunicación local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.7 — Tratamiento digital de la imagen</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si una imagen digital es solo una matriz de números que representan colores, ¿qué significa realmente "retocar" una fotografía? ¿Dónde termina la corrección legítima (ajustar la luz que la cámara no captó bien) y empieza la fabricación de una realidad que nunca existió?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El tratamiento digital de la imagen es el conjunto de operaciones que se realizan sobre una imagen digital para modificarla, mejorarla o transformarla. Una imagen digital es una matriz de píxeles (picture elements), cada uno con un valor de color definido por la combinación de canales (típicamente RGB: rojo, verde, azul) y una profundidad de color (cuántos valores posibles por canal). Las operaciones básicas de tratamiento incluyen: ajuste de brillo y contraste (modificación de la luminosidad global), ajuste de saturación (intensidad de los colores), recorte y reencuadre, corrección de color, retoque (eliminación de elementos no deseados) y composición por capas (superposición de múltiples imágenes).</p>
<p>El tratamiento digital de imagen tiene una dimensión técnica y una dimensión ética que deben enseñarse juntas. Técnicamente, los estudiantes deben dominar las operaciones básicas con herramientas accesibles (editores gratuitos como GIMP, o herramientas en línea). Éticamente, deben comprender que toda modificación de una imagen es una decisión con consecuencias: el retoque periodístico tiene límites estrictos (no se pueden alterar los hechos que la foto documenta), el retoque publicitario tiene consecuencias sociales (los estándares de belleza irreales que produce) y la manipulación de imágenes personales tiene consecuencias legales y emocionales. El Diseño Curricular incluye este contenido en el Módulo 6 (DC, 2010, p. 22) y lo conecta con el Módulo 4 (valoración ética de la imagen).</p>
<p>Didácticamente, el contenido se trabaja con la práctica guiada de edición: los estudiantes capturan sus propias fotografías (con celulares o cámaras disponibles), las transfieren a la computadora y aplican operaciones sucesivas de tratamiento (ajuste de luz, recorte, corrección de color), documentando cada decisión y comparando el antes y el después. El cierre es el debate ético: presentar ejemplos de retoque periodístico excesivo, de retoque publicitario de cuerpos y de manipulación de imágenes personales, y discutir colectivamente dónde están los límites en cada caso. La edición es una herramienta poderosa, y como toda herramienta poderosa, exige responsabilidad.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una tradición fotográfica destacada y un debate activo sobre la ética de la edición: el fotoperiodismo argentino tiene códigos estrictos sobre qué modificaciones son aceptables, y la publicidad argentina ha sido cuestionada por el retoque excesivo de cuerpos. La Ley 26.485 de Protección Integral de las Mujeres incluye la violencia simbólica en los medios, que abarca la difusión de imágenes estereotipadas o degradantes. Enseñar tratamiento de imagen con conciencia ética es formar tanto productores responsables como espectadores críticos de las imágenes que consumen.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los medios locales de Bahía Blanca, los fotógrafos de la ciudad y las instituciones culturales producen y editan imágenes cotidianamente. Proponer a los estudiantes un proyecto de tratamiento digital del patrimonio visual bahiense: seleccionar fotografías antiguas de la ciudad (del archivo municipal o de colecciones familiares), restaurarlas digitalmente (corrección de deterioro, ajuste de contraste, eliminación de manchas) y publicarlas con su historia en el blog del curso, convierte la técnica de edición en un acto de preservación y divulgación del patrimonio visual local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.8 — Los gráficos. Tipos de imágenes y formatos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si un logo debe poder agrandarse a un cartel gigante sin perder calidad y una foto debe capturar millones de matices, ¿por qué usaríamos el mismo tipo de imagen para ambos? ¿Qué pasa cuando invertimos la lógica y pixelamos un logo o vectorializamos una foto?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Las imágenes digitales se clasifican en dos tipos fundamentales con lógicas opuestas: las imágenes de mapa de bits (bitmap o raster), compuestas por una matriz fija de píxeles, donde cada píxel tiene un color definido (fotografías, imágenes complejas con millones de matices), y las imágenes vectoriales, compuestas por descripciones matemáticas de formas (líneas, curvas, polígonos) que pueden escalarse a cualquier tamaño sin pérdida de calidad (logos, iconos, tipografías, diagramas). La diferencia es crucial: una imagen de mapa de bits se pixela al agrandarse porque los píxeles se estiran; una imagen vectorial se recalcula matemáticamente y mantiene su nitidez en cualquier escala.</p>
<p>Los formatos de imagen se corresponden con estos dos tipos y agregan características específicas: JPEG (mapa de bits, compresión con pérdida, ideal para fotografías, no soporta transparencia), PNG (mapa de bits, compresión sin pérdida, soporta transparencia, ideal para gráficos web), GIF (mapa de bits, limitado a 256 colores, soporta animación simple), SVG (vectorial, escalable, ideal para iconos y logos web), BMP (mapa de bits sin compresión, archivos pesados) y TIFF (mapa de bits de alta calidad, uso profesional e impresión). Elegir el tipo y el formato correcto es una de las decisiones técnicas más frecuentes en la producción multimedia y una de las menos conscientes.</p>
<p>El Diseño Curricular incluye este contenido en el Módulo 6 (DC, 2010, p. 22) y lo conecta con el contenido 4.21 del Módulo 4 (formatos de archivo de imágenes) y con las tablas de intervención donde el nivel principiante debe "Trabajar con los principales formatos de imagen" (DC, 2010, p. 29). Didácticamente, el contenido se trabaja con la comparación empírica: los estudiantes agrandan una imagen de mapa de bits y una vectorial hasta ver la diferencia, guardan la misma foto en JPEG y PNG y comparan peso y calidad, y analizan qué formato usa cada sitio web que visitan. El cierre es la aplicación: justificar el tipo y formato de cada imagen que usarán en su producto multimedia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> El diseño gráfico argentino tiene reconocimiento internacional y la industria publicitaria y editorial del país demanda profesionales que dominen estos conceptos técnicos. La elección de formatos abiertos (PNG, SVG) frente a formatos propietarios tiene implicancias de interoperabilidad y preservación: los formatos abiertos garantizan que una imagen pueda abrirse con cualquier software, hoy y en el futuro. Enseñar tipos y formatos de imagen con conciencia de apertura es formar productores que piensan en la perdurabilidad y accesibilidad de sus producciones.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las instituciones bahienses (municipio, clubes, escuelas, medios) usan logos, iconos y fotografías que pueden analizarse técnicamente: ¿el logo del municipio es vectorial o está pixelado?, ¿las fotos del portal municipal están optimizadas para web o son archivos pesados que cargan lento? Proponer a los estudiantes auditar técnicamente las imágenes de tres sitios locales y producir una guía de buenas prácticas (qué tipo y formato usar para cada caso), convierte el contenido técnico en un servicio concreto para mejorar la comunicación digital de las instituciones de la ciudad.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 6 · TRAMO C (6.9–6.11) ===== */
TEORIA_ADI[5].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.9 — Construcción de multimedia: guión, gramática audiovisual, story board, elementos del guión, metáfora multimedia, grafos, escenas, interfaz, pantallas, ventanas</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Se puede improvisar un producto multimedia, o sin planificación solo se produce ruido? Si una interfaz "intuitiva" no es un don natural sino el resultado de decisiones de diseño muy precisas, ¿quién decide qué metáforas usamos para pensar el mundo digital: los diseñadores o nosotros?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La construcción de multimedia es un proceso de producción que, como todo proceso audiovisual, requiere planificación, ejecución y evaluación. El Diseño Curricular enumera sus componentes (DC, 2010, p. 22): el guión multimedia (el documento que describe el contenido, la estructura y la secuencia del producto), la gramática audiovisual (las reglas del lenguaje visual y sonoro: planos, ángulos, ritmo, transiciones), la técnica de guión gráfico o story board (la representación visual escena por escena antes de la producción), los elementos del guión (textos, diálogos, indicaciones técnicas), la metáfora multimedia (la analogía que organiza la interfaz: el "escritorio", la "carpeta", la "ventana"), los grafos (los diagramas de navegación que muestran los nodos y enlaces posibles), las escenas (las unidades de contenido), la interfaz (la superficie de interacción), las pantallas y ventanas (las unidades visuales de la interfaz).</p>
<p>Este contenido es el más abarcador del Módulo 6 porque integra todos los anteriores en el proceso real de producción. La secuencia de construcción multimedia tiene etapas definidas: preproducción (definir objetivo, audiencia, contenido, guión, story board, grafo de navegación), producción (capturar o crear los materiales: textos, imágenes, sonidos, videos) y postproducción (integrar, editar, probar, evaluar y publicar). Cada etapa tiene sus herramientas y sus decisiones, y saltarse la preproducción es la causa más frecuente de productos multimedia ineficaces: sin guión no hay coherencia, sin story board no hay previsión, sin grafo no hay navegación clara.</p>
<p>El Diseño Curricular ubica en el nivel avanzado de sus tablas la construcción completa: "Construir un producto multimedia, en el cual se establezca la producción del guión multimedial y el diseño de la interfaz en la que se incluyan sonidos, textos, videos, imágenes y animaciones" (DC, 2010, p. 29). Didácticamente, el contenido se trabaja con el proyecto multimedia completo del curso: los estudiantes planifican un producto multimedia real (un recorrido interactivo por la historia de Bahía Blanca, una guía multimedia de la escuela, un producto educativo sobre un tema del Módulo 7), producen el guión, el story board y el grafo de navegación antes de tocar cualquier software, y solo entonces pasan a la construcción. La planificación se evalúa tanto como el producto final.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una industria audiovisual y de desarrollo de software que domina estos procesos: las productoras de cine y publicidad, las desarrolladoras de videojuegos (Argentina es el tercer productor de videojuegos de Latinoamérica) y las empresas de e-learning aplican estas metodologías profesionalmente. Enseñar el proceso completo de construcción multimedia es formar para una industria concreta del conocimiento, y también es formar ciudadanos que pueden evaluar críticamente los productos multimedia que consumen, porque conocen las decisiones que hay detrás de cada interfaz.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene productoras audiovisuales, desarrolladoras de software y creadores de contenido que pueden vincularse con la escuela. Proponer que el proyecto multimedia del curso sea sobre un tema de interés local (la historia del puerto de Ingeniero White, un recorrido por la arquitectura del centro, una guía multimedia de los espacios culturales de la ciudad) y que se presente públicamente ante una institución local (municipio, museo, biblioteca), convierte la construcción multimedia en una producción cultural con destinatarios reales y en una práctica preprofesional concreta.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.10 — Utilización de software para la creación de productos multimedia</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿El software multimedia nos convierte en creadores o nos reduce a operarios de plantillas prediseñadas? Cuando elegimos una herramienta para producir, ¿qué grados de libertad real tenemos y qué decisiones toma la herramienta por nosotros sin que lo sepamos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El software para la creación de productos multimedia abarca una familia amplia de herramientas especializadas: editores de imagen (para tratamiento de fotografías y creación gráfica), editores de audio (para grabación, edición y mezcla de sonido), editores de video (para montaje y postproducción audiovisual), herramientas de animación (para crear secuencias animadas), software de presentaciones (para organizar contenido en diapositivas) y herramientas de autoría (para integrar todos los componentes en un producto interactivo, contenido que se desarrolla en el punto siguiente). La elección de la herramienta adecuada depende de la tarea, del nivel de complejidad del producto, de los recursos disponibles y de las licencias.</p>
<p>La dimensión crítica de este contenido es la distinción entre software propietario (licencia restrictiva, código cerrado, pago por uso) y software libre (código accesible, modificable y redistribuible, típicamente gratuito). Para la producción multimedia escolar, el software libre ofrece alternativas profesionales completas: GIMP (imagen), Audacity (audio), Kdenlive o OpenShot (video), Blender (animación 3D), y herramientas de autoría libres. El Diseño Curricular incluye este contenido en el Módulo 6 (DC, 2010, p. 22) y sus objetivos de enseñanza prescriben enseñar sobre las licencias y el uso ético de las herramientas (DC, 2010, p. 15), lo que conecta directamente con el Módulo 7.</p>
<p>Didácticamente, el contenido se trabaja con el taller de herramientas: los estudiantes exploran las herramientas multimedia disponibles en las computadoras de la escuela (priorizando las libres y gratuitas), realizan una operación básica con cada una (recortar una imagen, editar un audio, montar un video breve) y documentan qué herramienta usarían para cada tarea de su proyecto multimedia. La evaluación incluye la justificación de la elección: ¿por qué esta herramienta y no otra?, ¿qué licencia tiene?, ¿puedo usarla legalmente?, ¿qué alternativas existen? Elegir herramientas con criterio es una competencia que trasciende la materia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una comunidad activa de software libre que produce y traduce herramientas multimedia, y las universidades nacionales enseñan tanto software propietario como libre. La política de Conectar Igualdad incluyó software libre (Huayra GNU/Linux) con herramientas multimedia preinstaladas, democratizando el acceso a herramientas de producción que de otro modo serían inaccesibles por su costo. Enseñar software multimedia con conciencia de licencias es formar productores que respetan la propiedad intelectual ajena y que conocen las alternativas legales y gratuitas disponibles.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las escuelas bahienses tienen acceso a herramientas multimedia tanto propietarias como libres, y las escuelas técnicas (EET) y la UNS ofrecen formación complementaria en producción digital. Proponer a los estudiantes construir un kit de herramientas multimedia del curso (una lista documentada de las herramientas libres y gratuitas que usarán durante el año, con sus funciones, licencias y tutoriales básicos), publicarlo en el blog del curso y mantenerlo actualizado, convierte el contenido en un recurso institucional perdurable y en una práctica de gestión tecnológica consciente.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 6.11 — Software de autor</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el software de autor permite crear aplicaciones interactivas sin escribir una sola línea de código, ¿democratiza realmente la creación o crea una nueva dependencia: la del fabricante de la herramienta, que decide qué se puede y qué no se puede hacer? ¿Qué pasa con nuestras creaciones cuando esa herramienta deja de existir?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El software de autor es una categoría de herramientas que permite a los usuarios crear aplicaciones multimedia interactivas (presentaciones navegables, materiales educativos, juegos simples, recorridos interactivos) sin necesidad de dominar lenguajes de programación. El Diseño Curricular lo define explícitamente en nota al pie: "Estos programas refieren al software que brinda a los usuarios la posibilidad de generar distintas aplicaciones multimedia con carácter interactivo, sin la necesidad de dominar lenguajes de programación" (DC, 2010, p. 22, nota 13). Históricamente, los referentes fueron Macromedia Authorware y Director; hoy las alternativas incluyen herramientas como Scratch (programación visual por bloques, que el DC conecta con el aprendizaje de la programación), eXe Learning (creación de contenidos educativos web), H5P (contenidos interactivos para web) y diversas plataformas de autoría educativa.</p>
<p>El valor pedagógico del software de autor es doble: por un lado, baja la barrera técnica de la creación interactiva, permitiendo que estudiantes sin formación en programación produzcan productos multimedia navegables; por otro, introduce la lógica del pensamiento computacional (secuencia, condición, bucle, evento) de manera visual y concreta. El Diseño Curricular incluye este contenido como cierre del Módulo 6 (DC, 2010, p. 22) y lo conecta con el objetivo de que los estudiantes "diseñen productos basados en la organización del hipertexto, la hipermedia y la multimedia" (DC, 2010, p. 23). El software de autor es la herramienta que permite pasar de la producción multimedia lineal (un video, una presentación) a la producción hipermedia interactiva (un recorrido con decisiones, un material educativo navegable).</p>
<p>Didácticamente, el contenido se trabaja con la construcción de un producto interactivo integrador: los estudiantes usan una herramienta de autor disponible (Scratch para un producto lúdico-educativo, eXe Learning para un material educativo web, o una herramienta de presentaciones con hipervínculos para un recorrido navegable) para construir el producto multimedia que planificaron en el contenido 6.9. El producto debe incluir los componentes del guión multimedia: escenas, navegación, integración de formatos (texto, imagen, sonido, video) y al menos una decisión interactiva del usuario. La evaluación cubre tanto el producto como la planificación que lo precedió.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El software de autor tiene una aplicación directa en la producción de materiales educativos argentinos: los portales Educ.ar y las plataformas provinciales producen contenidos interactivos con herramientas de autoría, y los docentes que dominan estas herramientas pueden crear sus propios materiales adaptados a sus estudiantes. El debate sobre la perdurabilidad de los productos creados con software de autor es importante: si la herramienta desaparece o cambia de formato, los productos pueden volverse inaccesibles. Enseñar a elegir herramientas de autor con criterios de apertura y exportación es una competencia de preservación digital.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes bahienses pueden aplicar el software de autor a producciones con destinatarios reales: crear un material educativo interactivo sobre un tema local (la historia de un barrio, la flora y fauna de la región, un recorrido por los espacios culturales de la ciudad) y donarlo a la biblioteca escolar o a una institución local; o crear una versión interactiva de la guía multimedia del curso. El cierre del Módulo 6 puede ser una muestra de productos multimedia interactivos donde cada equipo presenta su producto ante la comunidad escolar, cerrando el ciclo de planificación, producción y publicación que el módulo enseña.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 7 · TRAMO A (7.1–7.4) ===== */
TEORIA_ADI[6].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.1 — Conceptos y características de ciudadanía digital</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la ciudadanía tradicional se define por el territorio, la Constitución y el pasaporte, ¿qué nos hace "ciudadanos" en un ciberespacio que no tiene fronteras físicas, donde las leyes las escriben corporaciones multinacionales y donde podemos ser expulsados de la plaza pública (una red social) sin juicio previo ni derecho a defensa?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La ciudadanía digital es el conjunto de normas de comportamiento, derechos y responsabilidades relacionadas con el uso de la tecnología. El concepto, popularizado por Mike Ribble, postula que el entorno digital no es una "tierra de nadie" ni un mero espacio técnico, sino un nuevo territorio de convivencia social que exige un contrato social propio. Sus características fundamentales incluyen la desterritorialidad (las interacciones cruzan jurisdicciones nacionales en milisegundos), la asincronía y ubicuidad (las acciones digitales dejan huellas permanentes y accesibles desde cualquier lugar), y la identidad múltiple y pseudónima (un sujeto puede operar con diversas máscaras y niveles de anonimato). La ciudadanía digital no se limita a "saber usar" herramientas (eso es alfabetización instrumental), sino que implica ejercer derechos (acceso, privacidad, libertad de expresión) y asumir deberes (respeto, empatía, legalidad, cuidado del bien común digital).</p>
<p>El Diseño Curricular bonaerense ubica este concepto como el primer contenido del módulo y como el paraguas que engloba toda la materia (DC, 2010, p. 21), exigiendo que los estudiantes "desarrollen una postura ética y responsable". Didácticamente, se aborda mediante el debate de la "Constitución Digital": si los estudiantes fueran los fundadores de una nueva república digital, ¿qué derechos serían inalienables? ¿El acceso a Internet es un derecho humano (como declaró la ONU en 2011) o un servicio comercial? ¿Cómo se castiga el "delito" en un espacio donde el agresor puede estar en otro continente? Este ejercicio desnaturaliza la pasividad del "usuario" y lo posiciona como "ciudadano" con agencia política.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina ha sido pionera en la región en debates sobre ciudadanía digital: desde la sanción de la Ley de Protección de Datos Personales (25.326) hasta los proyectos de ley sobre Derechos de las Niñas, Niños y Adolescentes en el entorno digital. Sin embargo, la ciudadanía digital argentina está marcada por una fuerte tensión: somos usuarios hiperconectados y creativos, pero dependemos de infraestructuras y plataformas (Meta, Google, X) que operan bajo la jurisdicción de EE. UU., lo que limita nuestra soberanía para exigir derechos frente a abusos algorítmicos o censuras privadas. Formar ciudadanos digitales en Argentina es formar sujetos capaces de reclamar ante el Estado y organizar boicots o acciones colectivas frente a las Big Tech.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca, la ciudadanía digital se ejerce cotidianamente en los grupos de Facebook de reclamo vecinal, en las audiencias públicas virtuales del municipio o en las campañas de donación solidaria organizadas por Instagram. Proponer a los estudiantes que analicen un conflicto digital local reciente (por ejemplo, una campaña de difamación en redes contra un comercio bahiense, o un reclamo viral por la falta de agua en un barrio) y evalúen cómo se ejercieron (o violaron) los derechos y deberes de la ciudadanía digital, ancla el concepto abstracto en la convivencia real de su propia ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.2 — Educación (e-learning, b-learning, m-learning)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la tecnología nos permite aprender de cualquier maestro del mundo en cualquier momento, ¿por qué la "educación digital" a menudo se reduce a digitalizar la vieja clase magistral en formato PDF y videoconferencia? ¿Estamos usando la red para emancipar el pensamiento o para industrializar y vigilar el aprendizaje mediante plataformas que nos tratan como meros consumidores de contenidos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El DC incluye las modalidades educativas mediadas por tecnología (DC, 2010, p. 21): el e-learning (aprendizaje 100% virtual, asincrónico o sincrónico, mediado por plataformas LMS), el b-learning o blended learning (aprendizaje mixto que integra la presencialidad con la virtualidad, aprovechando lo mejor de ambos entornos) y el m-learning o mobile learning (aprendizaje ubicuo a través de dispositivos móviles, aprovechando la geolocalización, la cámara y la conectividad permanente). La característica definitoria de estas modalidades no es el soporte técnico, sino el cambio en el rol del estudiante (de receptor a investigador y productor) y del docente (de expositor a curador de contenidos y tutor).</p>
<p>Didácticamente, los estudiantes de 4to año ya son "expertos" en estas modalidades por supervivencia (tras la experiencia de la pandemia y el ASPO). La propuesta es que pasen de ser usuarios a ser críticos y diseñadores: analizar la plataforma educativa de su propia escuela (Classroom, Moodle) bajo la lupa del b-learning. ¿Fomenta la colaboración o la entrega individual de tareas? ¿Permite la creación o solo la descarga? El cierre es el diseño de una micro-experiencia de m-learning para alumnos de 1er año: crear una ruta de aprendizaje geolocalizada por la escuela o el barrio usando los celulares, demostrando que el aprendizaje puede ocurrir fuera del aula y de manera interactiva.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> El sistema educativo argentino atravesó un "b-learning de emergencia" que dejó al descubierto las brechas de segundo nivel (pedagógicas y de acompañamiento familiar). Universidades como la UNS o la UTN, y el sistema de educación a distancia provincial, han desarrollado campus virtuales robustos. Sin embargo, el debate nacional gira en torno a la "plataformización" de la educación: la dependencia de software privativo que extrae datos de los estudiantes y la precarización de los tutores virtuales. Pensar el e-learning en Argentina exige defender la educación como derecho público y no como servicio de mercado.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Muchos estudiantes bahienses de 4to año ya cursan materias introductorias o talleres en los campus virtuales de la UNS o la UTN. Una actividad situada es realizar un análisis comparativo entre el entorno virtual de su escuela secundaria y el campus universitario que utilizarán al año siguiente. ¿Qué competencias de autonomía, netiquette y gestión del tiempo exige la universidad? Este ejercicio funciona como una "nivelación" de ciudadanía digital académica, preparando a los jóvenes para el e-learning universitario con herramientas críticas y no solo operativas.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.3 — Comercio (e-commerce)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando compramos en un marketplace, ¿somos clientes o somos el producto que la plataforma le vende al vendedor mediante nuestros datos de comportamiento? Si el algoritmo decide qué vemos y a qué precio (dinámica de precios), ¿dónde queda la libre competencia y el derecho del consumidor a elegir en el mercado digital?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El e-commerce (comercio electrónico) abarca la compra, venta y marketing de bienes y servicios a través de redes digitales. Sus modelos incluyen B2C (empresa a consumidor, como las tiendas oficiales), C2C (consumidor a consumidor, como MercadoLibre o Facebook Marketplace) y B2B. La ciudadanía digital en el e-commerce exige comprender que la interfaz de compra está diseñada mediante "patrones oscuros" (dark patterns) para manipular la urgencia y el gasto, y que los sistemas de reputación (estrellas, comentarios) son el nuevo capital de confianza, frecuentemente falsificado por granjas de bots.</p>
<p>El Diseño Curricular busca que los estudiantes adquieran "capacidades en el manejo de la información, como ejercicio de la ciudadanía digital" (DC, 2010, p. 23), lo que en el comercio implica saber rastrear un envío, verificar la legitimidad de un vendedor, conocer los botones de arrepentimiento y proteger los datos financieros. Didácticamente, se trabaja con la auditoría de una compra simulada: los estudiantes rastrean un producto en tres plataformas distintas, comparan cómo cada una muestra la información (costos de envío ocultos, letras chicas, garantías), leen los términos de devolución y simulan un reclamo por un producto defectuoso. Aprender a reclamar en el entorno digital es un acto de soberanía del consumidor.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina es uno de los mercados de e-commerce más grandes de Latinoamérica, con una penetración masiva de MercadoLibre y, recientemente, de plataformas asiáticas (Shein, Temu, AliExpress) que han revolucionado el consumo y generado debates aduaneros y fiscales. La Ley de Defensa del Consumidor (24.240) y el "Botón de Arrepentimiento" son herramientas legales que todo ciudadano digital argentino debe conocer. Además, las estafas virtuales (phishing de ventas falsas, cuentas clonadas) son una epidemia que requiere alfabetización preventiva constante.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El comercio bahiense ha mutado: las vidrieras del centro conviven con los "showrooms" cerrados que solo venden por Instagram y WhatsApp, y los grupos de "Compra-Venta Bahía Blanca" son un mercado informal gigante. Proponer a los estudiantes que elaboren una "Guía de Supervivencia para el Comprador Digital Bahiense" (cómo verificar un perfil local, dónde denunciar una estafa en la Oficina Municipal de Defensa del Consumidor, cómo pactar un punto de encuentro seguro para una transacción C2C en la ciudad) convierte el contenido en un servicio comunitario de altísimo valor práctico.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.4 — Negocios (e-business)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el e-commerce es solo la vidrieta digital, el e-business es la fábrica entera conectada a la red. Cuando una empresa digitaliza sus procesos internos, sus recursos humanos y su cadena de proveedores, ¿qué pasa con los trabajadores que no saben adaptarse a la lógica del algoritmo? ¿La eficiencia del e-business se construye sobre la exclusión de la mano de obra analógica?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El e-business (negocios electrónicos) es un concepto más amplio que el e-commerce: abarca la digitalización de todos los procesos de una organización (gestión de relaciones con clientes o CRM, planificación de recursos empresariales o ERP, cadenas de suministro, trabajo colaborativo interno). En el e-business, la información fluye en tiempo real entre la fábrica, el depósito, el vendedor y el cliente. Esto exige una ciudadanía digital corporativa que incluye la ética en el manejo de datos de empleados, la seguridad de los secretos industriales y la responsabilidad sobre el impacto ambiental de la logística digital.</p>
<p>Didácticamente, el concepto se aborda analizando el ecosistema productivo local. Los estudiantes no necesitan programar un ERP, sino comprender cómo la integración digital transforma las organizaciones. Se propone el estudio de caso de una empresa local que haya transitado la digitalización de sus procesos. El debate ético se centra en la "uberización" de la economía: plataformas que conectan oferta y demanda (e-business puro) pero que externalizan los riesgos laborales a los trabajadores independientes, desafiando las leyes de trabajo tradicionales.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La industria del software y los servicios digitales (Sadosky, CESSI) son un motor del e-business en Argentina, exportando soluciones a todo el mundo. Sin embargo, la digitalización de las PyMEs argentinas es aún asimétrica, y la Ley de Economía del Conocimiento busca incentivar esta transición. El debate sobre el teletrabajo (Ley 27.555) es un debate de e-business: cómo regular el derecho a la desconexión y el control algorítmico de la productividad de los empleados que trabajan desde sus hogares.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El Polo Petroquímico de Ingeniero White y la zona franca de Bahía Blanca son laboratorios de e-business avanzado: la logística portuaria, el seguimiento de contenedores y la automatización de procesos químicos dependen de redes de datos globales. Por otro lado, el comercio minorista bahiense lucha por integrar sus stocks físicos con sus tiendas online. Invitar a un gerente de sistemas de una empresa local (portuaria, industrial o retail) para que explique cómo la información digitaliza el negocio, muestra a los estudiantes las salidas laborales y los desafíos éticos del e-business en su propia ciudad.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 7 · TRAMO B (7.5–7.8) ===== */
TEORIA_ADI[6].html += `
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.5 — Gobierno (e-government)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el Estado digital promete eficiencia y transparencia, ¿por qué a menudo se siente como un laberinto de claves, trámites caídos y exclusión para el que no tiene conexión o paciencia? ¿El e-government es una herramienta para empoderar al ciudadano o un muro de contención burocrático que delega en el usuario la tarea que antes hacía un empleado público?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El e-government (gobierno electrónico) es el uso de las NTICx por parte del Estado para brindar servicios a los ciudadanos (G2C), a las empresas (G2B) y para la gestión interna entre agencias (G2G). Sus niveles van desde la mera información web (folletos digitales) hasta la transacción completa (obtener una partida de nacimiento o un turno médico sin ir a una oficina) y la participación democrática (presupuestos participativos online). La ciudadanía digital exige aquí el dominio de la identidad digital soberana (cómo el Estado certifica que "yo soy yo" en la red) y la comprensión de que el trámite digital no debe ser un privilegio, sino un derecho accesible (usabilidad, accesibilidad para personas con discapacidad).</p>
<p>El DC exige "desarrollar habilidades de participación y acción responsables" (DC, 2010, p. 23). Didácticamente, se realiza un relevamiento de la burocracia digital: los estudiantes intentan realizar (o simulan) un trámite real en el portal municipal o provincial (ej. inscripción a becas, reclamo por luminarias, solicitud de actas). Evalúan la experiencia de usuario (UX), la claridad del lenguaje, los requisitos de seguridad y las barreras para personas mayores o con baja alfabetización digital. El cierre es la redacción de una nota formal a la entidad proponiendo mejoras basadas en la usabilidad y la inclusión.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina ha avanzado enormemente en e-government: la plataforma Mi Argentina, la Clave Fiscal de AFIP-ARCA, la Billetera Santa Fe (como referente provincial) o el sistema CORREOS son ejemplos de infraestructura digital estatal masiva. Sin embargo, la brecha digital sigue siendo una barrera para el acceso a derechos (AUH, jubilaciones), obligando al Estado a mantener ventanillas físicas y redes de acompañamiento. El e-government argentino debe navegar entre la modernización tecnológica y la garantía de que ningún ciudadano quede excluido por no tener un smartphone de última generación.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El Municipio de Bahía Blanca ha impulsado fuertemente la digitalización de trámites (turnos web, expedientes electrónicos, pago de tasas). Proponer a los estudiantes que actúen como "Auditores de Ciudadanía Digital Municipal": probar los portales locales, identificar qué trámites siguen exigiendo presencia física innecesaria, y mapear los "puntos de acceso" barriales donde los vecinos sin internet pueden ser ayudados a realizar sus trámites digitales. Este mapeo solidario conecta la tecnología con la justicia social en el territorio bahiense.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.6 — Voto electrónico</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando votamos en papel, cualquiera puede contar los votos en la mesa; cuando votamos en una máquina, debemos confiar ciegamente en el código de una empresa privada que no podemos auditar. ¿Es el voto electrónico una modernización democrática o la privatización de la soberanía popular, entregando la voluntad ciudadana a una caja negra inescrutable?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El voto electrónico (o boleta única electrónica/papel con lectores ópticos) es la aplicación de las NTICx al acto fundamental de la democracia. El debate técnico y político es feroz: los defensores argumentan rapidez, reducción de fraudes de mesa y accesibilidad; los críticos (incluyendo a la casi unanimidad de los expertos en ciberseguridad mundial) advierten sobre la vulnerabilidad del software, la imposibilidad de que el ciudadano común audite el conteo, los ataques de ransomware o denegación de servicio el día de la elección, y el riesgo de compra de votos si el sistema permite verificar el voto emitido. La ciudadanía digital exige comprender que la tecnología no es neutral: aplicar ingeniería de sistemas a la política requiere estándares de seguridad y transparencia muy superiores a los de la banca online.</p>
<p>El Diseño Curricular incluye el voto electrónico como contenido específico (DC, 2010, p. 21). Didácticamente, se aborda mediante un simulacro de debate legislativo: dividir la clase en "diputados" a favor y en contra de la implementación del voto electrónico en la Provincia de Buenos Aires. Deben investigar los sistemas usados en otros países (el papel con QR de Salta/CABA vs. el veto al voto electrónico en Alemania u Holanda), los riesgos de seguridad informática y el impacto en la cultura cívica. El objetivo no es llegar a una conclusión única, sino entender la complejidad técnica de la democracia digital.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina ha sido un campo de pruebas y disputas intenso sobre el voto electrónico. La experiencia de la Boleta Única Electrónica (BUE) en CABA y Salta generó denuncias de expertos en informática sobre vulnerabilidades en los chips RFID y el código fuente. A nivel nacional, el Congreso ha debatido repetidamente la reforma electoral. La postura de la comunidad informática argentina (a través de foros y universidades) ha sido mayoritariamente escéptica, defendiendo la Boleta Única Papel (BUP) como el único sistema que garantiza que el ciudadano controle su voto sin depender de intermediarios tecnológicos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las elecciones locales y provinciales, los bahienses debaten estos temas en cada acto electoral. Se puede proponer a los estudiantes que entrevisten a delegados electorales, fiscales informáticos o autoridades de la Junta Electoral local para conocer los protocolos de seguridad, la transmisión de datos de los telegramas (el "e-government" del escrutinio provisorio) y los desafíos de llevar la democracia a las localidades rurales del partido de Bahía Blanca. Comprender la infraestructura de datos del escrutinio es comprender cómo se construye la legitimidad política en la era digital.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.7 — El ciberespacio como espacio de interacción</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el ciberespacio es un "lugar" donde pasamos horas de nuestra vida, trabajando, amando y jugando, ¿por qué lo tratamos como si fuera un simple cable por donde pasan datos? ¿Quién es el dueño del suelo digital que pisamos, y qué derechos de "propiedad" o "desalojo" tienen las empresas sobre nuestras vidas sociales?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El concepto de ciberespacio, acuñado por William Gibson y teorizado por Pierre Lévy, define el espacio inmaterial pero real de interacción social, económica y cultural mediado por redes de computadoras. No es una "autopista de la información" (un mero tubo de transporte), sino un territorio antropológico donde se construyen identidades, comunidades y economías. En el ciberespacio, las distancias físicas se anulan, pero surgen nuevas centralidades (los servidores de las Big Tech) y nuevas periferias (los usuarios desconectados o censurados). Interactuar en el ciberespacio exige comprender que las acciones allí tienen consecuencias en el espacio físico (el "mundo real"), destruyendo la vieja dicotomía entre "virtual" (falso) y "real" (verdadero).</p>
<p>El DC lo señala como espacio de interacción (DC, 2010, p. 21). Didácticamente, se trabaja con la cartografía del ciberespacio personal: los estudiantes dibujan un mapa de los "lugares" que habitan digitalmente (el servidor de Discord donde juegan, el grupo de WhatsApp familiar, el perfil de Instagram, el aula virtual). Para cada "lugar", identifican quién es el dueño del terreno (la empresa), cuáles son las leyes (los Términos y Condiciones) y qué policía las aplica (los moderadores o algoritmos). Este mapa revela que el ciberespacio está feudalizado por corporaciones, y que la ciudadanía digital implica buscar o construir espacios públicos digitales comunes.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La interacción social argentina se ha trasladado masivamente al ciberespacio: la militancia política, el sindicalismo, el apoyo mutuo en crisis (como los incendios en el sur o las inundaciones) y la cultura del meme se organizan en redes. Sin embargo, la dependencia de plataformas extranjeras hace que la "plaza pública" argentina esté sujeta a las políticas de moderación de contenido de empresas californianas, que a menudo censuran vocablos locales o contextos políticos que sus algoritmos no comprenden. Reclamar la soberanía sobre el ciberespacio argentino es un debate geopolítico incipiente pero crucial.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El ciberespacio bahiense tiene sus propias plazas y cafés: los grupos de Facebook de la ciudad, los servidores de Discord de los estudiantes de la UNS, los foros de hinchas de Olimpo y Villa Mitre. Proponer a los estudiantes que investiguen una movilización social nacida en el ciberespacio local (una campaña para salvar un espacio cultural, una colecta solidaria para un vecino, un reclamo ambiental por el estuario) y rastreen cómo la interacción digital se materializó en acción física en las calles de Bahía Blanca. Esto demuestra que el ciberespacio es, hoy, el motor de la acción ciudadana territorial.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.8 — La información como mercancía en la sociedad de la información y el conocimiento</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si "la información quiere ser libre", ¿por qué las empresas más ricas de la historia de la humanidad son aquellas que cercan, empaquetan y venden nuestra propia información personal? ¿Somos los dueños de nuestros datos, o somos los peones que trabajan gratis en la mina de datos del capitalismo de vigilancia?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>En la economía digital, la información (los datos) es la nueva mercancía, el "petróleo del siglo XXI". A diferencia de las mercancías físicas, los datos son no-rivales (pueden ser usados por muchos simultáneamente sin agotarse) y se multiplican al compartirse. El modelo de negocio de la Web 2.0 y 3.0 se basa en la extracción gratuita de datos conductuales (qué miramos, dónde vamos, con quién hablamos) para construir perfiles predictivos que se venden a anunciantes, aseguradoras y actores políticos. Autoras como Shoshana Zuboff denominan a esto "capitalismo de vigilancia": la experiencia humana privada es reclutada como materia prima gratuita para la fabricación de productos predictivos.</p>
<p>El DC exige comprender este fenómeno (DC, 2010, p. 21). Didácticamente, se aborda mediante el análisis de la "factura" de lo gratuito: los estudiantes investigan cómo monetizan sus apps favoritas (TikTok, Instagram, juegos móviles). Se introduce el concepto de Data Brokers (corredores de datos) y se debate la paradoja de la privacidad: decimos que nos importa, pero la entregamos a cambio de un filtro divertido o un descuento. El ejercicio de "leer" la política de privacidad de una app (usando herramientas que resumen los T&C) suele generar un impacto profundo y un cambio de hábitos en la gestión de permisos de los dispositivos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina cuenta con una Ley de Protección de Datos Personales (25.326) que, aunque antigua (del año 2000), establece que los datos personales son propiedad del individuo y requieren consentimiento para su cesión. Sin embargo, la falta de una autoridad de aplicación con poder de policía fuerte y la necesidad de actualizar la ley a los estándares internacionales (como el GDPR europeo) dejan a los ciudadanos argentinos en una posición de vulnerabilidad frente a la extracción de datos por parte de multinacionales. El debate sobre la "soberanía de datos" y la creación de infraestructuras de datos nacionales es central para el desarrollo económico autónomo.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los comercios bahienses, desde el supermercado de barrio con su programa de "puntos" hasta las grandes cadenas, recopilan datos de consumo de los vecinos. Proponer a los estudiantes que analicen los programas de fidelidad locales: ¿qué datos piden a cambio de un descuento? ¿Informan para qué los usan? ¿Se pueden dar de baja fácilmente? Este ejercicio de auditoría de datos a escala local hace tangible la economía de la información y empodera a los estudiantes como consumidores conscientes de su propio valor como "mercancía" de datos.</div>
</div>`;

/* ===== TEORÍA EXTENSA · MÓDULO 7 · TRAMO C (7.9–7.11) ===== */
