<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.11 — Concepto de ancho de banda</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando contratamos "más megas", ¿qué estamos comprando exactamente: velocidad, capacidad o una promesa? ¿Y por qué dos personas con el mismo ancho de banda viven experiencias tan distintas? ¿El ancho de banda es una propiedad del cable o de la desigualdad con que lo compartimos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El ancho de banda es la capacidad máxima de un canal de comunicación para transportar información en un tiempo dado: en su acepción técnica analógica se mide en hertz (rango de frecuencias del canal), y en el uso digital cotidiano se expresa en bits por segundo (kbps, Mbps, Gbps). La metáfora canónica es la de una ruta: el ancho de banda es la cantidad de carriles disponibles; más carriles permiten más tráfico simultáneo, pero no garantizan que los autos lleguen rápido si hay embotellamiento más adelante (eso lo verá el contenido siguiente: tasa de transferencia).</p>
<p>Es crucial distinguir tres planos que suelen confundirse: el ancho de banda nominal o contratado (el máximo que promete el proveedor), el ancho de banda disponible (lo que la red puede entregar en un momento dado, afectado por congestión y estado del medio) y el caudal efectivo que recibe una aplicación concreta. También debe enseñarse la asimetría típica de los accesos domiciliarios (más bajada que subida) y su significado social: las conexiones pensadas para consumir, no para producir. El Diseño Curricular espera que los estudiantes comprendan cómo se transmiten los datos y administren recursos de red (DC, 2010, p. 20), y el ancho de banda es la unidad conceptual de esa comprensión.</p>
<p>Didácticamente, el concepto se instala con la metáfora hidráulica y vial y con mediciones reales: usar un medidor de velocidad en línea desde las computadoras del aula en distintos horarios y registrar los resultados. La pregunta de cierre es la más potente: ¿por qué medimos menos de lo contratado?, ¿a quién pertenece la diferencia entre lo prometido y lo recibido? Así el ancho de banda deja de ser un número del abono y se vuelve un objeto de análisis crítico del consumo tecnológico.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina muestra una brecha persistente de ancho de banda: las velocidades promedio de las grandes ciudades multiplican las de las zonas rurales, y los informes de ENACOM y los indicadores del sector (incluidos los reportes de la Cámara Argentina de Internet, CABASE) documentan esa asimetría territorial. La política pública responde con el despliegue de fibra federal (REFEFO), los puntos de acceso comunitarios y la regulación de velocidades mínimas; pero el ancho de banda sigue siendo, en los hechos, un bien distribuido según capacidad de pago y densidad de población. Enseñar este contenido con datos nacionales reales es enseñar geografía económica de la conectividad.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca el ancho de banda también es desigual: el centro y los barrios con fibra acceden a velocidades altas, mientras zonas periféricas y las localidades rurales del partido dependen de tecnologías más limitadas o de datos móviles. Proponer una campaña de medición comunitaria (cada estudiante mide en su casa, se tabula por barrio, se grafica) produce un mapa del ancho de banda bahiense hecho por la propia escuela, que puede publicarse en el blog del curso como aporte ciudadano: datos locales producidos por estudiantes sobre un problema local real.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.12 — Tasa de transferencia</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si contraté "100 megas", ¿por qué la descarga me dice "12,5 megas"? ¿Me están estafando o estoy confundiendo unidades? ¿Cuántas decisiones de consumo tecnológico se toman sobre malentendidos entre bits y bytes, entre lo prometido y lo recibido?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La tasa de transferencia es la cantidad de información efectivamente transmitida por unidad de tiempo en un momento dado, y se diferencia del ancho de banda (capacidad máxima) como la velocidad real de un viaje se diferencia de la velocidad máxima permitida. Sobre la tasa efectiva inciden múltiples factores: la congestión de la red, la calidad del medio, la distancia, el procesamiento de los dispositivos intermedios, la sobrecarga de los protocolos (parte del tráfico no es útil sino de control) y las limitaciones del servidor remoto. Por eso dos mediciones sucesivas rara vez dan igual, y por eso la experiencia real de navegación depende de toda la ruta, no solo del abono contratado.</p>
<p>Un segundo componente del contenido es la confusión de unidades, que debe enseñarse explícitamente: los proveedores comercializan en bits por segundo (Mbps), pero los sistemas operativos y las descargas suelen mostrar bytes por segundo (MB/s); como un byte son ocho bits, "100 megas" contratados equivalen idealmente a unos 12,5 MB/s de descarga. Con esa conversión los estudiantes pueden calcular cuánto tarda bajar un archivo de tamaño conocido, estimar cuántos videos entran en su conexión diaria y, sobre todo, leer críticamente la publicidad de los servicios de Internet.</p>
<p>Didácticamente, este contenido es ideal para el cálculo situado: tomar los resultados de las mediciones del contenido anterior (ancho de banda), convertir unidades, estimar tiempos de descarga de archivos reales (una película, un juego, el backup del curso) y comparar el tiempo calculado con el tiempo medido. La diferencia entre cálculo y realidad abre la discusión sobre los factores de la tasa efectiva. El Diseño Curricular espera estudiantes que analicen la transmisión de datos (DC, 2010, p. 20): nada más analítico que auditar con matemática simple la propia conexión.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La transparencia de la tasa de transferencia es un tema de defensa del consumidor en Argentina: ENACOM recibe reclamos por velocidades menores a las contratadas, y la declaración de servicio público del acceso a Internet (DNU 690/2020) incluyó la discusión sobre calidades mínimas y planes básicos obligatorios. La asimetría también es territorial: las mediciones nacionales muestran diferencias de varias veces entre jurisdicciones. Formar usuarios que sepan medir, convertir unidades y reclamar con fundamento es formar consumidores con derechos y no clientes pasivos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La auditoría de tasas de transferencia puede hacerse íntegramente con material bahiense: medir en la escuela y en los hogares, convertir a MB/s, calcular cuánto tardaría cada hogar en descargar el material del curso, y comparar los resultados con lo que cada familia paga. El ejercicio tiene un corolario de ciudadanía: ¿qué información figura en las facturas locales?, ¿qué dice el contrato sobre la velocidad mínima garantizada? Los estudiantes producen así un informe comparativo de "lo que pagamos vs. lo que recibimos" en Bahía Blanca, publicable en el blog del curso como herramienta comunitaria.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.13 — Administración de recursos compartidos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si una red existe para compartir, ¿por qué compartir es siempre peligroso? Cada carpeta abierta, cada impresora común, cada Wi-Fi compartido es a la vez una puerta de entrada y una puerta de salida: ¿cómo se administra una comunidad digital sin volverla un territorio sin ley ni una fortaleza sin ventanas?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La administración de recursos compartidos es el conjunto de prácticas que gobiernan el uso común de los bienes de una red: archivos y carpetas compartidas, impresoras, escáneres, la propia conexión a Internet y los servicios (correo, aulas virtuales). Sus instrumentos son los permisos (quién puede leer, modificar o ejecutar cada recurso), la autenticación de usuarios (identidades y contraseñas), la organización jerárquica (carpetas por área, proyecto o rol) y las políticas de resguardo (copias de seguridad periódicas de lo compartido). El Diseño Curricular lo formula como expectativa explícita: "administren una red como centro de recursos compartidos" (DC, 2010, p. 20).</p>
<p>El contenido tiene una dimensión conceptual profunda: compartir recursos es la economía de escala que justifica las redes (una impresora para treinta equipos, un enlace para toda la escuela, un documento editado por todo un grupo), pero esa misma economía genera los problemas clásicos de los bienes comunes: uso indebido, congestión, borrados accidentales, accesos no autorizados. Administrar es entonces tomar decisiones sociales con herramientas técnicas: qué se comparte, con quiénes, con qué límites y con qué responsabilidades. Esa traducción de lo social a lo técnico es exactamente la mirada crítico-reflexiva que el Diseño Curricular exige en todas las alfabetizaciones.</p>
<p>Didácticamente, la estrategia es el laboratorio de administración real: crear en el aula de informática una estructura de carpetas compartidas del curso (una por equipo, una común, una de solo lectura del docente), asignar usuarios y permisos, y poner a los estudiantes en el rol de administradores por turnos: detectar quién puede acceder a qué, probar accesos indebidos (controlados), configurar la impresora compartida y diseñar el cronograma de resguardo. El Diseño Curricular lo confirma en sus tablas: el nivel avanzado incluye administrar soportes de almacenamiento y sistematizar el resguardo de archivos (DC, 2010, pp. 25-26).</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La administración de recursos compartidos a escala nacional es la base del Estado digital: los organismos públicos administran repositorios documentales, sistemas de expediente electrónico y bases compartidas entre jurisdicciones, y cada incidente de acceso indebido o pérdida de datos estatales recuerda que administrar bien es proteger derechos. Las escuelas argentinas que recibieron equipamiento de los planes de inclusión digital enfrentan además el problema concreto de administrar recursos compartidos sin personal especializado permanente, lo que vuelve este contenido una competencia profesional directamente empleable.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las escuelas bahienses, la administración de recursos compartidos es una necesidad cotidiana: el aula de informática, las impresoras comunes, las carpetas de trabajo docente y las cuentas institucionales. Proponer a los estudiantes diseñar e implementar el plan de administración del aula de informática de su propia escuela —carpetas con permisos por rol, política de contraseñas, cronograma de resguardo en disco externo, registro de incidencias— convierte el contenido en un servicio institucional real y evaluable, y anticipa el "plan estratégico" que el Diseño Curricular exige como criterio de evaluación (DC, 2010, p. 30).</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.14 — Análisis de los modelos cliente-servidor y las redes entre pares (P2P)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Qué modelo de sociedad se esconde en cada arquitectura de red? Un mundo cliente-servidor tiene centros que sirven y periferias que piden; un mundo P2P tiene iguales que se prestan entre sí. ¿Internet se parece cada vez más a cuál de los dos, y quién gana con eso?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El modelo cliente-servidor organiza la red en roles fijos: el servidor concentra recursos (archivos, páginas web, correo, bases de datos) y responde solicitudes; los clientes las inician y consumen las respuestas. Sus ventajas son la administración centralizada, la seguridad controlable y la disponibilidad garantizada por equipos dedicados; sus desventajas, el costo, la dependencia del centro y la escalabilidad limitada. El modelo P2P (peer-to-peer, entre pares) elimina la jerarquía fija: cada nodo es simultáneamente cliente y servidor, aporta y consume recursos; sus ventajas son la descentralización, la robustez y el bajo costo; sus desafíos, la seguridad, el control de contenidos y la sostenibilidad.</p>
<p>La historia de Internet es una tensión entre ambos modelos: la web clásica es cliente-servidor (navegador-servidor), mientras que protocolos como BitTorrent, las redes de intercambio de archivos y algunas redes sociales federadas exploraron el P2P masivo. El debate no es técnico sino también jurídico y cultural: el P2P habilitó tanto usos legítimos (distribución de software libre, contenidos con licencia libre, investigación) como violaciones masivas de derechos de autor, y esa ambigüedad lo convierte en objeto ideal de análisis crítico. El Diseño Curricular espera que los estudiantes "reconozcan las distintas formas de organización de una red" y analicen el fenómeno Internet (DC, 2010, p. 20), lo que exige comprender ambos modelos.</p>
<p>Didácticamente, el contenido se enseña con juegos de rol: una ronda donde un solo estudiante-servidor debe atender pedidos de todos (cuello de botella) frente a una ronda donde todos intercambian recursos entre sí (distribución); luego se formaliza comparando ventajas, riesgos y ejemplos reales de cada modelo. El cierre crítico pregunta por el presente: las grandes plataformas actuales, ¿son servidores cada vez más poderosos con clientes cada vez más dependientes? ¿Qué pierde un usuario que solo sabe ser cliente?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina participó de ambos mundos: el modelo cliente-servidor domina sus servicios estatales y empresariales, mientras las redes P2P fueron masivas en los consumos culturales de los años 2000 y generaron debates locales sobre derechos de autor, acceso a la cultura y regulación que llegaron al Congreso y a la Justicia. Hoy la dependencia de unas pocas plataformas-servidor globales (que concentran correo, búsqueda, redes y nube) plantea la discusión estratégica sobre infraestructura propia: CDNs nacionales, nube pública y servicios federados. Comprender cliente-servidor vs. P2P es comprender los términos de ese debate.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En la escala bahiense ambos modelos son observables: la UNS y el municipio administran servidores propios (correo, webs, sistemas académicos) bajo lógica cliente-servidor, y las escuelas operan servidores de aula cuando administran carpetas y servicios compartidos. Proponer a los estudiantes analizar qué servicios locales dependen de servidores propios y cuáles de plataformas globales (¿dónde está alojado el sitio del municipio?, ¿y el de un comercio local?) y discutir qué pasaría si un servidor global retirara el servicio, territorializa el concepto y siembra la noción de soberanía tecnológica.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.15 — Tipos de comunicación dentro de las redes: sincrónica, asincrónica, simétrica y asimétrica</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Toda conexión comunica? Si chatear en tiempo real, dejar un mensaje en un foro y mirar televisión por Internet son tres comunicaciones distintas sobre la misma red, ¿qué cambia realmente en nosotros según el tipo de comunicación que elegimos? ¿Y por qué la escuela casi siempre eligió el tipo asincrónico mientras los jóvenes viven en el sincrónico?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El Diseño Curricular clasifica la comunicación en redes según dos ejes (DC, 2010, p. 20): según el tiempo, en sincrónica (los interlocutores coinciden en tiempo real: chat, telefonía, videoconferencia, mundos virtuales) y asincrónica (el intercambio ocurre en tiempo diferido: correo electrónico, foros, listas de distribución); y según la condición de los participantes, en simétrica (entre pares, con roles equivalentes) y asimétrica (entre impares, donde un polo concentra la emisión o el control, como la TV o un servidor de contenidos). Las combinaciones son cuatro y cada una tiene usos, ventajas y riesgos propios.</p>
<p>La comprensión de estos tipos es clave porque cada uno impone condiciones cognitivas y sociales distintas: lo sincrónico favorece la inmediatez y el vínculo pero exige coincidencia y suele empobrecer la reflexión; lo asincrónico permite la elaboración pausada y el registro, pero diluye la urgencia; lo simétrico distribuye la palabra; lo asimétrico la concentra. El Diseño Curricular espera que los estudiantes "manej en los tipos de comunicación dentro de una red (sincrónica y asincrónica)" (DC, 2010, p. 20) y sus orientaciones didácticas proponen expresamente la realización de videoconferencias mediante software VoIP como práctica comunicacional sincrónica (DC, 2010, p. 25), además del uso de foros para el trabajo colaborativo asincrónico.</p>
<p>Didácticamente, el contenido se trabaja experimentando los cuatro cuadrantes: organizar una comunicación sincrónica real (videoconferencia con otro curso, con un especialista o con otra escuela), una asincrónica (foro del aula virtual con consigna de debate), y analizar ejemplos simétricos (chat entre pares) y asimétricos (un canal de difusión). Luego se sistematiza: ¿qué tipo de comunicación sirve para cada tarea escolar?, ¿cuál elegimos y por qué? El objetivo final es que los estudiantes dejen de ser usuarios por defecto y pasen a ser selectores conscientes de modos comunicativos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La pandemia de 2020 convirtió este contenido en experiencia masiva: la educación argentina se sostuvo sobre comunicación asincrónica (aulas virtuales, correo) y sincrónica (videoconferencias) con desigualdades brutales según la conectividad de cada hogar; y la Ley 27.555 de Teletrabajo (2020) reguló el trabajo remoto, que se apoya exactamente en estos tipos de comunicación. El debate nacional resultante —derecho a la desconexión, fatiga de pantalla, brecha de acceso— demuestra que los tipos de comunicación en red no son categorías inocentes sino formas de vida que requieren regulación y enseñanza.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las escuelas bahienses vivieron esa transición en carne propia durante la pandemia, con clases por videoconferencia cuando la conectividad lo permitía y cuadernillos y mensajería asincrónica cuando no. Una propuesta situada: que los estudiantes reconstruyan la historia comunicacional de su propia escuela entre 2020 y 2022 (¿qué herramientas se usaron?, ¿sincrónicas o asincrónicas?, ¿quiénes quedaron afuera y por qué?) y diseñen un protocolo comunicacional del curso para situaciones de emergencia (qué canal sincrónico, qué canal asincrónico, qué responsabilidades), articulando comunicación, redes y ciudadanía digital.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.16 — Internet como resultado de la convergencia tecnológica</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Internet no fue inventada para vender, ni para conversar, ni para mirar videos: fue una red de investigación que terminó absorbiendo todas las funciones anteriores. Si la convergencia tecnológica hizo que una sola red sirviera para todo, ¿qué pasa cuando esa red única queda en manos de pocos? ¿Convergencia es progreso o es concentración con nombre elegante?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Internet es el resultado histórico de la convergencia de tres desarrollos: la microelectrónica (que hizo posible computadoras pequeñas y baratas), las telecomunicaciones (que aportaron los medios de transmisión) y la informática (que aportó los protocolos y el procesamiento digital), tal como lo plantea el propio Diseño Curricular al describir la convergencia de conectividad, interactividad e hipermedialidad como base de la expansión tecnológica actual (DC, 2010, p. 11). Nacida de ARPANET (1969), adoptó TCP/IP en 1983, se abrió al mundo académico con NSFNET y explotó comercialmente en los años 1990 con la World Wide Web, convirtiéndose en la infraestructura sobre la que hoy corren telefonía, televisión, comercio, Estado y sociabilidad.</p>
<p>La convergencia significa que redes antes independientes (teléfono, TV, correo, biblioteca, banco) se unificaron sobre la misma infraestructura digital de paquetes, y eso explica su poder y sus riesgos simultáneamente: la eficiencia y la innovación de tener una red universal, junto a la vulnerabilidad de depender de ella y la tendencia a la concentración de quienes la operan y de las plataformas que la habitan. El Diseño Curricular espera que los estudiantes "analicen el fenómeno de Internet como red mundial de información" (DC, 2010, p. 20), análisis que exige tanto la admiración técnica como la mirada crítica sobre la gobernanza y la economía de la red.</p>
<p>Didácticamente, el contenido se enseña con línea de tiempo y mapa: reconstruir los hitos (ARPANET, TCP/IP, web, web 2.0, móvil) y el crecimiento de usuarios, y luego aplicar la prueba de la convergencia: que los estudiantes listen diez actividades que antes requerían objetos o lugares distintos (enciclopedia, carta, teléfono, mapa, disco, cine, banco) y que hoy ocurren en la misma pantalla. El cierre debate: ¿quién gobierna Internet?, ¿hay un dueño?, ¿qué pasa si un país queda desconectado?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina se conectó progresivamente a Internet entre fines de los años 1980 y los 1990 (primero el ámbito académico y científico, luego el comercial), y el crecimiento del acceso fue de la mano de las políticas de telecomunicaciones de cada época; hoy la penetración es alta en términos de usuarios pero desigual en calidad, y el país participa de la gobernanza regional de Internet (LACNIC, foros de la región). La discusión argentina contemporánea —concentración de operadores, neutralidad de la red, servicio universal, tráfico que sale al exterior— es la aplicación local del fenómeno global que este contenido describe.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La historia de Internet también tiene capítulo bahiense: la ciudad se conectó en los años 1990 a través de los primeros proveedores locales y de las universidades (la UNS fue nodo temprano de las redes académicas argentinas), y hoy su tráfico viaja por los troncales nacionales que la vinculan con Buenos Aires. Reconstruir esa historia local con protagonistas (entrevistar a un técnico pionero de un ISP local o a un administrador de red universitario) y ubicar en un mapa los caminos actuales del tráfico bahiense convierte a Internet —abstracta y global— en una historia con nombres, lugares y decisiones locales.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.17 — Tecnología web</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> La web y la Internet no son lo mismo, aunque las usemos como sinónimos: una es la red de cables y protocolos; la otra, un invento de 1989 para compartir documentos con enlaces. Si la web fue inventada con un propósito y una ética (abierta, gratuita, universal), ¿qué queda de ese propósito cuando hoy casi toda la web vive dentro de plataformas privadas?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La tecnología web (World Wide Web, WWW) es el sistema de información hipertextual creado por Tim Berners-Lee en el CERN (1989-1991) que corre sobre Internet y se apoya en tres tecnologías fundamentales: HTML (el lenguaje de marcado que estructura las páginas), HTTP/HTTPS (el protocolo de transferencia entre navegador y servidor) y URL (el formato de direcciones que localiza cada recurso). La web convirtió a Internet en un espacio navegable por el público general: documentos enlazados entre sí (hipertexto, hipermedia) accesibles desde cualquier punto, realización práctica de las tres constantes del Diseño Curricular: conectividad, interactividad e hipermedialidad.</p>
<p>La evolución de la web es parte del contenido y anticipa el Módulo 3: de la web de documentos (1.0, lectura) a la web participativa y colaborativa (2.0, lectura-escritura: blogs, wikis, redes sociales) y a las proyecciones semánticas e inteligentes (3.0/4.0). El Diseño Curricular prescribe comprender las tecnologías web en el nivel principiante de sus tablas de intervención (DC, 2010, p. 28) y sus orientaciones didácticas incluyen la construcción de blogs, wikis y presentaciones con recursos web (DC, 2010, p. 25), es decir: la tecnología web se enseña usándola para producir, no solo para consumir.</p>
<p>Didácticamente, el contenido se trabaja abriendo el capó de la web: inspeccionar el código HTML de una página simple (el navegador lo permite), identificar la URL y el protocolo en la barra de direcciones, distinguir qué pide el navegador y qué responde el servidor. Luego se produce: crear una página HTML mínima del equipo (un título, un texto, una imagen, un enlace) y publicarla en el aula virtual. El salto conceptual es enorme: la web deja de ser un paisaje que se mira y se vuelve un texto que se escribe.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene historia web propia: NIC Argentina administra el dominio .ar desde los orígenes de la red en el país, los portales estatales nacionales (.gob.ar) fueron pioneros regionales de gobierno electrónico, y la producción de contenidos educativos digitales (Educ.ar, desde 2000) constituyó una política de Estado de contenidos web públicos. Al mismo tiempo, la mayor parte de la navegación argentina se concentra hoy en plataformas globales privadas, lo que reabre la pregunta del contenido: ¿web abierta o plataformas cerradas? La respuesta define qué datos producimos y quién los capitaliza.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca tiene su propia capa web: el portal municipal con información y trámites en línea, los sitios de los medios locales, los portales de la UNS y la UTN, y decenas de sitios de comercios, clubes y organizaciones barriales. Una propuesta potente: relevar con los estudiantes diez sitios web bahienses, analizar su estructura (¿usan HTTPS?, ¿son accesibles desde el celular?, ¿quién los produce?) y producir en el curso una página web simple sobre un tema local (historia del barrio, guía de espacios culturales), publicada con recursos gratuitos: escribir la web local es la forma más directa de apropiarse de la tecnología web.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.18 — Cloud computing (Software como servicio en la red)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando usamos "la nube", ¿nuestros archivos están en el aire o están en la computadora de alguien? Si el software ya no se instala sino que se alquila, y los documentos ya no se guardan sino que se depositan, ¿qué pasa con nuestra autonomía cuando ese alguien cambia las reglas, sube el precio o simplemente borra la cuenta?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El cloud computing (computación en la nube) es un modelo en el que los recursos informáticos —software, almacenamiento, procesamiento— se ofrecen como servicios a través de la red, sin que el usuario administre la infraestructura física. Sus modelos clásicos son IaaS (infraestructura como servicio: servidores virtuales), PaaS (plataforma como servicio: entornos de desarrollo) y SaaS (software como servicio: aplicaciones listas para usar, como el correo webmail, los editores de documentos en línea y las plataformas de video), que es el que los estudiantes usan cotidianamente sin nombrar.</p>
<p>Las ventajas del modelo explican su expansión: acceso desde cualquier dispositivo, colaboración simultánea, actualización automática, ahorro de infraestructura local. Sus riesgos son igualmente reales y deben enseñarse: dependencia del proveedor (si el servicio cierra o bloquea la cuenta, se pierde el acceso a los propios datos), privacidad (los datos se procesan en servidores de terceros, posiblemente en otros países), continuidad (caídas del servicio) y condiciones de uso que el usuario rara vez lee. El Diseño Curricular lo incorpora explícitamente como contenido (DC, 2010, p. 20), anticipando un debate que hoy es central en la agenda digital mundial.</p>
<p>Didácticamente, el contenido se trabaja con una auditoría de la propia nube: que los estudiantes listen todos los servicios en la nube que usan (correo, almacenamiento, documentos, streaming, juegos), identifiquen qué datos depositan en cada uno, dónde dice el contrato que se alojan y qué pasa si la cuenta se cierra. Luego se compara: la misma tarea (escribir un documento colaborativo) realizada con software instalado localmente y con un servicio en línea, discutiendo ventajas y riesgos de cada opción. La conclusión esperada no es "nube sí" o "nube no" sino criterio.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino enfrenta la decisión estratégica de dónde procesa y aloja sus datos: organismos migraron servicios a nubes extranjeras mientras se desarrollan alternativas públicas (data centers estatales, servicios de ARSAT) para retener información sensible bajo jurisdicción nacional; el debate sobre "nube soberana" atraviesa a las provincias y a las universidades. Para los estudiantes, la lección es directa: cuando un trabajo escolar se entrega en una plataforma extranjera, los datos salen del país; comprender el cloud computing es comprender la geografía oculta de sus propios archivos.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca la nube convive con infraestructura local: el municipio, la UNS y empresas de la ciudad operan servidores propios para sistemas críticos mientras usan servicios en la nube para funciones accesorias, y las escuelas dependen cotidianamente de plataformas en línea para correo, aulas virtuales y documentos. Proponer a los estudiantes diseñar una política de almacenamiento del curso —qué se guarda en la nube y qué se respalda localmente, en qué servicio, con qué cuenta, con qué contraseña— aplica el contenido a la práctica escolar real y entrena el criterio de soberanía de datos a escala del aula.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.19 — Almacenamiento virtual en la red (webstoring)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Cuántas copias de tus trabajos existen y dónde viven? Si un archivo solo está en un pendrive, es frágil; si solo está en una nube extranjera, es ajeno. ¿Cuál es la estrategia de resguardo de una generación que produce más información que ninguna y piensa menos que ninguna en conservarla?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El almacenamiento virtual en la red (webstoring) designa los servicios que permiten guardar archivos en servidores remotos accesibles por Internet: discos virtuales (con espacio gratuito o pago), sincronización entre dispositivos, compartición por enlaces y trabajo colaborativo sobre los mismos archivos. Sus funciones típicas incluyen subir/descargar, versionado (historial de cambios), sincronización automática y permisos de acceso. El contenido prolonga la administración de recursos compartidos (2.13) y el cloud computing (2.18) poniendo el foco en los datos del estudiante como objeto de cuidado.</p>
<p>La enseñanza del webstoring debe incluir criterios de selección que el Diseño Curricular exige transversalmente (justificar la elección de herramientas según eficiencia y efectividad, DC, 2010, p. 30): capacidad disponible, límite de tamaño por archivo, seguridad (cifrado, autenticación en dos pasos), políticas de privacidad y jurisdicción del proveedor, posibilidades de trabajo colaborativo y plan de contingencia (¿qué pasa si pierdo la contraseña?). La regla de oro del resguardo —múltiples copias, en soportes distintos, una de ellas fuera del lugar de origen— puede enseñarse aquí como política personal de datos.</p>
<p>Didácticamente, el contenido se trabaja con el plan de resguardo del curso: crear una estructura de almacenamiento virtual para los trabajos del año (carpeta por equipo, carpeta de entregas), establecer convenciones de nombres de archivo y versiones, probar la recuperación de un archivo borrado y documentar el procedimiento. El Diseño Curricular insiste en sistematizar el resguardo de archivos como habilidad del nivel avanzado (DC, 2010, p. 26): un curso que termina el año con su archivo digital organizado, versionado y respaldado ha aprendido el contenido en el único sentido que importa.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La conservación de la información es un problema nacional: archivos estatales, judiciales, periodísticos y culturales argentinos viven hoy en servicios de almacenamiento de empresas extranjeras, y la Ley 25.326 protege los datos personales allí depositados sin poder garantizar siempre su localización física. Los programas de preservación digital de bibliotecas y universidades públicas discuten exactamente lo que este contenido introduce: copias múltiples, formatos abiertos, jurisdicción. Enseñar webstoring con esa profundidad es formar custodios conscientes de la memoria digital propia y colectiva.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La experiencia reciente de Bahía Blanca —con episodios climáticos graves que afectaron instituciones y hogares— vuelve este contenido dramáticamente concreto: ¿qué pasa con los documentos de una escuela, una biblioteca o una familia cuando el agua arruina los equipos? Proponer a los estudiantes un relevamiento del riesgo digital de su escuela (qué información importante existe, dónde está guardada, qué copias hay, qué se perdería en un siniestro) y un plan de resguardo viable con herramientas gratuitas convierte el webstoring en una política de protección civil a escala escolar.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.20 — Software portable (portable apps)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué la mayoría del software exige instalarse, pedir permisos y dejar huellas en la máquina, y otro software puede viajar en un pendrive y ejecutarse sin tocar nada? ¿Qué libertades recupera un usuario que lleva sus herramientas consigo en lugar de depender de las máquinas que encuentra?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El software portable es aquel que puede ejecutarse sin instalación formal: se transporta en un pendrive u otro soporte, corre directamente sobre el sistema operativo anfitrión, guarda su configuración junto a sus archivos y no deja rastros significativos en la máquina que lo ejecuta. Sus ventajas son la portabilidad real (las herramientas y los documentos viajan juntos), la compatibilidad con equipos ajenos o restringidos (donde no se puede instalar nada) y la higiene del sistema; sus límites son el rendimiento (algunas aplicaciones requieren integración profunda), la actualización manual y la necesidad de verificar la legitimidad y seguridad de cada descargable.</p>
<p>El contenido tiene una relevancia escolar específica: en muchas aulas de informática los estudiantes no tienen permisos de administración para instalar software, y el software portable (editores de texto e imagen, mapas conceptuales, reproductores, utilidades) resuelve esa restricción sin violarla, enseñando de paso la diferencia entre usuario estándar y administrador que viene del Módulo 1. También anticipa el concepto de libertad de herramientas del Módulo 7: elegir formatos y programas que no aten los propios datos a una máquina ni a una licencia.</p>
<p>Didácticamente, el contenido se trabaja construyendo el pendrive-herramienta del curso: cada equipo selecciona, descarga (de fuentes legítimas), prueba y organiza un conjunto de aplicaciones portables necesarias para los proyectos del año (editor de imágenes, CmapTools o similar para mapas conceptuales, un editor de texto), documentando qué hace cada una y por qué fue elegida —justificación de herramientas, criterio de evaluación prescripto por el Diseño Curricular (DC, 2010, p. 30). El producto es real: una caja de herramientas digital que acompaña al estudiante todo el año.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> El software portable tuvo su momento de gloria inclusiva en Argentina durante los programas de inclusión digital: en netbooks escolares con permisos restringidos o con sistemas dualizados, las aplicaciones portables permitieron llevar herramientas educativas sin alterar la configuración institucional, y muchas colecciones de software educativo circularon en pendrives por escuelas de todo el país. Ese uso masivo demostró que la portabilidad no es una comodidad técnica menor sino una estrategia de acceso cuando la infraestructura es escasa, compartida o bloqueada.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las escuelas bahienses, donde el equipamiento informático es compartido y heterogéneo (aulas de informática con distintos sistemas, netbooks de distintos planes, computadoras de bibliotecas y clubes), el pendrive con software portable es una solución concreta y replicable. La propuesta de construir una caja de herramientas portable institucional —seleccionada, documentada y distribuida por el propio curso para toda la escuela— resuelve un problema real de la comunidad educativa y demuestra que la apropiación tecnológica también es organización colectiva de recursos escasos.</div>
</div>`;

<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.21 — Conceptos de Internet: página web, sitios, portal, campos virtuales</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Por qué llamamos igual a cosas distintas: una página, un sitio, un portal, un campus? Si un estudiante no distingue una página de un portal, ¿puede saber dónde está parado, quién lo aloja y qué intereses gobiernan el lugar que habita? Nombrar bien la red, ¿no es la primera forma de no perderse en ella?</div>

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.22 — Navegadores de Internet (características y funciones)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> El navegador es la ventana por la que miramos casi todo el mundo digital, pero ¿quién mira también a través de él? Si el navegador guarda historial, guarda contraseñas, recuerda preferencias y sugiere contenidos, ¿es una herramienta neutral o un testigo permanente que sabe de nosotros más que cualquier diario íntimo?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Un navegador es el programa que permite acceder a la web: solicita los recursos mediante HTTP/HTTPS, interpreta el HTML y los lenguajes asociados, y los muestra como páginas interactivas. Sus funciones esenciales incluyen la barra de direcciones (URL), las pestañas (varios sitios simultáneos), el historial de navegación, los favoritos o marcadores, el gestor de descargas, el almacenamiento de credenciales, las opciones de privacidad (borrado de datos, navegación privada) y las extensiones o complementos. El Diseño Curricular ubica su dominio en el nivel principiante: "Utilizar distintos navegadores y páginas web... Organizar el menú Favoritos. Guardar direcciones web" (DC, 2010, p. 28).</p>
<p>La historia de los navegadores (de los pioneros de los años 1990 a los actuales motores de código abierto) es una historia de estándares y de competencia por la puerta de entrada a Internet, y su enseñanza debe incluir la dimensión de seguridad y privacidad: la diferencia entre HTTP y HTTPS (el candado de la conexión cifrada), qué significa que un sitio pida permisos, qué registra el historial, qué son las cookies y por qué conviene gestionarlas. Las tablas del Diseño incorporan explícitamente "reconocer los riesgos de los datos y la información en una conexión a Internet" como contenido del nivel intermedio (DC, 2010, p. 28): el navegador es el lugar natural de esa enseñanza.</p>
<p>Didácticamente, el contenido se trabaja con una clínica de navegadores: comparar dos o tres navegadores disponibles en las máquinas de la escuela (interfaz, velocidad percibida, organización de favoritos), practicar la gestión consciente de favoritos (crear carpetas temáticas ligadas al proyecto del curso), inspeccionar el historial y las cookies propias para descubrir qué rastros deja la navegación, y verificar el candado HTTPS en sitios reales. El cierre es una pregunta de ciudadanía: ¿qué sabe de mí mi navegador, quién más puede saberlo, y qué puedo hacer al respecto?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El debate sobre privacidad de la navegación tiene marco legal argentino: la Ley 25.326 de protección de datos personales obliga a informar el uso de datos, y los organismos públicos han ido incorporando sitios con HTTPS como estándar de confianza para el ciudadano. Para el sistema educativo, la alfabetización en privacidad desde la escuela secundaria es una política preventiva frente a riesgos concretos (robo de identidad, rastreo publicitario de menores), expresamente previstos en los objetivos de enseñanza del Diseño Curricular (DC, 2010, p. 15). Enseñar a usar el navegador es enseñar a cuidar la propia identidad en línea.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las aulas bahienses la clínica de navegadores puede completarse con material local: verificar cuáles sitios de la ciudad (municipio, medios, comercios, escuelas) usan HTTPS y cuáles no, organizar los favoritos del curso como biblioteca web bahiense (instituciones, cultura, trámites, medios) y discutir qué información personal pide cada sitio local al registrarse. El producto —favoritos organizados, heredables al curso siguiente y publicados en el blog— convierte una competencia técnica básica en un bien comunitario de la escuela.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.23 — Formato de una dirección electrónica web</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cada dirección web es un mapa con instrucciones precisas: protocolo, dominio, camino. Si los estudiantes copian y pegan URLs todos los días sin leerlas, ¿cuántos engaños se tragan por no saber leer una dirección? ¿Qué puede esconderse entre un dominio legítimo y uno que lo imita por una sola letra?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La dirección electrónica web (URL) tiene una estructura canónica que debe enseñarse pieza por pieza: protocolo (http o https, que indica cómo se solicita el recurso y si la conexión viaja cifrada), subdominio (por ejemplo www, aunque puede ser cualquier otro, como aula), dominio (el nombre registrado, compuesto por un nombre elegido y una terminación o TLD: .com, .org, .net, o códigos de país como .ar), ruta (la carpeta dentro del servidor) y nombre del archivo o recurso. Leer una URL de derecha a izquierda revela la jerarquía: la terminación dice el tipo o país de la organización; el nombre dice quién es; el subdominio y la ruta dicen dónde dentro de esa organización está el recurso.</p>
<p>El sistema de nombres de dominio (DNS) traduce esos nombres legibles a direcciones IP numéricas, y su gobernanza es jerárquica: los dominios de país los administran organizaciones nacionales, y debajo de ellos se registran dominios de segundo nivel (.com.ar, .edu.ar, .gob.ar, .org.ar). Esta arquitectura explica por qué una dirección .gob.ar identifica a un organismo del Estado argentino o una .edu.ar a una institución educativa, y convierte a la URL en una credencial que puede verificarse: saber leer direcciones es la primera defensa contra el phishing, que vive precisamente de imitar dominios legítimos.</p>
<p>Didácticamente, el contenido se trabaja con disección de URLs reales: tomar las direcciones que los estudiantes usan (redes, juegos, escuela), desarmarlas en sus componentes y clasificar los dominios por tipo y país; luego, el ejercicio de seguridad: comparar pares de direcciones casi idénticas (una legítima y una falsificada) y descubrir la diferencia. El Diseño Curricular espera que los estudiantes "comprendan y utilicen: navegadores, buscadores y correo electrónico" (DC, 2010, p. 28), y la lectura competente de la URL es el mínimo común denominador de esas tres competencias.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina administra su propio espacio de nombres: NIC Argentina registra y regula los dominios .ar, con reglas específicas para los dominios institucionales (.gob.ar para el Estado, .edu.ar para instituciones educativas, .org.ar para organizaciones), lo que permite a cualquier ciudadano verificar la naturaleza argentina e institucional de un sitio leyendo su terminación. Esa infraestructura de nombres es soberanía cotidiana e invisible: cada vez que un estudiante escribe .edu.ar está usando un recurso administrado en el país. Conocerlo convierte la barra de direcciones en un instrumento de verificación de legitimidad.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El catálogo de dominios bahienses es un ejercicio inmediato: identificar las direcciones del municipio, de la UNS, de la UTN, de las escuelas, de los medios y de los clubes locales, desarmar cada URL, clasificar las terminaciones y detectar qué organizaciones locales usan .com.ar, cuáles .org.ar y cuáles .gob.ar o .edu.ar. Con ese material se puede construir el verificador ciudadano del curso: una guía para reconocer sitios institucionales legítimos de Bahía Blanca y sus imitaciones, publicable en el blog escolar como servicio de seguridad digital para la comunidad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.24 — Cuentas de correo en servidores web mail</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Una cuenta de correo es la llave maestra de la vida digital: con ella se recuperan contraseñas, se verifican identidades, se firman trámites. Si la cuenta es tan importante, ¿por qué la protegemos con la contraseña más débil que conocemos? ¿Y qué pasa con la identidad digital de un estudiante cuando esa cuenta pertenece a un proveedor que puede cerrarla sin explicaciones?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El webmail es el servicio de correo electrónico accesible desde el navegador, sin configurar programas clientes: el proveedor aloja la casilla en sus servidores y ofrece una interfaz web para leer, enviar y administrar mensajes. Una cuenta se compone de un nombre de usuario, el símbolo @, el dominio del proveedor y una contraseña, y suele incluir almacenamiento de mensajes y adjuntos, libreta de contactos, filtros y opciones de recuperación. El Diseño Curricular incorpora el contenido explícitamente (DC, 2010, p. 20) y sus tablas ubican en el nivel principiante "recibir y enviar mensajes, administrar mensajes, administrar adjuntos" (DC, 2010, p. 28).</p>
<p>La enseñanza debe cubrir tres planos: el operativo (crear la cuenta, configurar los datos de recuperación, redactar, responder, adjuntar, organizar carpetas, usar la libreta); el seguridad (contraseñas robustas, autenticación en dos pasos si está disponible, no compartir credenciales, desconfiar de correos que piden datos) y el ciudadano (la cuenta como identidad digital: qué dirección es apropiada para postularse a un trabajo o comunicarse con una institución, qué huella deja cada correo, qué dice de nosotros el proveedor que elegimos). El Diseño Curricular exige enseñar reglas de etiqueta digital y el uso seguro de la información (DC, 2010, p. 15), contenidos que aquí encuentran su escenario natural.</p>
<p>Didácticamente, el contenido se trabaja creando y auditando la cuenta: cada estudiante verifica o crea una cuenta (respetando las condiciones de edad de los proveedores), completa correctamente los datos de recuperación, prueba el envío y recepción de un adjunto dentro del curso y elabora su protocolo personal de contraseña segura. Luego se analiza la dimensión institucional: ¿qué cuenta corresponde usar en cada contexto (personal, escolar, formal)? El cierre conecta con la autonomía: ¿qué datos nuestros conserva el proveedor de la casilla, dónde están sus servidores, bajo qué leyes?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> En el sistema educativo bonaerense la identidad digital institucional tiene casa propia: la DGCyE provee cuentas de correo oficiales con dominio institucional (@abc.gob.ar) para docentes y estudiantes, parte de la infraestructura de identidad digital de la Provincia, y durante la pandemia esas cuentas y las plataformas asociadas fueron el canal formal de la continuidad pedagógica. Enseñar cuentas de correo en una escuela pública bonaerense incluye, por tanto, enseñar a usar la cuenta institucional, distinguir la identidad personal de la institucional y comprender que el Estado también es proveedor de identidad digital.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las escuelas secundarias bahienses, la gestión de la cuenta institucional @abc.gob.ar (activación, recuperación de contraseña, uso para trámites y comunicación oficial) es una necesidad concreta de estudiantes y docentes, y la materia NTICx es el lugar natural para enseñarla con profundidad. Una propuesta situada: realizar en clase un taller de identidad digital donde cada estudiante active o audite su cuenta institucional, configure la recuperación, practique el envío formal a un destinatario real (preceptor, biblioteca, cooperativa escolar) y documente el protocolo de uso responsable para el curso.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 2.25 — Correo electrónico</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> El correo electrónico tiene más años que la web y sigue siendo el sistema nervioso del mundo laboral, académico y estatal. ¿Por qué sobrevive a todas las apps que lo declararon muerto? Y al revés: si un mensaje puede falsificarse, reenviarse sin permiso y llegar a miles por error, ¿sabemos realmente qué responsabilidad legal y ética viaja en cada "Enviar"?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El correo electrónico es el servicio de mensajería asíncrona de Internet: funciona sobre protocolos específicos (SMTP para el envío, POP/IMAP para la recepción) y permite enviar mensajes con asunto, cuerpo y archivos adjuntos a uno o varios destinatarios. Su estructura tiene componentes formales que deben enseñarse: campos Para, CC y CCO (y las diferencias de privacidad entre ellos), asunto, firma, adjuntos y citas al responder. El Diseño Curricular lo incluye tanto en el Módulo 2 como en la organización de la información de la web (Módulo 3, DC, 2010, pp. 20, 20), y sus tablas de comunicación prescriben administrar mensajes y adjuntos como piso mínimo (DC, 2010, p. 28).</p>
<p>La dimensión crítica del contenido abarca tres frentes. El de seguridad: el correo es el principal vector de phishing y malware (adjuntos falsos, enlaces engañosos, suplantación de remitente), y el Módulo 1 ya instaló los conceptos de amenaza que aquí se aplican. El de privacidad: lo enviado deja de estar bajo control exclusivo (puede reenviarse, capturarse, archivarse), y el uso del CCO protege a los destinatarios entre sí. Y el de etiqueta digital: el Diseño Curricular prescribe expresamente enseñar reglas de netiquette para las interacciones sociales mediadas por tecnología (DC, 2010, p. 15), y el correo es el género donde esas reglas se aprenden con consecuencias reales.</p>
<p>Didácticamente, el contenido se trabaja con práctica comunicacional auténtica: redactar y enviar correos con destinatarios y propósitos distintos (un pedido formal a la biblioteca escolar, una consulta a un docente, un mensaje de coordinación del equipo), usando correctamente CC/CCO y adjuntos, y luego analizar colectivamente los borradores: ¿el asunto informa?, ¿el registro es adecuado?, ¿los adjuntos pesan lo que el destinatario puede recibir? El cierre es un simulacro de seguridad: presentar un correo de phishing real (anonimizado) y que el curso lo diseccione buscando las marcas de falsedad. Con eso, el Módulo 2 cierra donde debe: en la ciudadanía digital.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> El correo electrónico es la columna formal del Estado y del trabajo argentinos: notificaciones oficiales, trámites, comunicaciones laborales y académicas tienen validez por este canal, y la Justicia y los organismos públicos han reglamentado comunicaciones electrónicas con valor legal. Al mismo tiempo, los incidentes de suplantación y fraude por correo crecen año a año en el país, y las campañas nacionales de concientización en ciberseguridad insisten en el correo como primer punto de defensa. Formar estudiantes que escriben bien, protegen su casilla y detectan engaños por correo es una política preventiva concreta.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En la vida institucional bahiense el correo es ubicuo: comunicación entre escuelas y la Jefatura Distrital, trámites municipales, turnos de salud, inscripción universitaria en la UNS y la UTN, gestiones de clubes y organizaciones. Una propuesta de cierre del módulo: que cada equipo redacte un correo formal real a una institución local (biblioteca popular, museo, club de barrio) solicitando información para el proyecto del curso, aplicando estructura, registro, firma y protección de datos de terceros; las respuestas recibidas se analizan en clase como evidencia de que la red, bien usada, conecta realmente a la escuela con su ciudad.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.1 — Digitalización de la información (Gestión, archivo y flujo)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si digitalizar es traducir el mundo a ceros y unos, ¿quién decide qué parte del mundo merece ser traducida y archivada, y qué parte se deja deliberadamente en el olvido analógico? ¿La digitalización preserva la memoria o la formatea según los intereses de quien controla el servidor?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La digitalización de la información, en el marco del manejo de datos, excede la mera conversión de soportes (de papel a PDF, de cinta a MP3) para constituirse en un proceso de gestión del ciclo de vida del dato: captura, indexación, almacenamiento, preservación y recuperación. Un documento digitalizado sin metadatos (datos sobre los datos: autor, fecha, formato, derechos, contexto) es un objeto huérfano, irrecuperable en la superabundancia de la red. La enseñanza de este contenido exige comprender que la memoria digital es frágil: la obsolescencia de los formatos y la degradación de los soportes magnéticos u ópticos plantean el desafío de la "preservación digital" a largo plazo, un problema que las instituciones recién comienzan a resolver mediante migraciones periódicas y emulación de entornos.</p>
<p>Didácticamente, el contenido se aborda mediante la auditoría de la memoria personal y escolar: los estudiantes deben rastrear información antigua (trabajos de años anteriores, fotos familiares, documentos institucionales) y evaluar su estado de conservación digital. Se introduce la creación de metadatos y la estructuración de carpetas lógicas, vinculando este módulo con las competencias de administración de recursos aprendidas en el Módulo 2. La pregunta ética central es la selección: en un mundo donde almacenar es barato pero indexar y curar es caro, ¿qué borramos y por qué?</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El Estado argentino enfrenta el desafío colosal de digitalizar su memoria histórica y administrativa. El Archivo General de la Nación y los archivos provinciales llevan adelante planes de digitalización que no solo buscan ahorrar espacio físico, sino garantizar el derecho de acceso a la información pública y la transparencia del Estado. Sin embargo, la falta de políticas uniformes de preservación digital pone en riesgo décadas de producción cultural y administrativa. Enseñar gestión de la información es enseñar a cuidar el patrimonio documental de la nación.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca posee un rico acervo documental en proceso de digitalización: el Archivo Histórico Municipal, la hemeroteca del diario La Nueva Provincia (cuyas ediciones históricas son fundamentales para la identidad local) y los archivos de instituciones fundacionales. Proponer a los estudiantes un proyecto de "curaduría digital local" —donde seleccionen, digitalicen (usando escáneres o celulares), metadaten y suban a un repositorio escolar o wiki local un conjunto de documentos, fotos o planos antiguos de su barrio— convierte la teoría de la gestión de la información en un acto concreto de preservación de la memoria bahiense.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.2 — Organización de la información en la web: WWW, HTML, HTTP, hipertexto, hipermedia, hipervínculo, correo, chat, podcast, RSS</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el hipertexto rompió la linealidad del libro para permitirnos saltar de un tema a otro, ¿por qué hoy sentimos que la web no nos libera, sino que nos atrapa en un laberinto de pestañas abiertas y distracciones infinitas? ¿El hipervínculo es una herramienta de conocimiento o un mecanismo de retención de atención?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La World Wide Web (WWW) organiza la información mediante una arquitectura basada en tres pilares: el lenguaje de marcado HTML (que da estructura semántica al texto: títulos, párrafos, enlaces), el protocolo HTTP/HTTPS (que rige la petición y entrega de recursos entre cliente y servidor) y el hipervínculo (el enlace que conecta nodos de información, rompiendo la linealidad tradicional). Esta estructura evoluciona hacia la hipermedia cuando los nodos enlazados no son solo texto, sino imágenes, audios y videos. Formatos y protocolos como el RSS (Really Simple Syndication) permiten la sindicación de contenidos (recibir actualizaciones automáticamente sin visitar el sitio), y el podcast democratiza la distribución de audio bajo demanda, mientras que el chat y el correo electrónico (vistos en el Módulo 2) operan como capas de comunicación sobre esta infraestructura documental.</p>
<p>La comprensión de esta arquitectura es vital para que el estudiante deje de ser un "navegante pasivo" y comprenda cómo se teje la red. Didácticamente, se recomienda la actividad de "disección de la web": utilizar la herramienta "Inspeccionar elemento" del navegador para ver el código HTML subyacente a una página de noticias local, identificar las etiquetas <a href> (hipervínculos) y modificarlas temporalmente en el navegador para ver cómo se altera la estructura de la información. Esto desnaturaliza la interfaz gráfica y revela la naturaleza programada y construida de la web.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La organización de la información en los portales del Estado argentino (.gob.ar) ha evolucionado desde sitios estáticos en HTML puro hacia arquitecturas complejas que deben cumplir con estándares de accesibilidad (Ley 26.653) y usabilidad. La forma en que el Estado organiza sus trámites, leyes y datos abiertos en la web define la calidad de la democracia digital. Un sitio mal estructurado, con hipervínculos rotos o información no sindicable, es una barrera burocrática digital que excluye al ciudadano.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes pueden analizar la arquitectura de la información de los portales locales: el sitio web de la Municipalidad de Bahía Blanca, el portal de la UNS o los sitios de los medios locales. ¿Cómo organizan la información? ¿Es fácil encontrar un trámite o una noticia de hace un año? ¿Usan RSS para que los ciudadanos sigan las novedades? El ejercicio de mapear el hipertexto de un sitio bahiense (dibujando cómo se enlazan sus secciones) revela las prioridades informativas de las instituciones locales y entrena la mirada crítica sobre el diseño de la información.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.3 — Buscadores de información en Internet: buscadores, metabuscadores, operadores booleanos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si los buscadores no buscan en Internet en tiempo real, sino en su propio índice privado construido por algoritmos que priorizan la popularidad y la pauta publicitaria, ¿estamos investigando la realidad o estamos consumiendo el ranking de intereses de una corporación extranjera?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los buscadores (como Google, Bing, DuckDuckGo) no exploran la web en el momento de la consulta; utilizan "arañas" (crawlers) que indexan previamente miles de millones de páginas en bases de datos gigantescas, y luego aplican algoritmos de relevancia (como el PageRank original, que ponderaba los enlaces entrantes como "votos" de autoridad) para ordenar los resultados. Los metabuscadores (como Dogpile o Searx) no tienen índice propio, sino que consultan simultáneamente varios buscadores y agregan los resultados. Para recuperar información pertinente en este océano indexado, es imperativo el dominio de los operadores booleanos y avanzados: AND, OR, NOT (o el signo -), comillas "" para búsqueda de frase exacta, site: para limitar a un dominio, y filetype: para buscar formatos específicos (como PDFs de informes técnicos).</p>
<p>El Diseño Curricular exige que los estudiantes "desarrollen habilidades y capacidades para localizar, analizar, evaluar, sintetizar y usar la información en forma pertinente" (DC, 2010, p. 21). Didácticamente, esto se logra mediante campeonatos de búsqueda (Search Races) y la resolución de WebQuests complejas donde la búsqueda simple ("cambio climático") es inútil y se requiere búsqueda avanzada ("cambio climático" site:uns.edu.ar filetype:pdf -wikipedia). El estudiante debe comprender que la primera página de resultados no es "la verdad", sino el producto de una arquitectura de visibilidad que puede y debe ser hackeada mediante operadores lógicos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La dependencia de los buscadores comerciales globales tiene implicancias geopolíticas y culturales para Argentina: la visibilidad de la producción científica nacional, las noticias locales y los comercios pymes depende de cómo los algoritmos de Silicon Valley indexen el contenido en español y, específicamente, el contenido argentino. El debate sobre la "soberanía algorítmica" y la regulación de la transparencia de los algoritmos de búsqueda y recomendación es incipiente en el país, pero crucial para garantizar la diversidad informativa.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Para un emprendedor o estudiante bahiense, entender los buscadores es entender cómo se hace visible la ciudad en el mundo. Una actividad situada consiste en buscar "Polo Petroquímico Bahía Blanca" o "Turismo en Sierra de la Ventana" y analizar qué resultados aparecen primero: ¿son sitios oficiales, notas de diarios locales, o contenido patrocinado y desactualizado? Enseñar a los estudiantes a usar site:bahia.gob.ar o a evaluar por qué ciertos comercios locales no aparecen en el mapa o en los primeros resultados los convierte en analistas de la economía de la atención local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.4 — Folcsonomía o marcadores sociales (Del.icio.us, almacenamiento, clasificación, enlaces compartidos, intoxicación)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Cuando etiquetamos (taggeamos) la información con nuestras propias palabras en lugar de usar categorías científicas rígidas, ¿estamos democratizando el conocimiento o estamos creando un caos semántico donde la "intoxicación" de etiquetas falsas hace imposible encontrar la verdad?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La folcsonomía (término acuñado por Thomas Vander Wal) es el sistema de clasificación colaborativo y emergente que surge cuando los usuarios etiquetan libremente contenidos con palabras clave (tags), a diferencia de la taxonomía tradicional, que es jerárquica, rígida y definida por expertos (como la clasificación decimal de las bibliotecas). Los marcadores sociales (históricamente representados por Del.icio.us, y hoy evolucionados en los hashtags de redes sociales, Pinterest o los guardados de TikTok) permiten almacenar, clasificar y compartir enlaces en la nube. La ventaja es la adaptabilidad y la inteligencia colectiva; el riesgo es la intoxicación informacional: el uso masivo de etiquetas populares pero falsas o engañosas (tag stuffing) para posicionar spam o desinformación en las búsquedas.</p>
<p>Didácticamente, el concepto se enseña comparando la búsqueda de un libro en el catálogo Dewey de la biblioteca escolar (taxonomía) con la búsqueda de ese mismo libro en Goodreads o mediante hashtags en Twitter/X (folcsonomía). Los estudiantes deben crear su propio sistema de marcadores sociales para el proyecto anual de la materia, acordando un vocabulario controlado (etiquetas compartidas) para evitar la intoxicación interna del grupo, experimentando así los desafíos de la gestión del conocimiento colaborativo.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La folcsonomía ha redefinido la acción política y social en Argentina: los movimientos de masas contemporáneos no se organizan bajo manifiestos taxonómicos, sino bajo hashtags (#NiUnaMenos, #YoNoTeBanco, #SialAborto). Estas etiquetas funcionan como marcadores sociales aglutinantes que permiten medir la temperatura social, pero también son campos de batalla donde actores políticos y bots intoxican las tendencias (trending topics) para manipular la percepción de la opinión pública. Comprender la folcsonomía es comprender la nueva ágora pública argentina.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La memoria y la actualidad bahiense se organizan cotidianamente mediante folcsonomías en redes sociales: etiquetas como #BahiaBlanca, #BBLluvias (para seguir el clima y los cortes de calles), #FiestaNacional (para la Fiesta Nacional del Mayo) o etiquetas de reclamos vecinales. Proponer a los estudiantes que rastreen y analicen un hashtag local durante una semana, identificando cómo la comunidad etiqueta los problemas (ej. baches, cortes de luz) y cómo los medios locales o el municipio intentan "limpiar" o redirigir esas etiquetas, es un ejercicio brillante de sociología digital aplicada al territorio.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.5 — Cibercultura</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿La cibercultura es una "subcultura" de los jóvenes que viven frente a las pantallas, o es la cultura hegemónica de nuestra época que ha subordinado y reformateado a todas las demás formas de vivir, amar, trabajar y morir?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La cibercultura no es solo el uso de herramientas digitales, sino el conjunto de prácticas, valores, formas de sociabilidad y subjetividades que emergen de la interconexión global en redes digitales. Autores como Pierre Lévy hablan de la "inteligencia colectiva" y la desterritorialización de las comunidades. La cibercultura modifica nuestra percepción del tiempo (la inmediatez, el tiempo real), del espacio (la ubicuidad, el teletrabajo), de la identidad (los avatares, las múltiples cuentas, la curaduría del yo en redes) y de la autoridad (la crisis de los saberes institucionales frente a la Wikipedia y los influencers).</p>
<p>El Diseño Curricular exige analizar los nuevos escenarios culturales que experimentan los jóvenes (DC, 2010, p. 10). Didácticamente, esto requiere abandonar la demonización o la idealización de la tecnología para pasar al análisis etnográfico del propio grupo: ¿cómo se resuelven los conflictos de pareja por WhatsApp? ¿Qué significa "estar presente" en una videollamada familiar o en un juego multijugador? ¿Cómo se construye el prestigio entre pares en TikTok o Instagram? La cibercultura se enseña haciendo que los estudiantes se observen a sí mismos como nativos de este ecosistema, identificando sus reglas no escritas.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina ha producido y consumido cibercultura de manera masiva y creativa: desde la explosión de los cibercafés y los blogs en los 2000, hasta la adopción temprana de redes sociales (Argentina fue durante años uno de los países con mayor penetración de Facebook y Twitter en la región) y la cultura del meme como herramienta de sátira política y resistencia. La cibercultura argentina tiene un fuerte componente de apropiación popular y "viveza criolla" digital (el comercio informal por Mercado Libre o Facebook Marketplace, las cadenas de WhatsApp, los grupos de compra-venta barriales).</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> La cibercultura bahiense tiene matices propios: la fuerte presencia de grupos de Facebook de "Compra/Venta Bahía Blanca" o "Mascotas Perdidas Bahía Blanca" que funcionan como redes de solidaridad y economía informal; los colectivos de arte independiente, teatro y música que migraron su gestión y difusión a Instagram; y las comunidades de gamers o programadores locales que se organizan en Discord. Mapear estos "territorios digitales" bahienses permite a los estudiantes entender que su ciudad no termina en el cartel de rutas, sino que se extiende en servidores y grupos de chat que tienen sus propias leyes y dinámicas.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 3.6 — Sociedad red</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la "sociedad red" se organiza en nodos y flujos de capital e información, ¿qué destino le espera a quien no es nodo ni flujo, sino el "desconectado" que el sistema simplemente ignora y deja fuera del mapa? ¿La exclusión social hoy es, fundamentalmente, una desconexión de la red?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El sociólogo Manuel Castells define la sociedad red como la estructura social resultante de la interacción entre el paradigma tecnológico de la información y la reestructuración socioeconómica del capitalismo global. En esta sociedad, la morfología de la red (abierta, expansiva, descentralizada) se impone a las jerarquías verticales tradicionales. El poder ya no reside solo en la posesión de cosas, sino en la capacidad de programar las redes (los algoritmos, los flujos financieros, los medios) y de conectar/desconectar nodos. Quien controla los "interruptores" (switches) de la red, controla la sociedad.</p>
<p>La enseñanza de este concepto es crucial para que los estudiantes comprendan la geopolítica y la geoeconomía contemporáneas. Didácticamente, se trabaja con mapas de flujos: en lugar de mapas políticos con fronteras, los estudiantes deben trazar mapas de cómo viaja la información, el dinero y los paquetes de compras online desde y hacia su escuela. Esto revela que la escuela es un nodo en una red global, pero también expone las asimetrías: los flujos de entrada (consumo de plataformas) superan a los de salida (producción local), evidenciando una posición periférica en la sociedad red global.</p></div>
