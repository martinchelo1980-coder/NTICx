<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.9 — Netiquette: reglas de comportamiento dentro de Internet</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si en la calle no le gritamos a un desconocido ni entramos a una casa sin tocar timbre, ¿por qué en Internet normalizamos el insulto anónimo, la invasión de los grupos de WhatsApp a las 3 AM y la difusión de audios privados? ¿La falta de contacto visual nos deshumaniza, o simplemente revela lo que siempre fuimos pero no nos animábamos a mostrar?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La Netiquette (netiqueta) es el conjunto de reglas de convivencia, cortesía y respeto que rigen la interacción en el ciberespacio. Nacidas en los albores de Internet (el RFC 1855 de 1995 es un texto fundacional), estas normas buscan suplir la ausencia de lenguaje no verbal (tono de voz, gestos) mediante el uso consciente de mayúsculas (que equivalen a gritar), emoticonos, tiempos de respuesta y respeto por la privacidad ajena. La netiqueta no es solo "buena educación", es una herramienta de prevención de la violencia digital: el ciberbullying, el doxing (exposición de datos privados) y la cancelación masiva son, en el fondo, violaciones extremas de la netiqueta.</p>
<p>El DC prescribe "Enseñar reglas de etiqueta digital para su utilización dentro de las interacciones sociales" (DC, 2010, p. 15). Didácticamente, no se enseña con una lista de mandamientos aburrida, sino mediante el análisis de conflictos reales: traer al aula (anonimizados) capturas de discusiones tóxicas en grupos de WhatsApp escolares, comentarios de odio en portales de noticias locales o cadenas de desinformación. Los estudiantes actúan como "mediadores digitales" para desarmar el conflicto, identificar las violaciones a la netiqueta y proponer protocolos de convivencia. El producto final es la redacción colaborativa de la "Constitución de Netiqueta del Curso", un acuerdo vinculante para los trabajos grupales del año.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦 Contextualización Social e Impacto en el Territorio Argentino:</strong> La convivencia digital en Argentina es intensa y, a menudo, agresiva, reflejando la "grieta" política y social. La Ley 26.899 de creación de la figura del Defensor del Público de Servicios de Comunicación Audiovisual ha trabajado en la promoción de una comunicación democrática y no violenta, pero el ámbito privado de las redes y los chats sigue siendo una "tierra de nadie" donde el ciberacoso entre adolescentes es una problemática de salud pública. La escuela secundaria es el espacio privilegiado para intervenir y construir una cultura digital basada en la empatía y el respeto.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En las escuelas secundarias bahienses, los conflictos de pasillo se trasladan inmediatamente a los grupos de WhatsApp y a las historias de Instagram, generando situaciones de ciberbullying que los equipos de orientación escolar (EOE) deben abordar. Proponer que los estudiantes de 4to año diseñen una campaña de "Netiqueta y Cuidado Digital" para los alumnos de 1er y 2do año de su propia escuela (usando afiches con códigos QR, videos breves en TikTok o charlas presenciales) los posiciona como referentes positivos y agentes de cambio en la convivencia escolar local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.10 — Privacidad de la información</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si "el que no tiene nada que ocultar, no tiene nada que temer", ¿por qué cerramos la puerta del baño y ponemos contraseña al celular? ¿La privacidad es el derecho a esconder crímenes, o es el derecho fundamental a construir nuestra identidad sin la vigilancia constante del Estado, el mercado y los vecinos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La privacidad de la información es el derecho de todo individuo a controlar qué datos personales se recopilan, quién los almacena, con qué propósito y por cuánto tiempo. En la era digital, la privacidad está bajo asedio por tres frentes: la vigilancia estatal (por seguridad o control político), la vigilancia corporativa (por lucro publicitario) y la vigilancia social (la cultura de la exposición constante en redes y el sharenting de los padres). Conceptos como la huella digital (el rastro imborrable que dejamos) y el derecho al olvido (la posibilidad de desindexar información obsoleta o perjudicial de los buscadores) son centrales para la ciudadanía contemporánea.</p>
<p>El DC espera que los estudiantes "aprendan a proteger los datos electrónicos" (DC, 2010, p. 23). Didácticamente, se realiza el "Ejercicio del Panóptico": los estudiantes solicitan a las plataformas (Google, Instagram) el archivo completo de sus datos personales (función "Descargar tu información"). Al abrir ese archivo, suelen encontrar ubicaciones GPS de hace años, búsquedas borradas, conversaciones y metadatos que desconocían. El impacto emocional de verse "descriptos" por el algoritmo es el mejor punto de partida para enseñar técnicas de protección: cifrado de extremo a extremo, navegadores privados, gestión de cookies, uso de seudónimos y minimización de datos.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> El debate sobre la privacidad en Argentina cobró nueva fuerza con los proyectos de ley de reforma de la Ley de Protección de Datos Personales para adecuarla a los estándares globales, y con las denuncias por el uso ilegal de bases de datos estatales (como el padrón electoral o datos de salud) para armar "mesas de campaña" políticas o para extorsión. La falta de conciencia sobre la privacidad lleva a que millones de argentinos expongan a sus hijos en redes públicas, creando perfiles biométricos de menores sin su consentimiento. La educación en privacidad es, hoy, educación en protección de la infancia.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Un ejercicio potente y situado es analizar la huella digital de las instituciones locales: ¿qué datos pide la Municipalidad de Bahía Blanca al registrarse en su portal? ¿Qué hace con ellos? ¿Son públicos los datos de los funcionarios y sus declaraciones juradas? Comparar la transparencia pública (que es un deber del Estado) con la privacidad privada (que es un derecho del ciudadano) ayuda a los estudiantes a no confundir ambos conceptos y a ejercer un control cívico sobre la información que circula en su ciudad.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.11 — Ley de Habeas Data, protección de datos personales</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si una empresa o el Estado tiene un archivo con mi perfil, mis deudas o mis enfermedades, ¿soy yo el dueño de ese archivo o lo son ellos? ¿Qué poder real tengo para entrar a esas bases de datos, corregir lo que está mal o exigir que me borren de sus listas de deudores?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El Habeas Data (del latín, "que tengas los datos") es una garantía constitucional y un recurso legal que permite a cualquier persona conocer qué información sobre ella obra en registros públicos o privados, y solicitar su rectificación, actualización, confidencialidad o supresión. En Argentina, este derecho está amparado por el Artículo 43 de la Constitución Nacional y reglamentado por la Ley 25.326 de Protección de Datos Personales. La ley establece principios fundamentales: consentimiento previo e informado, calidad de los datos (deben ser exactos y actualizados), finalidad (solo se pueden usar para el fin explícito que se informó) y seguridad.</p>
<p>El DC incluye explícitamente la "Ley de Habeas data, protección de datos personales" (DC, 2010, p. 21). Didácticamente, esto no puede ser una clase de derecho abstracta. Se propone el taller de "Clínica de Datos": los estudiantes aprenden a ejercer sus derechos ARCO (Acceso, Rectificación, Cancelación y Oposición). Se los guía para consultar su perfil crediticio en el Banco Central (Central de Deudores) o en el Veraz (con las limitaciones de acceso gratuito), y se simula la redacción de una Carta Documento o un formulario de la Agencia de Acceso a la Información Pública (AAIP) para intimar a una empresa a dar de baja un número de teléfono de una base de marketing no deseado. Ejercer el derecho es la mejor forma de aprenderlo.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La AAIP (Agencia de Acceso a la Información Pública) es la autoridad de aplicación en Argentina, y recibe miles de denuncias anuales por spam telefónico, uso indebido de datos médicos o filtraciones de bases de datos. Un hito reciente fue la regulación del "Registro No Llame" para frenar el acoso del marketing telefónico. Sin embargo, la venta ilegal de bases de datos en el mercado negro argentino (que incluye datos de la ANSES, registros automotores y direcciones) es un delito que alimenta estafas y secuestros virtuales. Conocer el Habeas Data es dotar a los estudiantes de un escudo legal frente a estas mafias.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca, como en todo el país, los vecinos sufren el acoso de llamadas de call centers (ofreciendo créditos, medicina prepaga o alarmas) que obtuvieron sus números ilegalmente. Proponer a los estudiantes que realicen una campaña de asesoría legal-digital gratuita para adultos mayores en clubes de barrio o centros de jubilados de la ciudad, enseñándoles a inscribirse en el Registro No Llame, a bloquear números y a redactar un reclamo formal por violación a la Ley 25.326, transforma el aula de NTICx en un centro de extensión comunitaria de altísimo impacto social y solidario.</div>
</div>`;

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.12 — Propiedad intelectual</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si toda creación humana se construye sobre los hombros de gigantes y la cultura es un diálogo colectivo a través del tiempo, ¿por qué tratamos las ideas como si fueran terrenos privados que se pueden alambrar? ¿El derecho de autor protege al creador para que pueda vivir de su arte, o se ha convertido en una herramienta de las corporaciones para cercar el conocimiento común y frenar la innovación?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La propiedad intelectual (PI) es el régimen legal que otorga a los creadores derechos exclusivos sobre sus obras (literarias, musicales, software, patentes) por un tiempo determinado. En la teoría clásica, busca equilibrar dos intereses: recompensar al autor para incentivar la creación, y garantizar que, eventualmente, la obra pase al "dominio público" para enriquecer la cultura común. Sin embargo, en la era digital —donde copiar y distribuir tiene costo marginal cero—, este equilibrio se rompió. Las industrias culturales presionan por plazos de copyright cada vez más extensos (en muchos países, vida del autor más 70 años) y por criminalizar las prácticas cotidianas de los usuarios (compartir, remezclar, citar).</p>
<p>El Diseño Curricular exige que los estudiantes comprendan sus derechos y deberes en este ámbito (DC, 2010, p. 23). Didácticamente, se aborda mediante el debate sobre la "cultura del remix": ¿Es un delito que un joven baje una película para verla? ¿Es plagio que un músico use un sample de otro? ¿Por qué las universidades cobran fortunas por papers científicos financiados con fondos públicos? Los estudiantes analizan la Ley 11.723 de Propiedad Intelectual argentina y descubren que muchas de sus prácticas diarias son, técnicamente, ilegales, lo que demuestra que la ley está desfasada respecto a la realidad sociotécnica.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> En Argentina, entidades como SADAIC, CAPIF o Argentores recaudan y distribuyen derechos, pero el debate sobre el "copyleft" y el acceso al conocimiento es muy fuerte en el ámbito académico y del software libre. Organizaciones como la Fundación Vía Libre luchan contra la extensión automática de los plazos de copyright y defienden el derecho a las copias privadas y a las excepciones para bibliotecas y educación. Enseñar PI en la escuela es enseñar a los estudiantes a valorar el trabajo intelectual sin caer en la criminalización de la cultura participativa.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca es una ciudad con una rica producción cultural independiente: bandas de rock, escritores, teatreros y realizadores audiovisuales. Proponer a los estudiantes que entrevisten a un creador local para preguntarle cómo gestiona sus derechos (¿registra sus obras? ¿las sube a Spotify? ¿le molesta que la gente comparta sus videos?) y que luego organicen una "Feria de Dominio Público y Cultura Libre" en la escuela, donde se digitalicen y compartan obras bahienses antiguas cuyos derechos ya hayan expirado, conecta la teoría legal con la preservación del patrimonio cultural local.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.13 — Delitos informáticos</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el cibercrimen mueve más dinero a nivel mundial que el narcotráfico, ¿por qué seguimos pensando en los hackers como adolescentes encapuchados en un sótano? Cuando el delito se desmaterializa, cruza fronteras en un milisegundo y se aloja en servidores de países sin extradición, ¿sigue siendo eficaz el sistema penal tradicional o necesitamos una justicia global algorítmica?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Los delitos informáticos son aquellas conductas ilícitas donde la tecnología es el medio o el fin para cometer el daño. En Argentina, la Ley 26.388 (sancionada en 2008) modificó el Código Penal para tipificar figuras como el acceso indebido a un sistema (hackeo), la difusión de malware, el fraude electrónico, el grooming (acoso sexual a menores por internet) y la pornografía infantil. Comprender estos delitos es vital para la ciudadanía digital: no solo para no ser víctima, sino para no ser victimario por ignorancia (ej. reenviar imágenes íntimas de terceros sin consentimiento, lo cual hoy tiene penas severas).</p>
<p>Didácticamente, se trabaja con el análisis de la "anatomía de una estafa": los estudiantes desmenuzan un correo de phishing real o un intento de fraude por WhatsApp, identificando las técnicas de ingeniería social (urgencia, autoridad, miedo) que explotan los delincuentes. Además, se mapea el circuito de la denuncia: ¿dónde se denuncia en Bahía Blanca? ¿Qué pruebas hay que preservar (capturas, URLs, encabezados de correo)? La alfabetización legal aquí es una herramienta de supervivencia.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina cuenta con la Unidad Fiscal Especializada en Ciberdelincuencia (UFECI), que asiste a fiscalías de todo el país. El grooming y la extorsión sexual digital (sextorsión) son problemáticas gravísimas que afectan a adolescentes en todo el territorio nacional. La educación preventiva en las escuelas, mediante la Ley 26.904 (que incorpora el grooming al Código Penal y exige campañas educativas), es la principal barrera de contención frente a la impunidad que otorga el anonimato en la red.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Las fiscalías de Bahía Blanca reciben diariamente denuncias por estafas virtuales (el famoso "cuento del tío" digital, ventas falsas por Marketplace, clonación de perfiles). Una actividad de altísimo impacto social es que los estudiantes diseñen una campaña de "Prevención del Delito Informático para Adultos Mayores", visitando centros de jubilados o clubes de barrio de la ciudad para enseñarles a configurar la privacidad de WhatsApp, a identificar audios falsos de familiares pidiendo dinero y a no compartir códigos de verificación.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.14 — Robo de identidad</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si en el mundo digital "yo soy" mi contraseña, mi huella dactilar y mi número de DNI, ¿qué queda de mí cuando alguien más tiene esos datos? ¿Es el robo de identidad un simple fraude económico o es una forma de asesinato simbólico donde otro vive, gasta y delinque usando mi nombre y mi reputación?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El robo de identidad consiste en la apropiación indebida de datos personales (nombre, DNI, biométricos, credenciales bancarias) para cometer fraudes, obtener créditos, cometer delitos o difamar en nombre de la víctima. En la sociedad de la información, la identidad ya no es solo el cuerpo físico, sino el perfil de datos que las instituciones y plataformas tienen sobre nosotros. Proteger la identidad exige prácticas de "higiene digital": autenticación en dos pasos (2FA), no reutilizar contraseñas, cuidado con las redes Wi-Fi públicas y extrema cautela al subir documentos (fotos del DNI, pasajes con códigos QR) a las redes sociales.</p>
<p>El DC lo incluye explícitamente como objetivo de enseñanza: "Enseñar sobre el peligro que tiene el robo de identidades en Internet y las formas posibles de protección" (DC, 2010, p. 15). Didácticamente, se realiza el "Test de Exposición Digital": los estudiantes intentan buscar sus propios datos (o los de un personaje público local) en la web profunda o mediante técnicas de OSINT (Inteligencia de Fuentes Abiertas). Ver cuánta información personal (direcciones, teléfonos, familiares) está expuesta públicamente genera una toma de conciencia inmediata sobre la necesidad de blindar la identidad digital.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> En Argentina, el robo de identidad crediticia es una epidemia: miles de personas descubren que tienen tarjetas de crédito o préstamos que nunca pidieron porque sus datos fueron filtrados o vendidos por empleados infieles de empresas o el Estado. El Código Civil y Comercial y la Ley de Datos Personales permiten reclamar la nulidad de estas deudas, pero el proceso es angustiante. La educación en protección de datos es, literalmente, educación para la protección del patrimonio y el honor de las familias argentinas.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En Bahía Blanca, las comisarías y la Oficina Municipal de Defensa del Consumidor atienden recurrentemente a vecinos víctimas de "cuentas truchas" o compras con tarjetas clonadas en comercios locales. Proponer que los estudiantes elaboren un "Protocolo de Emergencia ante Robo de Identidad" (a quién llamar primero, cómo denunciar en la policía local, cómo contactar al Banco Central para frenar débitos, cómo alertar a los contactos en redes) y lo distribuyan como infografía en los comercios del centro bahiense, convierte el aula en un centro de asistencia cívica.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.15 — Responsabilidades de emisión de datos e información en el ciberespacio</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si las redes sociales nos dieron un megáfono global, ¿somos conscientes de que cada posteo es un acto público con consecuencias legales? ¿Hasta dónde llega mi "libertad de expresión" y dónde empieza el delito de calumnias, injurias o instigación al odio cuando destruyo la reputación de un vecino desde el anonimato de mi celular?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La responsabilidad de emisión postula que Internet no es una "zona libre de ley". Todo lo que se emite (un tuit, un comentario en un grupo de Facebook, un video en TikTok) tiene autoría y consecuencias. El anonimato es, en la mayoría de los casos, una ilusión técnica: las direcciones IP y los metadatos permiten a la justicia identificar al emisor. Los estudiantes deben comprender que la difamación, la exposición de datos privados de terceros (doxing), las amenazas y la apología del delito se castigan con la misma severidad (o mayor, por la viralidad) que en el mundo físico.</p>
<p>El DC busca que los estudiantes adquieran "capacidades en el manejo de la información, como ejercicio de la ciudadanía digital" (DC, 2010, p. 23). Didácticamente, se analizan casos de "justicia por mano propia" digital: linchamientos virtuales donde un grupo de vecinos acusa falsamente a alguien de un robo en un grupo de WhatsApp barrial, arruinando su vida social y laboral antes de que la policía investigue. El debate ético es profundo: la velocidad de la indignación vs. la lentitud de la verdad. Se enseña a los estudiantes a ser "eslabones de contención": no reenviar, no opinar sin pruebas, denunciar la publicación.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La jurisprudencia argentina es rica en fallos sobre responsabilidad civil y penal en redes. Los jueces han establecido que los administradores de grupos de Facebook pueden ser corresponsables si permiten la difamación sistemática, y que los medios de comunicación que levantan tendencias de Twitter sin verificar cometen negligencia. Formar emisores responsables es fundamental en un país donde la "grieta" y la violencia discursiva en redes han degradado el debate público.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los grupos de Facebook de Bahía Blanca (como "Alerta Bahía Blanca" o grupos barriales) son herramientas útiles para la seguridad, pero también focos de rumores infundados y difamaciones. Proponer a los estudiantes que auditen un hilo de discusión de estos grupos, identificando las falacias, las violaciones a la presunción de inocencia y el lenguaje de odio, y que redacten un "Decálogo del Buen Vecino Digital" para proponer a los administradores de esos grupos, es un ejercicio de mediación comunitaria de enorme valor.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.16 — Hacking ético</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Es el hacker el villano de la película o el único que realmente entiende cómo funcionan las cosas? Si las instituciones y los bancos están llenos de "agujeros" de seguridad, ¿no es un acto de suprema ciudadanía digital encontrarlos y avisar antes de que los criminales los aprovechen? ¿Se puede enseñar a "romper" sistemas para aprender a defenderlos?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El hacking ético (o White Hat hacking) es la práctica de utilizar las mismas técnicas y herramientas que los ciberdelincuentes, pero con autorización y con el fin de encontrar vulnerabilidades para repararlas antes de que sean explotadas. El hacker ético es un auditor de seguridad, un investigador que piensa "fuera de la caja". Comprender esto es vital para desestigmatizar la cultura hacker, que en sus orígenes (el MIT en los años 60) se basaba en la curiosidad, la meritocracia y la creencia de que la información debe ser libre.</p>
<p>El DC menciona el "Hacking ético" como contenido explícito (DC, 2010, p. 21). Didácticamente, no se trata de enseñar a crackear claves, sino de introducir el pensamiento de seguridad (security mindset): los estudiantes analizan sistemas cotidianos (la cerradura de la escuela, el sistema de inasistencias, la web de un comercio local) y buscan "fallas lógicas" (ej. "si adivino el nombre de usuario, ¿puedo ver la contraseña en el código fuente de la página?"). Esto fomenta el pensamiento crítico, la resolución de problemas complejos y la ética de la responsabilidad: con gran poder (el conocimiento técnico) viene una gran responsabilidad.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una de las comunidades de seguridad informática más respetadas de Latinoamérica, con eventos masivos como la Eko Party. Hackers éticos argentinos han descubierto vulnerabilidades críticas en sistemas globales y en plataformas locales, a menudo denunciando la falta de inversión en ciberseguridad del Estado y las empresas. Mostrar a estos profesionales como modelos a seguir es una excelente manera de orientar vocaciones científicas y técnicas hacia el sector del conocimiento.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> En la UNS y la UTN de Bahía Blanca se forman ingenieros en sistemas y especialistas en redes que luego trabajan en ciberseguridad. Invitar a un profesional local de IT para que cuente (sin revelar datos sensibles) cómo se realiza una auditoría de seguridad (pentesting) a una empresa bahiense, o cómo se protegen los sistemas del puerto contra ataques de ransomware, le da a los estudiantes una perspectiva laboral real, ética y apasionante de la informática.</div>
</div>`;

<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si el código de un software es lenguaje, y el lenguaje es pensamiento, ¿es ético prohibirle a alguien leer cómo funciona el programa que controla su auto, su marcapasos o su urna electoral? ¿Estamos condenados a ser meros "usuarios" que alquilan herramientas cerradas, o podemos ser "soberanos" de nuestra tecnología gracias a las licencias libres?</div>

<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.20 — Blogs como espacio de información y participación</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> En la era de la inmediatez de TikTok y la toxicidad de Twitter/X, ¿sigue teniendo sentido el blog? ¿Es el blog el último reducto de la "web lenta", donde todavía es posible el pensamiento largo y la construcción de una identidad digital que no dependa del algoritmo de una corporación?</div>

<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Quién gobierna Internet? Si las decisiones las toman cinco CEOs en Silicon Valley, ¿podemos hablar de un espacio democrático? ¿La democratización exige crear nuestras propias redes y servidores?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La democratización implica luchar contra la concentración monopólica. Incluye la Neutralidad de la Red, la Gobernanza multistakeholder y el fomento de redes comunitarias. Un ciberespacio democrático es aquel donde las minorías pueden expresarse y el acceso es un derecho.</p>
<p>Didácticamente, se aborda mediante el estudio de las Cooperativas de Telecomunicaciones y el debate sobre si Internet debe ser declarado "Servicio Público".</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene un movimiento cooperativo de telecomunicaciones muy fuerte (COLSECOR, FEDECOBAR) que ha tendido fibra óptica en miles de pueblos donde las grandes empresas no llegaban.</div>

<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.22 — Libertad de acceso a Internet: accesibilidad</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿De qué sirve que Internet tenga todo el conocimiento si la puerta tiene escalones que un ciego no puede subir? ¿Es la inaccesibilidad web una forma masiva de discriminación?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>La accesibilidad web (pautas WCAG) garantiza que personas con discapacidades y adultos mayores puedan usar la web. La Libertad de acceso no es solo tener señal, es tener la capacidad de usar la información (texto alternativo, contraste, navegación por teclado).</p>
<p>Didácticamente, se realiza el "Simulacro de Navegación Restringida": navegar por sitios locales usando solo el teclado o con un lector de pantalla.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> La Ley 26.653 obliga al Estado y concesionarios a respetar estas normas, pero el incumplimiento es generalizado. Formar diseñadores con conciencia de accesibilidad es una deuda urgente.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Los estudiantes pueden realizar una Auditoría de Accesibilidad Web a teatros, museos y hospitales de la ciudad y elevar los resultados al Concejo Deliberante, transformándose en fiscalizadores de derechos civiles locales.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.23 — Sitios: ONG, gobierno, cultura (Participación ciudadana digital)</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> ¿Es el "clic-activismo" una forma real de cambiar el mundo o solo una ilusión? ¿Cómo se organiza la solidaridad y la protesta en el ciberespacio?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>Aborda el ciberactivismo y el uso de la web por ONGs y el Estado. Se distingue entre el slacktivism (activismo de sofá) y el activismo digital estratégico (mapeo de basurales, bots para pedidos de informes públicos).</p>
<p>Didácticamente, se analizan campañas digitales y se enseña a organizar movimientos con herramientas concretas.</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina tiene una altísima densidad de organizaciones sociales. Las redes son el motor de colectas solidarias y crisis políticas. Comprender su arquitectura forma organizadores comunitarios.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> El proyecto final puede ser ofrecer "Consultoría de Ciudadanía Digital" a una ONG local (bomberos, protectoras) para optimizar su web y campañas, cerrando el ciclo de la materia con servicio comunitario.</div>
</div>
<div class="card p-6 space-y-3 text-sm text-slate-600">
<h3 class="font-bold text-slate-900 text-base">CONTENIDO 7.24 — Innovación tecnológica: Inteligencia Artificial y Nanotecnología</h3>
<div class="bg-rose-50 border-l-4 border-rose-400 rounded-r-xl p-3"><strong>❓ Pregunta Problematizadora Desafiante:</strong> Si la IA toma decisiones judiciales y la Nanotecnología reescribe nuestro ADN, ¿estamos ante el fin de la humanidad tal como la conocemos? ¿Quién programa la ética de los algoritmos que nos gobernarán?</div>
<div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl p-3 space-y-2"><strong>📘 Respuesta Teórica y Didáctica Completa:</strong>
<p>El DC cierra la materia mirando al futuro: la IA y la Nanotecnología redefinen la condición humana. La IA plantea dilemas de ética algorítmica (sesgos, desempleo, deepfakes); la Nanotecnología plantea dilemas bioéticos. La ciudadanía digital exige participar en la regulación de estas tecnologías antes de que el mercado las imponga.</p>
<p>Didácticamente, se usa la ciencia ficción para debatir consecuencias y se redacta una "Carta de Derechos Humanos para la Era de la IA".</p></div>
<div class="bg-emerald-50 border-l-4 border-emerald-400 rounded-r-xl p-3"><strong>🇦🇷 Contextualización Social e Impacto en el Territorio Argentino:</strong> Argentina es un polo regional en IA y biotecnología. El debate sobre su regulación en el Congreso es el campo donde los jóvenes tendrán que legislar mañana.</div>
<div class="bg-amber-50 border-l-4 border-amber-400 rounded-r-xl p-3"><strong>📍 Bajada Local Situada en la Ciudad de Bahía Blanca:</strong> Bahía Blanca es escenario ideal: drones con visión artificial en campos, sensores en silos. Un debate final con investigadores del CONICET local permite cerrar el año comprendiendo que la tecnología es un territorio de disputa donde la voz ética de los estudiantes es la garantía de un futuro humano.</div>
</div>`;

 nivelacion:`<p>Una computadora es una máquina electrónica capaz de <strong>recibir, procesar, almacenar y devolver información</strong> de manera automática. Para comprenderla es útil distinguir dos grandes componentes: el <strong>hardware</strong>, que es la parte física y tangible (teclado, monitor, placa madre, cables), y el <strong>software</strong>, que es la parte lógica: el conjunto de programas e instrucciones que le dicen al hardware qué hacer.</p>
<p>El corazón del equipo es la <strong>CPU (Unidad Central de Proceso)</strong>, encargada de ejecutar las instrucciones y realizar los cálculos. Dentro de ella trabajan la <strong>ALU</strong> (Unidad Aritmético-Lógica), que efectúa las operaciones matemáticas y comparaciones, y la <strong>UC</strong> (Unidad de Control), que coordina el flujo de datos entre todas las partes. La información se apoya en memorias: la <strong>RAM</strong>, memoria de trabajo temporal que se borra al apagar el equipo, y la <strong>ROM</strong>, memoria de solo lectura que conserva datos básicos de arranque.</p>
<p>Los <strong>periféricos</strong> son dispositivos que se conectan a la computadora y se clasifican en cuatro grupos: de <strong>entrada</strong> (teclado, mouse), de <strong>salida</strong> (monitor, impresora), de <strong>almacenamiento masivo</strong> (disco rígido, pendrive) y de <strong>conectividad</strong> (placa de red, módem). Toda la información dentro de la máquina se representa mediante el <strong>sistema binario</strong> (ceros y unos); la unidad mínima es el <strong>bit</strong> y un conjunto de 8 bits forma un <strong>byte</strong>.</p>
<p>Trabajar con equipos eléctricos exige <strong>prevención</strong>: los picos de tensión, los cortocircuitos y la humedad pueden dañar los componentes. Por eso es fundamental usar protectores de tensión, manipular los equipos con las manos secas y desconectarlos antes de abrirlos.</p>`,

{

 icon:'fa-window-maximize', color:'#7c3aed',
 nivelacion:`<p>El <strong>sistema operativo (SO)</strong> es el programa principal de la computadora: actúa como intermediario entre el usuario, las aplicaciones y el hardware. Sin él, la máquina no podría funcionar. Sus funciones esenciales son <strong>administrar los recursos</strong> (memoria, procesador, dispositivos), <strong>gestionar archivos y carpetas</strong>, y ofrecer una <strong>interfaz</strong> para que el usuario interactúe.</p>
<p>Existen distintos tipos de sistemas operativos. Algunos son <strong>propietarios</strong>, como <strong>Windows</strong> o macOS, cuyo código es cerrado y requiere licencia. Otros son de <strong>código abierto (open source)</strong>, como <strong>Linux</strong> y sus distribuciones, que pueden usarse, modificarse y distribuirse libremente; en Argentina, la distribución <strong>Huayra Linux</strong> fue desarrollada para las netbooks educativas del Estado.</p>
<p>El <strong>escritorio</strong> es la pantalla principal de trabajo, donde aparecen los <strong>íconos</strong> (accesos a programas y archivos). Los archivos se organizan en <strong>carpetas</strong>, y el <strong>explorador de archivos</strong> permite navegar por ellos, copiarlos, moverlos, renombrarlos y eliminarlos. Cada archivo tiene un <strong>nombre</strong> y una <strong>extensión</strong> (por ejemplo .txt, .docx, .jpg) que indica su tipo.</p>
<p>El <strong>panel de control</strong> y la <strong>barra de tareas</strong> permiten configurar el sistema. También es fundamental la <strong>seguridad</strong>: un <strong>antivirus</strong> protege frente al <strong>malware</strong> (programas maliciosos como virus, gusanos o troyanos). Por último, <strong>resguardar archivos</strong> (hacer copias de seguridad o backups) es una práctica esencial para no perder información ante fallas o ataques.</p>`,

/* ================= MÓDULOS III-IX · ESTRUCTURA (actividades oficiales cargadas) =================
   [PENDIENTE DE INYECCIÓN] → pedir por mensaje: "Inyectar Módulo III" (y sucesivos).
================================================================================================= */
{
 id:'m3', num:'III', titulo:'Procesador de Textos', adi:'Alfabetización Informática-Computacional',
 icon:'fa-file-word', color:'#2563eb',
 nivelacion:`<p>El <strong>procesador de textos</strong> es una de las herramientas más utilizadas en el estudio, el trabajo y la vida cotidiana. Se trata de una aplicación que permite <strong>crear, editar, dar formato e imprimir documentos de texto</strong>: cartas, informes, trabajos prácticos, currículums y proyectos. Su origen se remonta al paso de la máquina de escribir mecánica a la escritura digital, que hizo posible corregir sin volver a tipear, mover párrafos completos y cambiar la apariencia de un escrito al instante.</p>
<p>Al abrir el procesador encontramos la <strong>interfaz</strong>: el área de trabajo donde escribimos, los menús y barras con las opciones, y la regla. Un documento se puede <strong>crear y abrir</strong>, y es fundamental <strong>guardarlo</strong> en distintos soportes (disco rígido, pendrive, la nube) para no perderlo. Los archivos de texto tienen extensiones como <strong>.docx</strong> (Word) o <strong>.odt</strong> (Writer). Para trabajar sobre un escrito primero hay que <strong>seleccionar</strong> el fragmento que queremos modificar, y luego aplicar el <strong>formato</strong> (tipo de letra, tamaño, color, negrita) y la <strong>alineación de los párrafos</strong> (izquierda, derecha, centrado o justificado). El <strong>corrector ortográfico</strong> señala los posibles errores de ortografía para que los revisemos.</p>
<p>Las opciones de <strong>cortar, copiar y pegar</strong> permiten mover o duplicar texto; la <strong>numeración y las viñetas</strong> organizan listas; y antes de imprimir debemos <strong>configurar la página</strong> (márgenes, tamaño y orientación). En un nivel intermedio se trabaja con el <strong>interlineado</strong> (espacio entre líneas), las <strong>columnas</strong>, el <strong>encabezado y pie de página</strong>, los <strong>saltos de página y de sección</strong>, las <strong>imágenes prediseñadas</strong>, los <strong>cuadros de texto</strong>, las <strong>tabulaciones</strong> y la <strong>búsqueda y reemplazo</strong> de palabras.</p>
<p>En el nivel avanzado, el procesador permite generar <strong>índices automáticos</strong>, emplear el <strong>editor de ecuaciones</strong>, administrar <strong>tablas</strong> para organizar información, <strong>transferir archivos</strong> entre soportes y realizar la <strong>combinación de correspondencia</strong>: una potente función que une una plantilla de documento con una lista de datos para producir muchas cartas, diplomas o etiquetas personalizadas de una sola vez.</p>`,

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Cartas oficiales para nuestra institución barrial"</h4>
<p class="text-sm text-slate-600 mb-2">Una biblioteca popular o club de barrio del partido necesita enviar invitaciones y diplomas personalizados. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Entrevisten a los referentes de la institución elegida e identifiquen sus necesidades de documentación (cartas, invitaciones, diplomas).</li>
<li>Elaboren la <strong>lista de datos</strong> de los destinatarios (nombre, dirección, condición).</li>
<li>Diseñen la <strong>plantilla del documento</strong> con formato correcto (márgenes, encabezado, alineación).</li>
<li>Realicen la <strong>combinación de correspondencia</strong> para generar todos los documentos personalizados.</li>
<li>Entreguen el material terminado junto con una guía breve para que la institución pueda replicarlo.</li>
</ol>`,

  argentina:`En Argentina, la escritura digital es una competencia clave para el mundo laboral y los estudios superiores: la administración pública, las empresas y las instituciones educativas producen la mayor parte de su comunicación con procesadores de texto. Dominar herramientas como la combinación de correspondencia, las tablas y los índices habilita a los estudiantes a resolver tareas administrativas y académicas reales, fortaleciendo su inclusión en el mundo digital.`,
  bahiaBlanca:`En Bahía Blanca, las escuelas, el Municipio, las bibliotecas populares y los clubes de barrio producen a diario notas, actas, invitaciones y diplomas. Que los estudiantes puedan elaborar y automatizar esa documentación no solo desarrolla su alfabetización digital, sino que constituye un servicio concreto de colaboración con las instituciones de la comunidad.`

/* ================= MÓDULO IV · SOFTWARE DE PRESENTACIONES (COMPLETO) ================= */
{
 id:'m4', num:'IV', titulo:'Software de Presentaciones', adi:'Alfabetización Informática-Computacional',
 icon:'fa-file-powerpoint', color:'#ea580c',
 nivelacion:`<p>El <strong>software de presentaciones</strong> es una herramienta que permite <strong>comunicar ideas e información de manera visual</strong> mediante una secuencia de <strong>diapositivas</strong>. A diferencia de un documento de texto, una presentación está pensada para <strong>acompañar una exposición oral</strong>: las diapositivas no reemplazan al orador, sino que lo apoyan con imágenes, esquemas, gráficos y palabras clave. Por eso el Diseño Curricular las define como <em>"constructoras de información en modo visual"</em>.</p>
<p>Al abrir el programa encontramos la <strong>interfaz</strong>: el panel de diapositivas (a la izquierda), el área de trabajo central, las barras de herramientas y el espacio para notas del orador. Cada <strong>diapositiva</strong> es la unidad básica del trabajo: se pueden <strong>crear e insertar</strong> diapositivas con distintos formatos (título, contenido en blanco, dos columnas), aplicarles <strong>estilos de diseño</strong> unificados e incorporar <strong>imágenes prediseñadas</strong>. Las <strong>vistas</strong> permiten observar el trabajo de diferentes maneras: la vista normal para editar, el clasificador de diapositivas para reorganizar y el modo de presentación a pantalla completa para exponer.</p>
<p>En el nivel intermedio se suman recursos expresivos y de planificación: los objetos <strong>WordArt</strong> (títulos con efectos visuales), los <strong>gráficos</strong> para representar datos, los <strong>botones de acción</strong> que agregan interactividad y navegación, y sobre todo el <strong>guión multimedia</strong>: la planificación previa que describe qué contendrá cada diapositiva, con qué recursos y en qué orden. Ninguna buena presentación se improvisa: primero se planifica, después se produce.</p>
<p>En el nivel avanzado, la presentación se convierte en un verdadero producto multimedia: se incorporan <strong>diagramas</strong> para explicar relaciones y procesos, <strong>sonidos y videos</strong> (incluidos los capturados por los propios estudiantes), y se configuran <strong>animaciones</strong> (efectos sobre los objetos dentro de la diapositiva) y <strong>transiciones</strong> (efectos en el paso de una diapositiva a la siguiente). Eso sí: estos recursos deben usarse con criterio, porque en exceso distraen a la audiencia y debilitan el mensaje.</p>`,

/* ================= MÓDULO V · PLANILLA DE CÁLCULOS (COMPLETO) ================= */
{
 id:'m5', num:'V', titulo:'Planilla de Cálculos', adi:'Alfabetización Informática-Computacional',
 icon:'fa-file-excel', color:'#16a34a',
 nivelacion:`<p>La <strong>planilla de cálculo</strong> es una aplicación que permite <strong>organizar, procesar y analizar datos</strong> en una tabla formada por filas y columnas. Es una de las herramientas más utilizadas en el mundo del trabajo, la administración y la educación, porque transforma datos sueltos en información útil para tomar decisiones. Su estructura básica se compone de <strong>filas</strong> (horizontales, identificadas con números) y <strong>columnas</strong> (verticales, identificadas con letras); la intersección de una fila y una columna se llama <strong>celda</strong>, y se nombra con la letra de la columna seguida del número de fila (por ejemplo, <strong>B3</strong>).</p>
<p>Cada celda puede contener distintos tipos de datos: texto, números, fechas o <strong>fórmulas</strong>. Para trabajar con los datos, podemos <strong>eliminarlos, copiarlos o moverlos</strong>, ya sea una celda individual o un <strong>rango</strong> (conjunto de celdas contiguas). El <strong>formato de las celdas</strong> permite mejorar la presentación y la legibilidad: bordes, colores, alineación y formato de número. Las <strong>fórmulas</strong> siempre se escriben comenzando con el signo igual (<strong>=</strong>) y pueden usar operadores aritméticos; las <strong>funciones</strong>, como SUMA o PROMEDIO, son fórmulas predefinidas que realizan cálculos automáticamente.</p>
<p>En el nivel intermedio la planilla se convierte en una herramienta de análisis: se practican <strong>fórmulas y funciones</strong> más complejas, se <strong>ordena</strong> la información según distintos criterios (ascendente o descendente), se <strong>filtran</strong> los datos para ver solo los que cumplen determinadas condiciones, y se construyen <strong>gráficos</strong> que representan visualmente la información. Un gráfico bien formateado —con título, etiquetas de ejes y leyenda— comunica resultados de un vistazo.</p>
<p>En el nivel avanzado, la planilla permite automatizar decisiones: las <strong>funciones lógicas</strong> (SI, Y, O) devuelven un resultado u otro según se cumpla una condición; las <strong>operaciones con fechas</strong> permiten calcular edades, plazos y vencimientos aplicando los <strong>formatos de fecha</strong> adecuados; la <strong>conversión de unidades</strong> traduce magnitudes (longitud, peso, temperatura); y la <strong>validación de datos</strong> controla qué valores pueden ingresarse en una celda, evitando errores. Así, la planilla deja de ser una simple tabla para convertirse en un verdadero sistema de gestión.</p>`,

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Los datos hablan: decisiones para nuestra comunidad"</h4>

/* ================= MÓDULO VI · GESTOR DE BASE DE DATOS (COMPLETO) ================= */
{
 id:'m6', num:'VI', titulo:'Gestor de Base de Datos', adi:'Alfabetización Informática-Computacional',
 icon:'fa-database', color:'#0891b2',
 nivelacion:`<p>Una <strong>base de datos</strong> es un conjunto organizado de información que puede consultarse, actualizarse y administrarse de manera eficiente. Mientras que una planilla de cálculo resulta útil para volúmenes pequeños de datos, cuando la información crece —los socios de un club, los libros de una biblioteca, los clientes de un comercio— se necesita una herramienta más poderosa: el <strong>gestor de base de datos</strong>. Este tipo de software permite almacenar grandes cantidades de información, evitar repeticiones, mantener los datos consistentes y recuperarlos rápidamente según distintos criterios.</p>
<p>La estructura básica de una base de datos se organiza en <strong>tablas</strong>, parecidas a una hoja de cálculo pero con reglas más estrictas. Cada <strong>campo</strong> es una columna que representa un atributo (nombre, dirección, fecha de nacimiento) y tiene un <strong>tipo de dato</strong> definido (texto, número, fecha). Cada <strong>registro</strong> es una fila que reúne todos los datos de un elemento concreto (un socio, un libro, un cliente). Para identificar de forma única a cada registro se utiliza una <strong>clave primaria</strong>, un campo que no se repite, como un número de socio o un DNI.</p>
<p>Un gestor de base de datos no solo guarda tablas: ofrece distintos objetos para trabajar con la información. Los <strong>formularios</strong> facilitan el ingreso de datos mediante pantallas amigables; las <strong>consultas</strong> permiten filtrar, combinar y calcular información para responder preguntas específicas; y los <strong>informes</strong> presentan los resultados con un diseño listo para imprimir o compartir. En las <strong>bases de datos relacionales</strong>, la información se reparte en varias tablas que se vinculan entre sí mediante campos comunes, lo que evita la repetición y mantiene la consistencia del conjunto.</p>
<p>Para comunicarse con las bases de datos se utiliza el <strong>lenguaje SQL</strong> (Lenguaje Estructurado de Consulta), un estándar que permite crear tablas, insertar registros y realizar consultas mediante instrucciones precisas. Diseñar una base de datos implica pensar primero el problema: qué datos hacen falta, cómo se relacionan y cómo evitar la redundancia. Las bases de datos están en todas partes —los sistemas del Estado, los bancos, los hospitales, las redes sociales— y conocer su lógica no solo abre puertas laborales en el mundo de la informática, sino que permite comprender cómo se gestiona la información que nos rodea y por qué es tan importante protegerla.</p>`,

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Un sistema para nuestra biblioteca popular"</h4>
<p class="text-sm text-slate-600 mb-2">Una biblioteca popular o un club de barrio necesita organizar sus préstamos y dejar de usar listas en papel que se pierden y se repiten. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Entrevisten a los referentes de la institución para relevar qué información necesitan administrar (libros, socios, préstamos).</li>
<li>Diseñen una <strong>base de datos relacional</strong> con al menos dos tablas vinculadas (por ejemplo, <em>socios</em> y <em>préstamos</em>), definiendo campos, tipos de dato y claves primarias.</li>
<li>Implementen la base en el gestor, creando las tablas y estableciendo las relaciones.</li>
<li>Construyan un <strong>formulario</strong> para registrar préstamos, una <strong>consulta</strong> para saber qué libros están prestados y un <strong>informe</strong> mensual.</li>
<li>Prueben el sistema con datos reales de la institución y ajusten lo necesario.</li>
<li>Presenten el sistema terminado a la institución junto con una guía breve de uso.</li>
</ol>`,
 contexto:{
  argentina:`En Argentina, las bases de datos sostienen el funcionamiento del Estado y de las organizaciones: sistemas como los de ANSES, el RENAPER y los registros provinciales administran información de millones de personas. Por eso el diseño y la administración de bases de datos se vincula directamente con la protección de los datos personales (Ley 25.326) y con perfiles laborales muy demandados, como el administrador de bases de datos y el desarrollador de software. Comprender cómo se organiza la información es comprender una parte central del mundo digital contemporáneo.`,
  bahiaBlanca:`Bahía Blanca es un polo educativo y tecnológico del sur bonaerense: la Universidad Nacional del Sur y la UTN Regional Bahía Blanca forman profesionales en sistemas e informática que diseñan y administran bases de datos. Además, el Municipio, el puerto, el Polo Petroquímico y numerosas empresas locales gestionan grandes volúmenes de información mediante sistemas informáticos. Que los estudiantes se inicien en las bases de datos los conecta con oportunidades reales de estudio y trabajo en la región.`
 },

/* ================= MÓDULO VII · SOFTWARE DE COMUNICACIONES (COMPLETO) ================= */
{
 id:'m7', num:'VII', titulo:'Software de Comunicaciones', adi:'Alfabetización en Medios Digitales de Comunicación y Colaboración',
 icon:'fa-comments', color:'#db2777',
 nivelacion:`<p>La <strong>comunicación</strong> es el proceso social fundamental mediante el cual las personas comparten información, ideas y sentimientos. Todo proceso comunicativo involucra distintos elementos: un <strong>emisor</strong> que envía el mensaje, un <strong>receptor</strong> que lo recibe, un <strong>mensaje</strong> que se transmite, un <strong>canal</strong> por donde circula y un <strong>código</strong> compartido que permite comprenderlo. Con el desarrollo de las nuevas tecnologías, la comunicación se potenció enormemente: hoy podemos intercambiar mensajes con personas de cualquier lugar del mundo, en tiempo real o diferido, combinando texto, imagen, audio y video.</p>
<p>El <strong>software de comunicaciones</strong> agrupa las herramientas que hacen posible este intercambio digital. La más extendida es el <strong>correo electrónico</strong>, que permite enviar y recibir mensajes a través de Internet. Un mensaje de correo tiene una estructura clara: destinatario, asunto, cuerpo del texto y despedida. Además, pueden adjuntarse <strong>archivos adjuntos</strong> (documentos, imágenes, planillas) que acompañan el mensaje. Administrar correctamente la bandeja de entrada, organizar los mensajes en carpetas y gestionar los adjuntos son habilidades esenciales para comunicarse con eficacia en el mundo digital.</p>
<p>Las comunicaciones digitales se clasifican según el momento en que ocurre el intercambio. Las <strong>comunicaciones sincrónicas</strong> suceden en tiempo real: los interlocutores están conectados simultáneamente, como en un chat, una mensajería instantánea o una videoconferencia. Las <strong>comunicaciones asincrónicas</strong> ocurren en tiempo diferido: cada participante responde cuando puede, como en el correo electrónico o los foros de discusión. Conocer las características de cada tipo permite elegir la herramienta adecuada según la situación comunicativa, el destinatario y el propósito del mensaje.</p>
<p>En un nivel avanzado, el trabajo con el software de comunicaciones incluye la administración y configuración de <strong>tecnologías de conexión inalámbrica</strong>, como el Wi-Fi y el Bluetooth, atendiendo a la seguridad de la conexión mediante contraseñas y cifrado. Pero comunicarse digitalmente no es solo una cuestión técnica: exige aplicar la <strong>netiqueta</strong>, las normas de comportamiento y cortesía en la red, y asumir una postura ética y responsable. Proteger los datos personales, respetar a los interlocutores y hacer un uso crítico de las herramientas comunicativas son dimensiones inseparables de la ciudadanía digital que esta materia promueve.</p>`,
 glosario:[
  {t:'Comunicación',d:'Proceso social mediante el cual se comparte información entre un emisor y un receptor a través de un canal y un código común.'},

  {t:'Comunicación sincrónica',d:'Intercambio que ocurre en tiempo real, con los interlocutores conectados simultáneamente (chat, videoconferencia).'},
  {t:'Comunicación asincrónica',d:'Intercambio en tiempo diferido, donde cada participante responde cuando puede (correo, foros).'},
  {t:'Chat',d:'Herramienta de comunicación sincrónica basada en el intercambio de mensajes de texto en tiempo real.'},
  {t:'Videoconferencia',d:'Comunicación sincrónica que transmite audio y video en tiempo real entre personas en distintos lugares.'},
  {t:'Netiqueta',d:'Conjunto de normas de comportamiento y cortesía para la comunicación en la red.'}

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Un puente de comunicación para nuestra comunidad"</h4>
<p class="text-sm text-slate-600 mb-2">Una institución local (biblioteca popular, club de barrio o centro de jubilados) necesita mejorar su comunicación interna y con la comunidad, combinando herramientas sincrónicas y asincrónicas. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Entrevisten a los referentes de la institución para relevar sus necesidades de comunicación (entre miembros, con socios, con la comunidad).</li>
<li>Diseñen un <strong>plan de comunicación digital</strong> que combine herramientas sincrónicas (para urgencias y reuniones) y asincrónicas (para información y avisos).</li>
<li>Implementen un <strong>grupo de correo o foro</strong> para la comunicación asincrónica y un <strong>canal de mensajería o videoconferencia</strong> para la comunicación sincrónica.</li>
<li>Capaciten a los miembros de la institución en el uso de las herramientas elegidas, aplicando y enseñando las reglas de netiqueta.</li>
<li>Elaboren una <strong>guía breve de comunicación digital</strong> para la institución, con recomendaciones de seguridad y uso responsable.</li>
<li>Presenten el sistema implementado y evalúen con la institución los resultados obtenidos.</li>
</ol>`,
 contexto:{
  argentina:`En Argentina, las herramientas de comunicación digital transformaron las relaciones sociales, laborales y educativas. El correo electrónico, la mensajería instantánea y las videoconferencias son hoy indispensables para el trabajo, el estudio y la vida cotidiana. Por eso el Diseño Curricular promueve no solo el dominio técnico de estas herramientas, sino también su uso crítico y responsable, atendiendo a la protección de los datos personales (Ley 25.326), la aplicación de la netiqueta y la prevención de riesgos como el robo de identidad y el ciberacoso.`,
  bahiaBlanca:`En Bahía Blanca, las escuelas, clubes, bibliotecas y organizaciones sociales necesitan comunicarse digitalmente con sus comunidades. La ciudad cuenta con conectividad a Internet que permite implementar herramientas de comunicación sincrónica y asincrónica. Sin embargo, persisten brechas generacionales y de acceso que hacen valioso que los estudiantes, como ciudadanos digitales activos, colaboren para que las instituciones locales y las personas mayores se apropien de estas herramientas.`
 },

/* ================= MÓDULO VIII · REDES E INTERNET (COMPLETO) ================= */
{
 id:'m8', num:'VIII', titulo:'Redes e Internet', adi:'Alfabetización en Redes Digitales de Información',
 icon:'fa-network-wired', color:'#4f46e5',
 nivelacion:`<p>Una <strong>red informática</strong> es un conjunto de computadoras y dispositivos conectados entre sí que pueden compartir información y recursos. Las redes se clasifican según su alcance: las <strong>LAN</strong> (redes de área local) conectan equipos en un espacio reducido como una escuela o una oficina; las <strong>MAN</strong> abarcan una ciudad; las <strong>WAN</strong> cubren países o continentes; y las <strong>PAN</strong> vinculan dispositivos personales a muy corta distancia. <strong>Internet</strong> es la red mundial que interconecta millones de redes, resultado de la convergencia tecnológica entre la informática y las telecomunicaciones. Gracias a ella, la información se genera, circula y se pone a disposición de los usuarios a escala local, nacional e internacional.</p>
<p>Para acceder a Internet utilizamos un <strong>navegador</strong>, el programa que permite recorrer las páginas web, y un <strong>buscador</strong>, la herramienta que ayuda a encontrar información específica dentro de la red. Es importante distinguir entre <strong>página web</strong> (un documento individual), <strong>sitio web</strong> (un conjunto de páginas organizadas bajo un mismo dominio) y <strong>portal</strong> (un sitio que ofrece múltiples servicios y contenidos en un solo punto de acceso). Las páginas se vinculan entre sí mediante <strong>links</strong> o hipervínculos, y se estructuran como <strong>hipertexto</strong> —texto con enlaces que permiten saltar de un documento a otro— o como <strong>hipermedia</strong>, cuando además integran imágenes, audio y video. Cada recurso de la red se identifica con una dirección única llamada <strong>URL</strong>.</p>
<p>Internet ofrece una gran variedad de <strong>servicios</strong>: el correo electrónico, el chat, los blogs, las redes sociales, el comercio electrónico, la transferencia de archivos (FTP) y la suscripción a contenidos (RSS), entre otros. También permite realizar <strong>descargas</strong> de información desde la red. Sin embargo, este enorme caudal de posibilidades exige una mirada crítica: los productos de los medios masivos en la red deben analizarse con atención, y es fundamental reconocer los <strong>riesgos</strong> que afectan a los datos y a la información personal cuando nos conectamos, aplicando medidas de protección adecuadas.</p>
<p>En un nivel avanzado, el trabajo con redes implica diferenciar <strong>Internet</strong> (la red pública global), <strong>Intranet</strong> (una red privada interna de una organización) y <strong>Extranet</strong> (una red que conecta a la organización con colaboradores externos). También incluye seleccionar las pautas para contratar un servicio de conexión, configurar una computadora para operar en la red y proteger los datos durante la transmisión. Finalmente, comprender cómo funciona una red LAN permite <strong>armarla y configurarla</strong> físicamente: identificar los componentes necesarios (placas de red, cables o puntos de acceso inalámbrico, routers), conectarlos y verificar el funcionamiento, una habilidad de gran valor tanto para el mundo del trabajo como para la vida cotidiana.</p>`,
 glosario:[

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Un plan de conectividad para nuestra institución"</h4>
<p class="text-sm text-slate-600 mb-2">Una institución local (escuela, club de barrio o biblioteca popular) necesita mejorar su conectividad y organizar su red interna. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Realicen un <strong>análisis de caso</strong>: releven las necesidades de conectividad de la institución elegida (cantidad de equipos, usos previstos, presupuesto).</li>
<li>Diseñen un <strong>plan de conectividad</strong> que incluya el tipo de red LAN, los componentes necesarios y la distribución de los dispositivos.</li>
<li>Seleccionen las <strong>pautas para contratar un servicio de Internet</strong>, comparando al menos dos opciones disponibles en Bahía Blanca.</li>
<li>Definan las <strong>medidas de protección de datos</strong> que la institución debe aplicar en su conexión.</li>
<li>Elaboren el <strong>diseño gráfico de la red</strong> y una propuesta de configuración.</li>
<li>Presenten el plan de conectividad a la institución y evalúen su viabilidad junto con sus referentes.</li>
</ol>`,
 contexto:{
  argentina:`En Argentina, el acceso a Internet es una condición clave para la inclusión educativa, laboral y social. Los planes de conectividad, el tendido de fibra óptica y los satélites de comunicaciones buscan reducir la brecha digital entre regiones. Al mismo tiempo, el crecimiento de la vida en línea hace indispensable que los ciudadanos conozcan sus derechos digitales y protejan sus datos personales, en línea con la Ley 25.326. Formar usuarios críticos y responsables de la red es uno de los propósitos centrales de la ciudadanía digital que promueve el Diseño Curricular.`,
  bahiaBlanca:`En Bahía Blanca conviven zonas con buena conectividad y sectores donde el acceso a Internet aún es limitado, lo que refleja la brecha digital en el ámbito local. La ciudad cuenta con proveedores locales de servicios de Internet y con instituciones educativas que forman profesionales en redes y telecomunicaciones. Que los estudiantes comprendan cómo funciona la conectividad y sepan diseñar soluciones de red los prepara para intervenir en su comunidad y para futuras oportunidades laborales en el sector tecnológico.`

/* ================= MÓDULO IX · MULTIMEDIA (COMPLETO) ================= */
{
 id:'m9', num:'IX', titulo:'Multimedia', adi:'Alfabetización Multimedia',
 icon:'fa-photo-film', color:'#9333ea',
 nivelacion:`<p>La <strong>multimedia</strong> es la integración de distintos lenguajes —texto, sonido, imágenes fijas y en movimiento— en un mismo soporte digital, organizado de manera <strong>hipermedial e interactiva</strong>. A diferencia de un documento lineal tradicional, un producto multimedia permite al usuario recorrer la información de forma no secuencial, eligiendo su propio camino a través de enlaces, y participar activamente del proceso comunicativo. La alfabetización multimedia cumple un rol integrador: brinda apoyo a las demás alfabetizaciones de la materia, porque reúne en un solo lenguaje los saberes sobre imagen, sonido, comunicación y ciudadanía digital.</p>
<p>La información multimedia se presenta en distintos <strong>formatos</strong>: textual (escrito), verbal (oral), sonora (audio y música) y visual (imágenes y video). Cada uno requiere procesos de <strong>digitalización</strong> específicos, que convierten la información analógica en datos numéricos que la computadora puede procesar. Las imágenes pueden ser de distintos tipos y formatos, y el tratamiento digital permite editarlas, retocarlas y combinarlas. Conocer las características de cada formato de imagen, sonido y video es esencial para elegir el más adecuado según el propósito comunicativo y el destino del producto.</p>
<p>Construir un producto multimedia exige un proceso planificado que comienza con el <strong>guión multimedia</strong>, el documento que organiza el contenido y la estructura del producto. El <strong>story board</strong> o guión gráfico permite visualizar las escenas antes de producir; la <strong>gramática audiovisual</strong> aporta las reglas del lenguaje de la imagen y el sonido; y la <strong>interfaz</strong> define el modo en que el usuario interactúa con el producto (pantallas, ventanas, botones). El <strong>software de autor</strong> facilita la creación de aplicaciones multimedia interactivas sin necesidad de dominar lenguajes de programación, lo que democratiza el acceso a la producción digital.</p>
<p>En un nivel avanzado, los estudiantes pueden construir un <strong>producto multimedia integral</strong>, que combine sonidos, textos, videos, imágenes y animaciones a partir de un guión y un diseño de interfaz cuidadosamente elaborados. También pueden crear y organizar una <strong>biblioteca multimedia</strong> con fines institucionales, catalogando y poniendo a disposición de la comunidad los recursos producidos. De este modo, la multimedia no solo es una herramienta técnica, sino un nuevo lenguaje que amplía las posibilidades de expresión, comunicación y participación ciudadana en la sociedad de la información.</p>`,

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Una guía multimedia de nuestra ciudad"</h4>
<p class="text-sm text-slate-600 mb-2">Bahía Blanca tiene un rico patrimonio cultural, histórico y natural que merece ser conocido por la comunidad. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Elijan un aspecto del patrimonio local para difundir: un barrio histórico, un espacio cultural, un museo o un atractivo natural de la región.</li>
<li>Elaboren el <strong>guión multimedia y el story board</strong> del producto antes de comenzar la producción.</li>
<li>Capturen <strong>fotos, videos y sonidos propios</strong> del lugar elegido, con los dispositivos disponibles y respetando los derechos de imagen.</li>
<li>Construyan un <strong>producto multimedia interactivo</strong> con una interfaz clara, que integre textos, sonidos, videos, imágenes y animaciones.</li>
<li>Organicen los recursos producidos en una <strong>biblioteca multimedia</strong> de la escuela, catalogándolos para su uso futuro.</li>
<li>Presenten la guía multimedia a la comunidad escolar y, de ser posible, a una institución cultural de la ciudad.</li>
</ol>`,
 contexto:{
  argentina:`En Argentina, la convergencia de la informática y las comunicaciones dio lugar a nuevos lenguajes y formas de comunicación que integran texto, imagen y sonido. La sociedad de la información exige que los ciudadanos no solo consuman contenidos multimedia, sino que también sean capaces de producirlos críticamente. El Diseño Curricular promueve que los estudiantes lean y escriban con textos, sonidos, animaciones e imágenes en documentos interactivos, y que diseñen productos basados en la hipermedia, fortaleciendo su inclusión tecnológica y su participación como ciudadanos digitales activos.`,
  bahiaBlanca:`Bahía Blanca cuenta con un valioso patrimonio cultural, histórico y natural: museos, teatros, bibliotecas, espacios verdes y una rica vida artística. Sin embargo, gran parte de ese patrimonio no cuenta con materiales multimedia de difusión accesibles. Que los estudiantes produzcan guías multimedia sobre su ciudad los convierte en protagonistas de la valorización y difusión de la identidad local, articulando la formación tecnológica con el compromiso comunitario.`
 },

/* ================= MÓDULO X · CIUDADANÍA DIGITAL (TRANSVERSAL - COMPLETO) ================= */
{
 id:'m10', num:'X', titulo:'Ciudadanía Digital', adi:'Alfabetización Ciudadanía Digital · Módulo Transversal',
 icon:'fa-shield-halved', color:'#d97706',
 nivelacion:`<p>La <strong>ciudadanía digital</strong> es el conjunto de normas de comportamiento, derechos y responsabilidades que guían el uso de las nuevas tecnologías. Mientras que los demás módulos de esta materia enseñan a comprender y utilizar las herramientas digitales, la ciudadanía digital aporta la <strong>dimensión ética, legal y social</strong> que atraviesa todas esas prácticas. Ser un ciudadano digital activo significa no solo saber usar la tecnología, sino hacerlo de manera responsable, segura y crítica, comprendiendo los asuntos humanos, culturales y sociales relacionados con las nuevas tecnologías de la información y la conectividad.</p>
<p>En la sociedad de la información, la <strong>privacidad</strong> se ha convertido en un valor fundamental. Nuestros datos personales circulan constantemente por la red, y por eso es esencial conocer las herramientas legales que nos protegen. En Argentina, la <strong>Ley de Habeas Data</strong> (Ley 25.326) garantiza el derecho de toda persona a conocer, actualizar y rectificar la información que se refiere a ella, y protege los datos personales frente a usos indebidos. Aprender a proteger los datos electrónicos y prevenir el <strong>robo de identidad</strong> son habilidades indispensables para desenvolverse con seguridad en el ciberespacio.</p>
<p>La producción y el uso de información también plantean cuestiones legales y éticas vinculadas a la <strong>propiedad intelectual</strong>. Cuando utilizamos textos, imágenes, música o software ajenos, debemos respetar los <strong>derechos de autor</strong> y la documentación apropiada de las fuentes. Las licencias definen cómo puede usarse una obra: el <strong>copyright</strong> reserva todos los derechos al autor, las licencias <strong>Creative Commons</strong> permiten ciertos usos con condiciones, y las <strong>licencias de software</strong> regulan el uso de los programas. Comprender estas diferencias permite usar la información de modo seguro, legal y ético, y a la vez valorar el trabajo creativo de los demás.</p>
<p>El ciberespacio es un espacio de interacción donde también pueden cometerse <strong>delitos informáticos</strong>, como el fraude, el acoso digital o el ciberbullying. Frente a estos riesgos, la ciudadanía digital promueve conductas responsables: aplicar la <strong>netiqueta</strong> —las reglas de cortesía y comportamiento en la red—, respetar a los demás y denunciar las situaciones de acoso. Pero la ciudadanía digital no se agota en la prevención: también incluye la participación activa, como el uso de blogs para expresarse, la <strong>democratización del ciberespacio</strong>, el acceso libre a Internet y la comprensión de fenómenos como el e-learning, el e-commerce y el e-government. Finalmente, reflexionar sobre la innovación tecnológica —la <strong>inteligencia artificial</strong> y la <strong>nanotecnología</strong>— nos prepara para los desafíos éticos del futuro digital.</p>`,
 glosario:[

 desafio:`<h4 class="font-bold text-slate-900 mb-2"><i class="fa-solid fa-people-group mr-2 text-accent"></i>Desafío grupal · "Un decálogo de ciudadanía digital para nuestra escuela"</h4>
<p class="text-sm text-slate-600 mb-2">El uso de las tecnologías en la escuela y la comunidad plantea dilemas éticos y de convivencia que merecen ser abordados. En equipos de 4 integrantes:</p>
<ol class="text-sm text-slate-600 list-decimal ml-5 space-y-1">
<li>Realicen un <strong>diagnóstico</strong> sobre una problemática real de ciudadanía digital en la comunidad escolar: ciberbullying, robo de identidad, uso indebido de información, falta de respeto en línea o desconocimiento de los derechos digitales.</li>
<li>Diseñen un <strong>decálogo de comportamiento y ética</strong> en el uso de las NTICx, con diez normas claras y fundamentadas.</li>
<li>Creen una <strong>campaña de concientización</strong> sobre la problemática elegida, utilizando un blog educativo, videos y materiales gráficos propios.</li>
<li>Respeten y promuevan el uso seguro, legal y ético de la información, citando apropiadamente todas las fuentes.</li>
<li>Difundan la campaña a través de <strong>herramientas de software social</strong> (blog, wiki, redes sociales educativas) dentro de la escuela.</li>
<li>Presenten el decálogo y la campaña a la comunidad educativa y propónganlos como recurso digital institucional.</li>
</ol>`,
 contexto:{
  argentina:`En Argentina, la ciudadanía digital está respaldada por un marco legal que protege a los usuarios: la Ley 25.326 de Habeas Data resguarda los datos personales, la Ley 11.723 protege la propiedad intelectual, y la legislación sobre delitos informáticos sanciona las conductas ilícitas en el entorno digital. El sistema educativo promueve la formación de ciudadanos digitales activos que utilicen las tecnologías de modo seguro, legal y ético, respetando los derechos de autor y previniendo riesgos como el robo de identidad y el ciberacoso. La democratización del ciberespacio y el acceso equitativo a Internet son desafíos centrales para reducir la brecha digital.`,
  bahiaBlanca:`En Bahía Blanca, la creciente digitalización de trámites, servicios y comunicaciones hace que los ciudadanos necesiten conocer sus derechos digitales y proteger sus datos personales. Las instituciones educativas, los organismos públicos y las organizaciones sociales de la ciudad enfrentan problemáticas vinculadas al uso responsable de las tecnologías, desde el ciberbullying escolar hasta la protección de información sensible. Formar ciudadanos digitales críticos y responsables contribuye a construir una comunidad local más segura, inclusiva y participativa en el entorno digital.`
